<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>바퀴</title>
<style>
:root{
  --ivory:#FBF4E4; --ivory2:#F3E9CF; --ink:#3A2412; --ink2:#6A4526; --edge:#C9A86C;
  --sans:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --serif:"Apple Myungjo","Nanum Myeongjo","Noto Serif KR","Batang",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#EBDFC0;font-family:var(--sans);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none;color:var(--ink)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;margin:0;-webkit-tap-highlight-color:transparent;touch-action:none}

/* 스틱 (2라운드) — 손을 대지 않아도 기본 자리에 흐리게 떠 있고, 손가락이 닿으면 그 자리로 옮겨간다 */
#stick{position:fixed;left:0;top:0;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;background:rgba(251,244,228,.10);border:2px solid rgba(251,244,228,.34);display:none;pointer-events:none;opacity:.45;transition:opacity .18s}
#stick.live{opacity:1;background:rgba(251,244,228,.16);border-color:rgba(251,244,228,.6)}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--ivory);box-shadow:0 2px 0 var(--edge),0 4px 10px rgba(0,0,0,.45)}

/* 1라운드 UI */
#r1ui{position:fixed;inset:0;display:none;pointer-events:none}
#r1ui>*{pointer-events:auto}
#wcol{position:fixed;right:calc(10px + env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
#bcol{position:fixed;left:calc(10px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
@media (max-height:540px){ #wcol{display:grid;grid-template-columns:repeat(2,60px)} }
.slot{width:60px;height:40px;border-radius:12px;background:var(--ivory);color:var(--ink);font-size:13px;font-weight:700;letter-spacing:-.02em;box-shadow:0 2px 0 var(--edge),0 4px 10px rgba(80,50,20,.28);display:grid;place-items:center;position:relative;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.slot.bait{background:var(--ivory2)}
.slot.sel{background:var(--ink);color:var(--ivory);transform:scale(1.06);box-shadow:0 2px 0 var(--ink2),0 4px 10px rgba(80,50,20,.35)}
.slot:active{transform:translateY(2px)}
#kills{position:fixed;left:calc(14px + env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top));font-family:var(--serif);font-size:30px;line-height:1;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.5);opacity:0;transition:opacity .4s}
#kills.show{opacity:.75}
#kills small{font-size:15px;margin-left:3px}

#quit{position:fixed;top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));padding:12px 18px;border-radius:999px;background:var(--ivory);color:var(--ink);font-size:15px;font-weight:600;line-height:1;box-shadow:0 2px 0 var(--edge),0 4px 12px rgba(80,50,20,.28);opacity:0;transition:opacity .7s;pointer-events:none}
#quit.show{opacity:1;pointer-events:auto}
#confirm{position:fixed;top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));display:none;flex-direction:column;gap:10px;align-items:flex-end}
#confirm.show{display:flex}
#confirm button{padding:13px 20px;border-radius:999px;font-size:16px;font-weight:600;line-height:1;box-shadow:0 2px 0 var(--edge),0 4px 12px rgba(80,50,20,.28)}
#confirm .stop{background:var(--ink);color:var(--ivory)}
#confirm .more{background:var(--ivory);color:var(--ink)}
#confirm button:active{transform:translateY(2px)}

/* 2라운드 UI */
#r2ui{position:fixed;inset:0;display:none;pointer-events:none}
#r2ui>*{pointer-events:auto}
/* 조작은 아래, 상태는 위 */
#pad{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;align-items:center}
.rbtn{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:700;line-height:1;position:relative;background:var(--ivory);color:var(--ink);box-shadow:0 2px 0 var(--edge),0 5px 14px rgba(0,0,0,.5)}
.rbtn:active{transform:translateY(2px)}
.rbtn.off{opacity:.4}
#egg{--p:0}
#egg::before{content:"";position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(var(--ivory) calc(var(--p)*1turn),rgba(0,0,0,.42) 0);-webkit-mask:radial-gradient(circle closest-side,transparent 76%,#000 77%);mask:radial-gradient(circle closest-side,transparent 76%,#000 77%)}
#egg.laid{background:var(--ivory2);color:var(--ink2)}
#egg.ready{box-shadow:0 2px 0 var(--edge),0 0 0 5px var(--ivory),0 0 22px 6px rgba(251,244,228,.75)}
#egg.danger{animation:eggblink .36s steps(2) infinite}
@keyframes eggblink{50%{opacity:.25}}
#egg.pop{animation:eggpop .5s ease-out}
@keyframes eggpop{0%{transform:scale(.6)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
#dash::after{content:"";position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(rgba(0,0,0,.45) calc(var(--c)*1turn),transparent 0);-webkit-mask:radial-gradient(circle closest-side,transparent 76%,#000 77%);mask:radial-gradient(circle closest-side,transparent 76%,#000 77%);--c:0}
#tapfx{position:fixed;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid rgba(251,244,228,.9);opacity:0;pointer-events:none}
#tapfx.go{animation:tapfx .45s ease-out}
@keyframes tapfx{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.8)}}

/* 미니맵 */
#mini{position:fixed;right:calc(12px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));width:88px;height:132px;border-radius:8px;background:rgba(22,14,7,.82);border:1px solid rgba(251,244,228,.3);box-shadow:0 2px 12px rgba(0,0,0,.55);display:none;pointer-events:none}
#mini.show{display:block}
/* 알집 상태 */
#eggbar{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);padding:7px 14px;border-radius:999px;background:rgba(20,12,6,.55);color:#F3E9CF;font-size:14px;font-weight:600;line-height:1;letter-spacing:-.01em;display:none;pointer-events:none;white-space:nowrap}
#eggbar.show{display:block}
#eggbar.warn{background:rgba(150,30,20,.72)}

/* 2라운드 신호·안내 */
#vig{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 38%,rgba(0,0,0,.82) 100%)}
#tox{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 30%,rgba(90,110,30,.75) 100%)}
#hint{position:fixed;left:50%;top:calc(62px + env(safe-area-inset-top));transform:translateX(-50%);max-width:82vw;text-align:center;font-family:var(--serif);font-size:18px;line-height:1.6;color:#F6EFDD;background:rgba(26,16,8,.66);padding:10px 16px;border-radius:16px;opacity:0;transition:opacity .5s;pointer-events:none;word-break:keep-all}
#hint.show{opacity:1}
#hint.dark{color:#3A2412;background:rgba(251,244,228,.88);box-shadow:0 2px 0 var(--edge)}
#genlabel{position:fixed;left:0;right:0;top:33%;text-align:center;font-family:var(--serif);font-size:44px;letter-spacing:.06em;color:#F3E9CF;text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 20px rgba(0,0,0,.8);opacity:0;transition:opacity .7s;pointer-events:none}
#genlabel.show{opacity:1}
#genlabel small{display:block;font-size:17px;letter-spacing:.02em;margin-top:10px;opacity:.85}

#deathfx{position:fixed;inset:0;width:100%;height:100%;display:none;pointer-events:none;z-index:20}
#deathfx.show{display:block}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}

#endtext{
  position:fixed;
  inset:0;
  display:none;
  place-items:center;
  padding:32px;
  text-align:center;
  background:#000;
  color:#F3E9CF;
  font-family:var(--serif);
  font-size:30px;
  line-height:1.55;
  letter-spacing:.02em;
  pointer-events:none
}

#endtext .eyebrow{
  display:block;
  margin-bottom:18px;
  font-family:var(--sans);
  font-size:13px;
  font-weight:700;
  letter-spacing:.16em;
  color:rgba(243,233,207,.58)
}

#endtext .tools{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:9px;
  max-width:560px
}

#endtext .tools span{
  padding:8px 13px;
  border:1px solid rgba(243,233,207,.38);
  border-radius:999px;
  font-family:var(--sans);
  font-size:16px;
  line-height:1
}

#endtext .baitline{
  margin-top:18px;
  font-family:var(--sans);
  font-size:14px;
  line-height:1.6;
  color:rgba(243,233,207,.64);
  word-break:keep-all
}




#rank{position:fixed;inset:0;display:none;background:var(--ivory2);color:var(--ink);font-family:var(--serif)}
#rank .now{position:absolute;left:0;right:0;top:22%;text-align:center;font-size:92px;line-height:1;letter-spacing:-.02em}
#rank .now small{font-size:38px;letter-spacing:.06em;margin-left:6px}
#rank .sub{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:18px;color:var(--ink2);line-height:1.7;padding:0 24px;word-break:keep-all}
#rank .list{position:absolute;left:0;right:0;top:54%;text-align:center;font-size:18px;line-height:1.85;color:var(--ink2)}
#rank .list div:first-child{color:var(--ink)}
#rank .list div.me{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:4px}
#rank .list .gap{opacity:.5;line-height:1.2}
#rank .again{position:absolute;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));text-align:center;font-size:16px;color:var(--ink2);opacity:.8;font-family:var(--sans)}
#rank .allover{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(34px + env(safe-area-inset-bottom));padding:11px 20px;border-radius:999px;background:var(--ivory);font-size:14px;font-weight:600;font-family:var(--sans);box-shadow:0 2px 0 var(--edge)}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="stick"><div id="knob"></div></div>

  <div id="r1ui">
    <div id="wcol"></div>
    <div id="bcol"></div>
    <div id="kills"><span class="n">0</span><small>마리</small></div>
    <div id="quit">그만할까?</div>
    <div id="confirm">
      <button class="stop">그만하기</button>
      <button class="more">계속하기</button>
    </div>
  </div>

  <div id="r2ui">
    <canvas id="mini" width="176" height="264"></canvas>
    <div id="eggbar"></div>

    <div id="pad">
      <button id="egg" class="rbtn">알 낳기</button>
      <button id="dash" class="rbtn">달리기</button>
    </div>

    <div id="tapfx"></div>
  </div>

<div id="vig"></div>
  <div id="tox"></div>
  <canvas id="deathfx"></canvas>
  <div id="hint"></div>
  <div id="genlabel"></div>
  <div id="fade"></div>
  <div id="endtext"></div>

  <div id="rank">
    <div class="now"></div>
    <div class="sub"></div>
    <div class="list"></div>
    <div class="again">화면을 누르면 같은 조건으로 다시</div>
    <button class="allover">처음부터</button>
  </div>




</div>

<script type="module">
import * as THREE from 'three';

// ───────── 공통 ─────────
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const TAU=Math.PI*2;
const wrapAng=a=>((a+Math.PI)%TAU+TAU)%TAU-Math.PI;
const angleLerp=(a,b,t)=>a+wrapAng(b-a)*t;
const damp=(a,b,rate,dt)=>lerp(a,b,1-Math.exp(-rate*dt));
const angleDamp=(a,b,rate,dt)=>angleLerp(a,b,1-Math.exp(-rate*dt));
const dist2=(ax,az,bx,bz)=>{const dx=ax-bx,dz=az-bz;return dx*dx+dz*dz;};
const now=()=>performance.now()/1000;

// ───────── 방 ─────────
const ROOM={x1:-2,x2:2,z1:-3,z2:3,h:2.4};
const OBST=[
  {n:'counter',x1:-2,z1:1.2,x2:-1.45,z2:2.45,h:0.86,roach:false,human:false},
  {n:'fridge',x1:-2,z1:0.2,x2:-1.4,z2:0.9,h:1.4,roach:false,human:false},
  {n:'bed',x1:0.9,z1:-2.9,x2:2,z2:-0.9,h:0.45,roach:false,human:false},
  {n:'desk',x1:-1.6,z1:-3,x2:-0.2,z2:-2.4,h:0.72,roach:true,human:false},
  {n:'chair',x1:-1.1,z1:-2.3,x2:-0.7,z2:-1.9,h:0.45,roach:true,human:false},
  {n:'shelf',x1:0.2,z1:-3,x2:0.9,z2:-2.7,h:1.8,roach:false,human:false},
  {n:'trash',x1:0.55,z1:2.45,x2:0.95,z2:2.85,h:0.5,roach:false,human:false},
];
// 숨는 자리: 구멍 5곳 + 방석 밑 + 책상 밑. 사람은 이 자리들을 차례로 뒤진다.
const HOLES=[
  {n:'fridge',label:'냉장고 밑',x:-1.52,z:0.55,dx:1,dz:0,hole:true},
  {n:'sink',label:'싱크대 밑',x:-1.52,z:1.7,dx:1,dz:0,hole:true},
  {n:'drain',label:'하수구',x:-1.78,z:2.8,dx:0.93,dz:-0.37,hole:true},
  {n:'crack',label:'벽지 틈',x:1.94,z:0.2,dx:-1,dz:0,hole:true},
  {n:'shelf',label:'책장 뒤',x:0.55,z:-2.66,dx:0,dz:1,hole:true},
  {n:'cushion',label:'방석 밑',x:0.1,z:-0.4,dx:0,dz:1,r:0.2,cushion:true},
  {n:'desk',label:'책상 밑',x:-0.9,z:-2.7,dx:0,dz:1,rect:true,rx:0.66,rz:0.27},
];
const HOLE_LIST=HOLES.filter(h=>h.hole);
const CUSHION=HOLES.find(h=>h.n==='cushion');
const HOLE_R=0.17;
const inSpot=(h,x,z)=>h.rect?(Math.abs(x-h.x)<h.rx&&Math.abs(z-h.z)<h.rz):dist2(x,z,h.x,h.z)<(h.r||HOLE_R)*(h.r||HOLE_R);
function spotAt(x,z){ for(const h of HOLES){ if(inSpot(h,x,z)) return h; } return null; }
const ROACH_L=0.13;           // 바퀴 몸길이 (연출상 실물의 3배쯤 — 폰에서 손가락으로 잡히는 크기)
const LAMP_POS=new THREE.Vector3(-0.55,1.08,-2.72);
const SWITCH_STAND={x:0.2,z:2.55};
const BEDSIDE={x:0.55,z:-1.55};

function inObst(o,x,z,m=0){return x>o.x1-m&&x<o.x2+m&&z>o.z1-m&&z<o.z2+m;}
function nearHole(x,z,r){ if(r===undefined) return spotAt(x,z); let best=null,bd=1e9; for(const h of HOLES){ if(h.rect) continue; const d=dist2(x,z,h.x,h.z); if(d<r*r&&d<bd){bd=d;best=h;} } return best; }
function roachMove(x,z,nx,nz){
  const m=0.025;
  const ok=(px,pz)=>{
    if(px<ROOM.x1+m||px>ROOM.x2-m||pz<ROOM.z1+m||pz>ROOM.z2-m) return false;
    if(nearHole(px,pz,HOLE_R)) return true;
    for(const o of OBST){ if(!o.roach&&inObst(o,px,pz,0.01)) return false; }
    return true;
  };
  if(ok(nx,nz)) return [nx,nz];
  if(ok(nx,z)) return [nx,z];
  if(ok(x,nz)) return [x,nz];
  return [x,z];
}

// ───────── 소리 ─────────
class AudioFX{
  constructor(){this.ctx=null;this.loops={};}
  ensure(){
    if(!this.ctx){
      const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
      try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(err){}
      this.ctx=new C();
      this.master=this.ctx.createGain(); this.master.gain.value=0.85;
      this.comp=this.ctx.createDynamicsCompressor(); this.comp.threshold.value=-14; this.comp.ratio.value=5; this.comp.attack.value=0.002; this.comp.release.value=0.12;
      this.master.connect(this.comp); this.comp.connect(this.ctx.destination);
      const len=this.ctx.sampleRate*2, buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      this.noiseBuf=buf;
    }
    if(this.ctx.state==='suspended') this.ctx.resume().catch(()=>{});
  }
  get t(){return this.ctx?this.ctx.currentTime:0;}
  env(g,t,att,dur,peak){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002),t+att); g.gain.exponentialRampToValueAtTime(0.0001,t+att+dur); }
  noise({t=0,dur=0.1,gain=0.5,att=0.002,type='bandpass',freq=2000,q=1,freqEnd=null,rate=1,pan=0,trem=0}={}){
    if(!this.ctx) return; const c=this.ctx, t0=c.currentTime+t;
    const s=c.createBufferSource(); s.buffer=this.noiseBuf; s.loop=true; s.playbackRate.value=rate;
    s.start(t0,Math.random()*1.5);
    const f=c.createBiquadFilter(); f.type=type; f.frequency.setValueAtTime(freq,t0); f.Q.value=q;
    if(freqEnd) f.frequency.exponentialRampToValueAtTime(Math.max(20,freqEnd),t0+att+dur);
    const g=c.createGain(); this.env(g,t0,att,dur,gain);
    let node=g;
    if(trem>0){ const tg=c.createGain(); const n=Math.floor((att+dur)*trem*2)+2; const arr=new Float32Array(n); for(let i=0;i<n;i++) arr[i]=0.35+0.65*(i%2); tg.gain.setValueCurveAtTime(arr,t0,att+dur+0.01); g.connect(tg); node=tg; }
    const p=c.createStereoPanner(); p.pan.value=clamp(pan,-1,1);
    s.connect(f); f.connect(g); node.connect(p); p.connect(this.master);
    s.stop(t0+att+dur+0.05);
  }
  tone({t=0,dur=0.1,gain=0.3,att=0.002,freq=200,freqEnd=null,type='sine',pan=0}={}){
    if(!this.ctx) return; const c=this.ctx, t0=c.currentTime+t;
    const o=c.createOscillator(); o.type=type; o.frequency.setValueAtTime(freq,t0);
    if(freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(20,freqEnd),t0+att+dur);
    const g=c.createGain(); this.env(g,t0,att,dur,gain);
    const p=c.createStereoPanner(); p.pan.value=clamp(pan,-1,1);
    o.connect(g); g.connect(p); p.connect(this.master); o.start(t0); o.stop(t0+att+dur+0.05);
  }
  loop(name,make){ if(!this.ctx||this.loops[name]) return; const c=this.ctx; const g=c.createGain(); g.gain.setValueAtTime(0.0001,c.currentTime); g.connect(this.master); const nodes=make(c,g); this.loops[name]={g,nodes}; g.gain.exponentialRampToValueAtTime(1,c.currentTime+0.06); }
  stopLoop(name){ const L=this.loops[name]; if(!L) return; const c=this.ctx; L.g.gain.cancelScheduledValues(c.currentTime); L.g.gain.setValueAtTime(L.g.gain.value||0.5,c.currentTime); L.g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.12); setTimeout(()=>{L.nodes.forEach(n=>{try{n.stop();}catch(e){}});},200); delete this.loops[name]; }
  setLoopGain(name,v){ const L=this.loops[name]; if(!L) return; L.g.gain.setTargetAtTime(Math.max(0.0001,v),this.ctx.currentTime,0.05); }

  // ── 바퀴가 눌려 죽는 소리. 1라운드와 2라운드가 같은 소리다. ──

function texFloor(){
  const c=document.createElement('canvas'); c.width=c.height=1024; const g=c.getContext('2d');
  g.fillStyle='#E2AC46'; g.fillRect(0,0,1024,1024);
  const plank=1024/4;
  for(let p=0;p<4;p++){
    const x0=p*plank; g.fillStyle=`hsl(${36+rand(-2,2)},${64+rand(-4,4)}%,${55+rand(-1.5,1.5)}%)`; g.fillRect(x0,0,plank,1024);
    for(let i=0;i<70;i++){ g.strokeStyle=`hsla(30,55%,${30+rand(20)}%,${rand(0.05,0.14)})`; g.lineWidth=rand(0.6,2.2); g.beginPath(); const y=rand(1024); g.moveTo(x0+rand(-20,20),y); for(let k=1;k<=6;k++) g.lineTo(x0+k*plank/6+rand(-14,14),y+rand(-40,40)); g.stroke(); }
    g.fillStyle='rgba(120,70,20,0.35)'; g.fillRect(x0,0,2,1024); g.fillStyle='rgba(255,240,200,0.25)'; g.fillRect(x0+2,0,2,1024);
  }
  const id=g.getImageData(0,0,1024,1024), d=id.data; for(let i=0;i<d.length;i+=4){ const n=rand(-10,10); d[i]+=n; d[i+1]+=n; d[i+2]+=n; } g.putImageData(id,0,0);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(4/1.2,6/1.2); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
function texWall(){
  const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
  g.fillStyle='#F4EBD6'; g.fillRect(0,0,256,256);
  g.fillStyle='rgba(200,170,120,0.35)'; for(let y=0;y<256;y+=32) for(let x=0;x<256;x+=32){ g.beginPath(); g.arc(x+16+((y/32)%2)*8,y+16,2,0,TAU); g.fill(); }
  const id=g.getImageData(0,0,256,256), d=id.data; for(let i=0;i<d.length;i+=4){ const n=rand(-6,6); d[i]+=n; d[i+1]+=n; d[i+2]+=n; } g.putImageData(id,0,0);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(8,4); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function texTile(){
  const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
  g.fillStyle='#B9B4A8'; g.fillRect(0,0,256,256); g.fillStyle='#CFCABD'; for(let y=0;y<2;y++) for(let x=0;x<2;x++){ g.fillRect(x*128+4,y*128+4,120,120); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(4,2); t.colorSpace=THREE.SRGBColorSpace; return t;
}

let _ootheca=null;
function oothecaGeo(){
  if(_ootheca) return _ootheca;
  const L=0.032, H=0.031, W=0.0135, U=44, Vn=28;
  const cBody=rgb(0x8a4219), cDark=rgb(0x3e1908), cRib=rgb(0x4a1c09), cKeel=rgb(0x3a1406);
  const P=(u,v)=>{ const t=u*2-1, e=Math.pow(Math.max(0,1-Math.pow(Math.abs(t),2.4)),0.5);
    const th=v*TAU, c=Math.cos(th), s=Math.sin(th);
    let z=W*e*Math.sign(c)*Math.pow(Math.abs(c),2/2.6), y=H*0.5*(1+Math.sign(s)*Math.pow(Math.abs(s),2/2.4));
    const up=clamp(s,0,1); z*=1-0.6*Math.pow(up,1.8);                                  // 위로 갈수록 좁아져 솔기가 된다
    y=y*(0.55+0.45*e);                                                                   // 양 끝은 둥글게 낮아진다
    y+=0.0022*Math.pow(up,8)*Math.pow(Math.abs(Math.sin(t*Math.PI*8.5)),0.6)*e;          // 솔기의 톱니
    z*=1-0.07*Math.pow(Math.abs(Math.cos(t*Math.PI*7.5)),8)*(1-up)*Math.abs(c);          // 알 칸 사이마다 옆면이 옴폭 팬 골
    return [t*L,y,z]; };
  const g=gridGeo(U,Vn,P,true,false);
  const B=new GeoBuilder();
  B.add(g,(p,w,i)=>{ const u=Math.floor(i/Vn)/U, v=(i%Vn)/Vn, t=u*2-1, s=Math.sin(v*TAU), up=clamp(s,0,1);
    let c=rgbMix(cBody,cDark,sstep(0.7,1,Math.abs(t))*0.7); c=rgbMix(c,cKeel,sstep(0.75,0.98,up));
    if(Math.pow(Math.abs(Math.cos(t*Math.PI*7.5)),8)>0.45&&up<0.75) c=rgbMix(c,cRib,0.65);
    return c; });
  _ootheca=B.build(); return _ootheca;
}

class GeoBuilder{
  constructor(){ this.pos=[]; this.nrm=[]; this.col=[]; this.idx=[]; }
  add(geo,cs,place,warp,M,post){
    const P=geo.attributes.position, C=geo.attributes.color, n=P.count;
    const v=new THREE.Vector3(), w=new THREE.Vector3(); const pa=new Float32Array(n*3), ca=[];
    for(let i=0;i<n;i++){
      v.fromBufferAttribute(P,i); w.copy(v); if(place) w.applyMatrix4(place);
      let c=typeof cs==='function'?cs(v,w,i):cs?cs:[C.getX(i),C.getY(i),C.getZ(i)];
      if(post) c=post(c,w,i);
      if(warp) warp(w,i);
      if(M) w.applyMatrix4(M);
      pa[i*3]=w.x; pa[i*3+1]=w.y; pa[i*3+2]=w.z; ca.push(c[0],c[1],c[2]);
    }
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pa,3));
    if(geo.index) g.setIndex(Array.from(geo.index.array)); g.computeVertexNormals();
    const base=this.pos.length/3, N=g.attributes.normal;
    for(let i=0;i<n;i++){ this.pos.push(pa[i*3],pa[i*3+1],pa[i*3+2]); this.nrm.push(N.getX(i),N.getY(i),N.getZ(i)); this.col.push(ca[i*3],ca[i*3+1],ca[i*3+2]); }
    if(geo.index){ const I=geo.index.array; for(let k=0;k<I.length;k++) this.idx.push(base+I[k]); } else for(let k=0;k<n;k++) this.idx.push(base+k);
    g.dispose(); return this;
  }
  build(){ const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(this.pos,3)); g.setAttribute('normal',new THREE.Float32BufferAttribute(this.nrm,3)); g.setAttribute('color',new THREE.Float32BufferAttribute(this.col,3)); g.setIndex(this.idx); g.computeBoundingSphere(); return g; }
}
// 격자 곡면 (u 0..1 × v 0..1). wrapV면 v 방향으로 닫는다.
function gridGeo(U,Vn,fn,wrapV=false,flip=false){
  const pos=[],idx=[]; const VV=wrapV?Vn:Vn+1;
  for(let i=0;i<=U;i++) for(let j=0;j<VV;j++){ const p=fn(i/U,j/Vn); pos.push(p[0],p[1],p[2]); }
  for(let i=0;i<U;i++) for(let j=0;j<Vn;j++){ const a=i*VV+j, b=(i+1)*VV+j, c=(i+1)*VV+(wrapV?(j+1)%VV:j+1), d=i*VV+(wrapV?(j+1)%VV:j+1); flip?idx.push(a,c,b,a,d,c):idx.push(a,b,c,a,c,d); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx); return g;
}

  // 첫 시체가 나올 때마다 모양을 만들면 순간 끊긴다. 게임을 시작하면 틈틈이 하나씩 미리 만들어 둔다.
  prewarm(){ const jobs=[]; for(const mode in CORPSE_VARIANTS) for(let v=0;v<CORPSE_VARIANTS[mode];v++) jobs.push(()=>this.variant(mode,v));
    for(const st of ['splayP','splayN','curl','fold']) for(let i=0;i<3;i++) jobs.push(()=>this.legs(st,i));

    const V=this.variant(mode,Math.floor(Math.random()*CORPSE_VARIANTS[mode]));

      si:this.alloc(V.shell),gi:V.goo?this.alloc(V.goo):-1,legs:V.legs.map(L=>{ const m=this.legs(L.style,L.i); return {L,m,i:this.alloc(m),ph:rand(TAU),f:rand(9,17)}; })};

  }
  base(c,out){ const d=this.d; d.position.set(c.x,0,c.z); d.rotation.set(0,c.h,0); d.scale.setScalar(c.sc); d.updateMatrix(); return out.copy(d.matrix); }
  place(c){

  }
  drop(c){ if(!c.alive) return; c.alive=false; this.release(c.V.shell,c.si); if(c.V.goo) this.release(c.V.goo,c.gi); for(const g of c.legs) this.release(g.m,g.i); this.twitching.delete(c); }
  // 청소기: 흡입 범위 안의 시체를 노즐 쪽으로 끌어오다가 가까우면 빨아들인다. 바닥에 밴 진물 자국은 남는다.
  suck(hx,hz,inside,dt){
    let eaten=0;
    for(const c of this.list){ if(!c||!c.alive||!inside(c.x,c.z)) continue;
      const dx=hx-c.x, dz=hz-c.z, d=Math.hypot(dx,dz);

    return eaten;
  }
}

// ───────── 입력 ─────────
// 1라운드: 닿는 손가락마다 그 자리 행동(양손 연타 가능). 두 손가락 이상이 함께 끌리면 화면 이동. 마우스는 왼쪽 = 행동, 오른쪽 끌기 = 화면 이동.
// 2라운드: 왼쪽 절반에 손가락을 대면 그 자리에 스틱이 생긴다. 손을 떼면 스틱은 기본 자리로 돌아가 흐리게 떠 있다.

    this.mouse={x:innerWidth/2,y:innerHeight/2,live:false}; this.lastType='touch'; this.look={dx:0,dy:0}; this.lookId=null; this.lookOn=false;

    window.addEventListener('keyup',e=>{ this.keys.delete(e.code); this.onKey&&this.onKey(e.code,false); });
    canvas.addEventListener('contextmenu',e=>e.preventDefault());
    window.addEventListener('blur',()=>{ this.keys.clear(); this.reset(); });
    window.addEventListener('resize',()=>{ if(!this.stick.active) this.idleStick(); });
  }
  set mode(v){ this._mode=v; if(v==='r2') this.idleStick(); else { this.el.style.display='none'; this.el.classList.remove('live'); } }
  get mode(){ return this._mode; }

  // 스틱은 터치로 조작할 때만 보인다 (마우스·키보드로 할 때는 쓸 수 없으니 숨긴다)

  up(e){
    const p=this.pointers.get(e.pointerId); if(!p) return; this.pointers.delete(e.pointerId);

  }
  keyVec(arrows=true){ let x=0,y=0; const k=this.keys; if(k.has('KeyW')||(arrows&&k.has('ArrowUp'))) y-=1; if(k.has('KeyS')||(arrows&&k.has('ArrowDown'))) y+=1; if(k.has('KeyA')||(arrows&&k.has('ArrowLeft'))) x-=1; if(k.has('KeyD')||(arrows&&k.has('ArrowRight'))) x+=1; const d=Math.hypot(x,y); return d?[x/d,y/d]:[0,0]; }

}

class Splatter{
  constructor(scene,paint){
    this.n=320; this.paint=paint; const geo=new THREE.SphereGeometry(1,6,5);
    this.mesh=new THREE.InstancedMesh(geo,M.gloss(0xffffff,{roughness:0.3}),this.n); this.mesh.castShadow=false; this.mesh.frustumCulled=false; scene.add(this.mesh); this.cream=new THREE.Color(); this.gutCol=new THREE.Color(0x3a2210); for(let i=0;i<this.n;i++) this.mesh.setColorAt(i,this.gutCol);
    this.p=[]; for(let i=0;i<this.n;i++) this.p.push({on:false,x:0,y:0,z:0,vx:0,vy:0,vz:0,r:0.01,yel:false});
    this.dummy=new THREE.Object3D(); this.next=0; this.color=new THREE.Color(); this.L=0; this.hideAll();
  }
  hideAll(){ for(let i=0;i<this.n;i++){ this.p[i].on=false; this.dummy.position.set(0,-10,0); this.dummy.scale.setScalar(0.0001); this.dummy.updateMatrix(); this.mesh.setMatrixAt(i,this.dummy.matrix); } this.mesh.instanceMatrix.needsUpdate=true; }
  setLevel(L){ this.L=L; this.cream.setHSL(lerp(47,42,L)/360,lerp(0.42,0.48,L),lerp(0.86,0.8,L)); }
  burst(x,z,dx,dz,count,power=1){
    const base=Math.atan2(dz,dx);
    for(let i=0;i<count;i++){ const q=this.p[this.next]; this.next=(this.next+1)%this.n; const a=base+rand(-0.9,0.9), sp=rand(0.3,1.5)*power; q.on=true; q.x=x; q.z=z; q.y=0.02; q.vx=Math.cos(a)*sp; q.vz=Math.sin(a)*sp; q.vy=rand(0.5,1.8)*power; q.r=rand(0.004,0.012); q.yel=Math.random()<0.25; q.gut=Math.random()<0.2; this.mesh.setColorAt(this.next===0?this.n-1:this.next-1,q.gut?this.gutCol:this.cream); }
    if(this.mesh.instanceColor) this.mesh.instanceColor.needsUpdate=true;
  }
  update(dt){
    let any=false;
    for(let i=0;i<this.n;i++){ const q=this.p[i]; if(!q.on) continue; any=true;
      q.vy-=9.8*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.z+=q.vz*dt;
      if(q.y<=0){ q.on=false; if(q.x>ROOM.x1&&q.x<ROOM.x2&&q.z>ROOM.z1&&q.z<ROOM.z2) this.paint.drop(q.x,q.z,q.r*1.6,this.L,q.yel,q.gut); this.dummy.position.set(0,-10,0); this.dummy.scale.setScalar(0.0001); }

      this.dummy.updateMatrix(); this.mesh.setMatrixAt(i,this.dummy.matrix);
    }
    if(any) this.mesh.instanceMatrix.needsUpdate=true;
  }

// ───────── 뿌리기/불꽃/흡입 입자 ─────────

    this.dummy=new THREE.Object3D(); this.next=0; this.col=new THREE.Color();

  }

  emit(kind,x,y,z,dx,dz,n=3,spd=1.6){
    const base=Math.atan2(dz,dx);
    for(let i=0;i<n;i++){ const q=this.p[this.next]; this.next=(this.next+1)%this.n; const a=base+rand(-0.3,0.3), s=rand(0.5,1)*spd; q.on=true; q.kind=kind; q.x=x; q.y=y; q.z=z; q.vx=Math.cos(a)*s; q.vz=Math.sin(a)*s; q.vy=kind==='flame'?(y>0.3?rand(-2.2,-1.2):rand(0.2,0.6)):(y>0.3?rand(-2.6,-1.4):rand(-0.25,0.05)); q.life=kind==='flame'?(y>0.3?rand(0.45,0.7):rand(0.18,0.35)):(y>0.3?rand(0.7,1.1):rand(0.35,0.7)); q.r=kind==='flame'?rand(0.012,0.03):rand(0.01,0.025); }
  }
  update(dt){
    let any=false;
    for(let i=0;i<this.n;i++){ const q=this.p[i]; if(!q.on) continue; any=true; q.life-=dt;
      if(q.life<=0||q.y<0){ q.on=false; this.dummy.position.set(0,-10,0); this.dummy.scale.setScalar(0.0001); }
      else { q.x+=q.vx*dt; q.y+=q.vy*dt; q.z+=q.vz*dt; q.vx*=0.94; q.vz*=0.94; const grow=q.kind==='flame'?1+ (0.35-q.life)*1.5:1+dt*2; this.dummy.position.set(q.x,q.y,q.z); this.dummy.scale.setScalar(q.r*grow);
        if(q.kind==='flame'){ const k=clamp(q.life/0.35,0,1); this.col.setRGB(1,0.25+0.7*k*k,0.02+0.5*k*k*k); } else this.col.setRGB(0.93,0.96,1);

      this.dummy.updateMatrix(); this.mesh.setMatrixAt(i,this.dummy.matrix);
    }
    if(any){ this.mesh.instanceMatrix.needsUpdate=true; if(this.mesh.instanceColor) this.mesh.instanceColor.needsUpdate=true; }
  }
}




// ───────── 2라운드 죽음 화면 ─────────
class DeathFX{
  constructor(G){
    this.G=G;
    this.c=document.getElementById('deathfx');
    this.g=this.c.getContext('2d');
    this.active=false;
    this.duration=2.3;
    this.w=1;
    this.h=1;
    this.drops=[];
    this.shards=[];
    this.tears=[];
    window.addEventListener('resize',()=>{ if(this.active) this.resize(); });
  }

  resize(){
    this.w=Math.max(1,innerWidth);
    this.h=Math.max(1,innerHeight);
    this.dpr=Math.min(devicePixelRatio||1,1.5);
    this.c.width=Math.round(this.w*this.dpr);
    this.c.height=Math.round(this.h*this.dpr);
    this.g.setTransform(this.dpr,0,0,this.dpr,0,0);
  }

  start(type){
    this.stop();
    this.active=true;
    this.type=type;
    this.t=0;
    this.roll=Math.random()<0.5?-1:1;
    this.resize();
    this.c.classList.add('show');

    const slow=type==='poison'||type==='trap';
    const cx=this.w*0.5;
    const cy=this.h*(type==='trap'?0.62:0.47);
    const fluidN=type==='crush'?42:type==='flame'?18:type==='vacuum'?14:20;
    const shardN=type==='crush'?18:type==='flame'?11:type==='vacuum'?8:7;

    this.drops=[];
    for(let i=0;i<fluidN;i++){
      this.drops.push({
        birth:slow?rand(0.08,1.28):rand(0.025,0.30),
        life:slow?rand(0.55,1.05):rand(0.52,0.95),
        x:cx+rand(-this.w*0.035,this.w*0.035),
        y:cy+rand(-this.h*0.025,this.h*0.025),
        vx:slow?rand(-this.w*0.09,this.w*0.09):rand(-this.w*0.55,this.w*0.55),
        vy:slow?rand(this.h*0.04,this.h*0.24):rand(-this.h*0.96,-this.h*0.16),
        gravity:slow?rand(this.h*0.18,this.h*0.48):rand(this.h*1.25,this.h*2.15),
        len:slow?rand(8,26):rand(16,58),
        width:rand(1.2,4.6),
        dark:Math.random()<(type==='flame'?0.48:0.22)
      });
    }

    this.shards=[];
    for(let i=0;i<shardN;i++){
      this.shards.push({
        birth:rand(0.035,0.42),
        life:rand(0.55,1.05),
        x:cx+rand(-this.w*0.025,this.w*0.025),
        y:cy+rand(-this.h*0.02,this.h*0.02),
        vx:rand(-this.w*0.48,this.w*0.48),
        vy:rand(-this.h*0.72,-this.h*0.06),
        gravity:rand(this.h*1.0,this.h*1.8),
        rot:rand(TAU),
        vr:rand(-10,10),
        w:rand(2,6),
        h:rand(10,34)
      });
    }

    this.tears=[];
    for(let i=0;i<12;i++){
      this.tears.push({
        birth:rand(0.10,1.68),
        life:rand(0.045,0.19),
        y:rand(0,this.h),
        h:rand(4,22),
        x:rand(-this.w*0.08,this.w*0.58),
        w:rand(this.w*0.28,this.w*0.78)
      });
    }

    this.G.canvas.style.transformOrigin='50% 50%';
    this.G.canvas.style.willChange='transform,filter';
  }

  stop(){
    this.active=false;
    this.c.classList.remove('show');
    this.g.clearRect(0,0,this.w||1,this.h||1);
    this.G.canvas.style.transform='';
    this.G.canvas.style.filter='';
    this.G.canvas.style.willChange='';
  }

  drawDrops(){
    const g=this.g;
    g.lineCap='round';

    for(const p of this.drops){
      const a=this.t-p.birth;
      if(a<0||a>p.life) continue;

      const alpha=clamp(1-a/p.life,0,1);
      const x=p.x+p.vx*a;
      const y=p.y+p.vy*a+0.5*p.gravity*a*a;
      const speedY=p.vy+p.gravity*a;
      const mag=Math.max(1,Math.hypot(p.vx,speedY));
      const tx=p.vx/mag*p.len;
      const ty=speedY/mag*p.len;

      g.strokeStyle=p.dark
        ? `rgba(62,35,18,${alpha*0.82})`
        : `rgba(246,240,216,${alpha*0.92})`;
      g.lineWidth=p.width;
      g.beginPath();
      g.moveTo(x-tx,y-ty);
      g.lineTo(x,y);
      g.stroke();
    }
  }

  drawShards(){
    const g=this.g;
    for(const p of this.shards){
      const a=this.t-p.birth;
      if(a<0||a>p.life) continue;

      const alpha=clamp(1-a/p.life,0,1);
      const x=p.x+p.vx*a;
      const y=p.y+p.vy*a+0.5*p.gravity*a*a;
      g.save();
      g.translate(x,y);
      g.rotate(p.rot+p.vr*a);
      g.fillStyle=`rgba(54,29,14,${alpha*0.9})`;
      g.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      g.restore();
    }
  }

  drawTears(){
    const g=this.g;
    for(const q of this.tears){
      const a=this.t-q.birth;
      if(a<0||a>q.life) continue;

      const k=clamp(1-a/q.life,0,1);
      g.beginPath();
      g.moveTo(q.x,q.y);
      for(let i=1;i<=7;i++){
        g.lineTo(q.x+q.w*i/7,q.y+rand(-q.h,q.h));
      }
      for(let i=7;i>=0;i--){
        g.lineTo(q.x+q.w*i/7,q.y+q.h+rand(-q.h*0.35,q.h*0.35));
      }
      g.closePath();
      g.fillStyle=`rgba(0,0,0,${0.35+0.62*k})`;
      g.fill();

      g.strokeStyle=`rgba(248,241,218,${0.16*k})`;
      g.lineWidth=1;
      g.stroke();
    }
  }

  drawCrush(){
    const g=this.g,t=this.t,w=this.w,h=this.h;
    if(t<0.085){
      g.fillStyle=`rgba(255,250,229,${1-t/0.085})`;
      g.fillRect(0,0,w,h);
    }

    const edge=clamp((t-0.22)/1.35,0,0.82);
    const gr=g.createRadialGradient(w*0.5,h*0.5,0,w*0.5,h*0.5,Math.max(w,h)*0.72);
    gr.addColorStop(0,'rgba(0,0,0,0)');
    gr.addColorStop(0.48,`rgba(0,0,0,${edge*0.25})`);
    gr.addColorStop(1,`rgba(0,0,0,${edge})`);
    g.fillStyle=gr;
    g.fillRect(0,0,w,h);

    if(
      (t>0.22&&t<0.255)||
      (t>0.43&&t<0.485)||
      (t>0.76&&t<0.82)||
      (t>1.12&&t<1.17)
    ){
      g.fillStyle='rgba(0,0,0,0.78)';
      g.fillRect(0,0,w,h);
    }
  }

  drawVacuum(){
    const g=this.g,t=this.t,w=this.w,h=this.h;
    const p=clamp(t/1.45,0,1);
    const r=Math.max(6,Math.min(w,h)*(0.48-0.39*p));
    const gr=g.createRadialGradient(w*0.5,h*0.5,r*0.08,w*0.5,h*0.5,r*2.2);
    gr.addColorStop(0,'rgba(0,0,0,0)');
    gr.addColorStop(0.34,`rgba(0,0,0,${0.08+0.22*p})`);
    gr.addColorStop(1,`rgba(0,0,0,${0.58+0.34*p})`);
    g.fillStyle=gr;
    g.fillRect(0,0,w,h);

    g.strokeStyle=`rgba(238,236,218,${0.16*(1-p)})`;
    g.lineWidth=1.2;
    for(let i=0;i<18;i++){
      const a=i/18*TAU+t*4.5;
      const x=w*0.5+Math.cos(a)*Math.max(w,h);
      const y=h*0.5+Math.sin(a)*Math.max(w,h);
      g.beginPath();
      g.moveTo(x,y);
      g.lineTo(w*0.5,h*0.5);
      g.stroke();
    }
  }

  drawFlame(){
    const g=this.g,t=this.t,w=this.w,h=this.h;
    const flash=clamp(1-t/0.28,0,1);
    g.fillStyle=`rgba(255,172,62,${0.42*flash})`;
    g.fillRect(0,0,w,h);

    const burn=clamp((t-0.16)/1.6,0,1);
    const gr=g.createRadialGradient(w*0.5,h*0.48,0,w*0.5,h*0.48,Math.max(w,h)*0.68);
    gr.addColorStop(0,`rgba(255,238,184,${0.08*(1-burn)})`);
    gr.addColorStop(0.42,`rgba(95,27,4,${0.15+0.2*burn})`);
    gr.addColorStop(1,`rgba(0,0,0,${0.56+0.38*burn})`);
    g.fillStyle=gr;
    g.fillRect(0,0,w,h);
  }

  drawPoison(){
    const g=this.g,t=this.t,w=this.w,h=this.h;
    const p=clamp(t/1.8,0,1);
    g.fillStyle=`rgba(80,92,28,${0.08+0.16*p})`;
    g.fillRect(0,0,w,h);

    const bands=3+Math.floor(p*5);
    for(let i=0;i<bands;i++){
      const y=(i/bands*h+t*83+i*37)%h;
      const hh=rand(4,22)*(0.4+p);
      g.fillStyle=`rgba(0,0,0,${rand(0.08,0.25)*p})`;
      g.fillRect(0,y,w,hh);
    }

    if((t>0.62&&t<0.69)||(t>1.08&&t<1.16)||(t>1.55&&t<1.68)){
      g.fillStyle='rgba(0,0,0,0.52)';
      g.fillRect(0,0,w,h);
    }
  }

  distort(){
    const t=this.t;
    let x=0,y=0,r=0,s=1,b=1,c=1,sat=1;

    if(this.type==='crush'){
      const k=clamp(1-t/0.72,0,1);
      x=rand(-17,17)*k;
      y=rand(-12,12)*k;
      r=this.roll*(4.5*clamp((t-0.18)/1.2,0,1))+rand(-2.6,2.6)*k;
      s=1+0.065*k;
      b=t<0.11?1.75:lerp(1,0.42,clamp((t-0.75)/1.45,0,1));
      c=1+1.7*k;
      sat=lerp(1,0.22,clamp((t-0.55)/1.65,0,1));
    }else if(this.type==='vacuum'){
      const k=clamp(t/1.5,0,1);
      r=this.roll*k*k*24;
      s=1+0.58*k*k;
      x=Math.sin(t*27)*5*(1-k);
      y=Math.cos(t*31)*4*(1-k);
      b=lerp(1,0.28,k);
      c=1+0.8*k;
      sat=lerp(1,0.12,k);
    }else if(this.type==='flame'){
      const k=clamp(t/1.35,0,1);
      x=rand(-8,8)*(1-k);
      y=rand(-6,6)*(1-k);
      r=this.roll*2.8*k+Math.sin(t*31)*0.8*(1-k);
      s=1.025+0.025*Math.sin(t*23);
      b=t<0.25?1.7:lerp(1.15,0.25,k);
      c=1.35+0.75*k;
      sat=lerp(1.4,0.08,k);
    }else{
      const k=clamp(t/1.75,0,1);
      x=Math.sin(t*19)*7*(0.35+k);
      y=Math.cos(t*23)*4*(0.25+k);
      r=this.roll*(0.4+5.5*k)+Math.sin(t*13)*1.1;
      s=1+0.018*Math.sin(t*17);
      b=lerp(1,0.33,k);
      c=1+0.9*k;
      sat=lerp(0.9,0.15,k);
    }

    this.G.canvas.style.transform=`translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0) rotate(${r.toFixed(2)}deg) scale(${s.toFixed(3)})`;
    this.G.canvas.style.filter=`brightness(${b.toFixed(3)}) contrast(${c.toFixed(3)}) saturate(${sat.toFixed(3)})`;
  }

  update(dt){
    if(!this.active) return false;

    this.t=Math.min(this.duration,this.t+dt);
    const g=this.g;
    g.clearRect(0,0,this.w,this.h);

    if(this.type==='crush') this.drawCrush();
    else if(this.type==='vacuum') this.drawVacuum();
    else if(this.type==='flame') this.drawFlame();
    else this.drawPoison();

    this.drawDrops();
    this.drawShards();
    this.drawTears();

    const close=clamp((this.t-1.88)/0.42,0,1);
    if(close>0){
      g.fillStyle=`rgba(0,0,0,${close})`;
      g.fillRect(0,0,this.w,this.h);
    }

    this.distort();
    return this.t>=this.duration;
  }
}

// ───────── 1라운드 ─────────
class Round1{
  constructor(G){

    this.quitShown=false; this.active=false; this.ray=new THREE.Raycaster(); this.plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);

  }
  floorPoint(sx,sy){ const v=new THREE.Vector2((sx/innerWidth)*2-1,-(sy/innerHeight)*2+1); this.ray.setFromCamera(v,this.G.camera); const p=new THREE.Vector3(); return this.ray.ray.intersectPlane(this.plane,p)?p:null; }
  start(){

    this.kills=0; this.combo=0; this.lastKill=-9; this.time=0; this.spawnT=0; this.boost=0; this.used=new Set(); this.killedWith=new Set(); this.baitsUsed=new Set(); this.clearStrikes(); this.hold=null; this.cam={x:0,z:0.15}; this.quitShown=false; this.G.ui.showQuit(false); this.G.ui.setKills(0);

  this.clearNymphs(); this.clearOothecae(); this.eggSpawnT=3.5;

    this.G.setLighting('day'); this.G.paint.clear(); this.G.corpses.clear(); this.splat.setLevel(0);

    this.resetCushion(); for(let i=0;i<12;i++) this.spawn(true); for(let i=0;i<3;i++){ const r=this.spawn(true); r.x=CUSHION.x+rand(-0.12,0.12); r.z=CUSHION.z+rand(-0.12,0.12); r.spd=0; r.t=rand(3,9); r.m.g.position.set(r.x,0,r.z); }
   
   
     this.selectItem('hand');
    this.lastAction=0;

    this.G.ui.hint(
      '도구를 고른 뒤 바퀴가 있는 곳을 누른다.',

    );

    this.G.ui.hint(
      this.G.isTouch
        ? '두 손가락 드래그: 화면 이동'
        : '마우스 오른쪽 드래그: 화면 이동 · 숫자키: 도구 변경',
      3.4,
      0.25,
      true
    );


  }
  resetCushion(){ this.cushionF={flipped:false,t:0,k:0,dx:0,dz:1}; const c=this.G.room.cushion; c.position.set(CUSHION.x,0.022,CUSHION.z); c.quaternion.identity(); }
  underCushion(x,z){ return !this.cushionF.flipped&&this.cushionF.k<0.5&&dist2(x,z,CUSHION.x,CUSHION.z)<CUSHION.r*CUSHION.r; }
  flipCushion(x,z){ const f=this.cushionF; if(f.flipped) return; let dx=CUSHION.x-x, dz=CUSHION.z-z; const d=Math.hypot(dx,dz); if(d<0.05){ dx=this.G.camUp.x; dz=this.G.camUp.z; } else { dx/=d; dz/=d; } f.flipped=true; f.t=0; f.dx=dx; f.dz=dz; SFX.cushionFlip(); this.G.shake(0.2);
    for(const r of this.roaches){ if(r.state==='dead'||r.gone) continue; if(dist2(r.x,r.z,CUSHION.x,CUSHION.z)<CUSHION.r*CUSHION.r){ r.startle={t:rand(0.15,0.55),ax:CUSHION.x,az:CUSHION.z}; } } }
  updateCushion(dt){ const f=this.cushionF, c=this.G.room.cushion; if(!f.flipped&&f.k<=0) return; f.t+=dt; let k; if(f.flipped){ k=Math.min(1,f.t/0.35); if(f.t>4.2){ f.flipped=false; f.t=0; } } else { k=Math.max(0,1-f.t/0.35); } f.k=k; const e=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2; c.position.set(CUSHION.x+f.dx*0.5*e,0.022+Math.sin(e*Math.PI)*0.22,CUSHION.z+f.dz*0.5*e); c.quaternion.setFromAxisAngle(new THREE.Vector3(f.dz,0,-f.dx).normalize(),e*Math.PI); }
  stop(){ this.active=false; document.getElementById('r1ui').style.display='none'; this.stopHold(); this.clearStrikes(); this.resetCushion(); for(const r of this.roaches) this.grp.remove(r.m.g); this.roaches.length=0; this.clearNymphs(); this.clearOothecae(); for(const b of this.baitMeshes) this.grp.remove(b); this.baitMeshes.length=0; this.baits.length=0; for(const k in this.itemMeshes) this.itemMeshes[k].visible=false; this.puffs.clear(); this.splat.hideAll(); this.G.ui.setKills(null); }
  selectItem(k){ if(this.hold) this.stopHold(); this.item=k; this.G.ui.selectSlot(k); this.touch(); }
  level(){ return clamp(this.kills/80,0,1); }
  touch(){ this.lastAction=this.time; }
  inView(x,z,m=0){ const V=this.G.view; return Math.abs(x-this.cam.x)<V.w/2+m&&Math.abs(z-this.cam.z)<V.h/2+m; }
  clampCam(){ const V=this.G.view; const lx=V.w>=4.2?0:2-V.w/2, lz=V.h>=6.2?0:3-V.h/2; this.cam.x=clamp(this.cam.x,-lx,lx); this.cam.z=clamp(this.cam.z,-lz,lz); }
  pan(dx,dy){ if(this.intro) return; const R=this.G.camRight, U=this.G.camUp, p=this.G.ppm; this.cam.x-=(R.x*dx-U.x*dy)/p; this.cam.z-=(R.z*dx-U.z*dy)/p; this.clampCam(); this.touch(); }
  okPos(px,pz){ if(px<ROOM.x1+0.06||px>ROOM.x2-0.06||pz<ROOM.z1+0.06||pz>ROOM.z2-0.06) return false; for(const o of OBST){ if(!o.roach&&inObst(o,px,pz,0.02)) return false; } return true; }
  spawn(anywhere=false){
    const V=this.G.view, cam=this.cam; let x=0,z=0,h=0,done=false;
    if(anywhere){ for(let i=0;i<24&&!done;i++){ x=rand(cam.x-V.w/2+0.12,cam.x+V.w/2-0.12); z=rand(cam.z-V.h/2+0.12,cam.z+V.h/2-0.12); done=this.okPos(x,z); } h=rand(TAU); }
    else {

      for(let i=0;i<12&&!done;i++){ const side=Math.floor(rand(4)); const mx=V.w/2+rand(0.1,0.25), mz=V.h/2+rand(0.1,0.25);
        if(side===0){ x=cam.x-mx; z=rand(cam.z-V.h/2,cam.z+V.h/2); } else if(side===1){ x=cam.x+mx; z=rand(cam.z-V.h/2,cam.z+V.h/2); } else if(side===2){ x=rand(cam.x-V.w/2,cam.x+V.w/2); z=cam.z-mz; } else { x=rand(cam.x-V.w/2,cam.x+V.w/2); z=cam.z+mz; }
        if(this.okPos(x,z)){ done=true; h=Math.atan2(cam.x-x,cam.z-z)+rand(-0.7,0.7); } }

    m.g.position.set(r.x,0,r.z); m.g.rotation.y=r.h; this.roaches.push(r); return r;
  }


 tryLayOotheca(){
    const liveNymphs=this.nymphs.filter(n=>n.state!=='dead').length;
    if(this.oothecae.length>=2||liveNymphs>=18) return false;
    const pool=this.roaches.filter(r=>
      r.state==='wander'&&!r.startle&&!r.gone&&!r.layEgg&&
      this.inView(r.x,r.z,0.1)&&!this.underCushion(r.x,r.z)
    );
    if(!pool.length) return false;
    const r=pool[Math.floor(rand(pool.length))];
    r.layEgg={t:0,laid:false};
    r.spd=0;

  spawnOotheca(x,z,h){

        }

        const eaten=G.corpses.suck(h.x,h.z,(x,z)=>!this.underCushion(x,z)&&this.inCone({x,z},h.x,h.z,yaw,c.len*1.1,c.ang),dt);
        if(eaten){ SFX.vacuumSuck(); for(let i=0;i<2+eaten;i++) SFX.noise({t:0.03+i*0.035+Math.random()*0.02,dur:0.018,gain:0.3,freq:2000+Math.random()*3000,q:2.5}); }
               for(const o of [...this.oothecae]){

      }
    }


    for(let i=this.baits.length-1;i>=0;i--){ const b=this.baits[i]; b.t+=dt; if(b.amount<=0){ if(b.mesh){ this.grp.remove(b.mesh); this.baitMeshes.splice(this.baitMeshes.indexOf(b.mesh),1);} this.baits.splice(i,1); for(const q of this.roaches) if(q.bait===b){ q.bait=null; if(q.state==='feed'){ q.state='wander'; q.t=0.1; } } } }

    for(let i=this.roaches.length-1;i>=0;i--){ const r=this.roaches[i]; if(r.gone){ this.roaches.splice(i,1); continue; } this.updateRoach(r,dt); if(r.remove){ this.grp.remove(r.m.g); this.roaches.splice(i,1); } }


      this.updateNymphs(dt);
    this.splat.update(dt); this.puffs.update(dt); this.updateCushion(dt);


    // 최소 1마리를 잡은 뒤 7초 쉬었거나,

  updateRoach(r,dt){
    const m=r.m;
    // 죽는 즉시 시체로 바꾼다. 막 죽은 시체는 다리가 한동안 경련한다.
    if(r.state==='dead'){ if(!r.baked){ r.baked=true; this.G.paint.corpse(r.x,r.z,r.h,this.level(),r.bakeMode); this.G.corpses.add(r.x,r.z,r.h,r.bakeMode); } r.remove=true; return; }
    if(r.state==='poison'){ r.t-=dt; r.twitch+=dt*rand(10,30); m.pose(0.6+0.4*Math.sin(r.twitch),dt*rand(0.5,3),0.15); if(Math.random()<dt*3) SFX.poisonTwitch(); if(r.t<=0){ this.killRoach(r,'spray',r.x,r.z); } return; }
  
    if(r.startle){ r.layEgg=null; r.startle.t-=dt; m.pose(0,dt,0); m.g.position.set(r.x,0,r.z); m.g.rotation.y=r.h; if(r.startle.t<=0){ const s=r.startle; r.startle=null; this.flee(r,s.ax,s.az); } return; }
    if(r.layEgg){
      const L=r.layEgg; L.t+=dt; r.spd=0;
      if(!L.laid&&L.t>=0.55){
        L.laid=true;
        const ex=r.x-Math.sin(r.h)*0.055, ez=r.z-Math.cos(r.h)*0.055;
        const [px,pz]=roachMove(r.x,r.z,ex,ez);
        this.spawnOotheca(px,pz,r.h);
      }
      m.pose(0,dt,0); m.g.position.set(r.x,0,r.z); m.g.rotation.y=r.h;
      if(L.t>=0.9){ r.layEgg=null; r.t=rand(0.4,1); }
      return;
    }
    let spd=0;



    if(r.state==='wander'){ if(r.underGoal&&dist2(r.x,r.z,CUSHION.x,CUSHION.z)>0.8*0.8) r.underGoal=false; r.t-=dt; if(r.t<0){ if(r.spd>0){ r.spd=0; r.t=rand(0.4,1.8); } else if(Math.random()<0.15){ r.spd=rand(0.6,0.9); r.t=rand(0.25,0.5); r.turn=rand(-0.5,0.5); } else { r.spd=rand(0.12,0.32); r.t=rand(0.6,2.2); r.turn=rand(-1.2,1.2); } }
      if(r.spd>0){ r.h+=r.turn*dt; spd=r.spd; }
      if(!r.bait){ for(const b of this.baits){ if(b.amount>0&&dist2(r.x,r.z,b.x,b.z)<b.radius*b.radius&&Math.random()<dt*1.5){ r.bait=b; r.state='feed'; r.tx=b.x+rand(-b.spread,b.spread); r.tz=b.z+rand(-b.spread,b.spread); break; } } }
      { const hh=nearHole(r.x,r.z,0.09); if(hh&&!hh.cushion&&r.spd===0&&Math.random()<dt*0.12){ r.remove=true; return; } }
      if(!this.cushionF.flipped&&r.spd>0&&!r.underGoal&&dist2(r.x,r.z,CUSHION.x,CUSHION.z)<0.7*0.7&&Math.random()<dt*0.25){ r.state='toCushion'; r.tx=CUSHION.x+rand(-0.12,0.12); r.tz=CUSHION.z+rand(-0.12,0.12); r.underGoal=true; }
    } else if(r.state==='feed'){ const b=r.bait; if(!b||b.amount<=0){ r.bait=null; r.state='wander'; r.t=0; return; }
      const dx=r.tx-r.x, dz=r.tz-r.z, d=Math.hypot(dx,dz);
      if(d>0.03){ r.h=angleDamp(r.h,Math.atan2(dx,dz),6,dt); spd=0.5; } else { b.amount-=dt*1.0; r.t-=dt; if(r.t<0){ r.t=rand(0.5,1.5); r.tx=b.x+rand(-b.spread,b.spread); r.tz=b.z+rand(-b.spread,b.spread); } r.h+=Math.sin(this.time*9+r.x*30)*dt*1.5; spd=0.02; }
    } else if(r.state==='toCushion'){ const dx=r.tx-r.x, dz=r.tz-r.z, d=Math.hypot(dx,dz); if(d>0.03){ r.h=angleDamp(r.h,Math.atan2(dx,dz),6,dt); spd=0.3; } else { r.state='wander'; r.spd=0; r.t=rand(3,10); }
      if(this.cushionF.flipped){ r.state='wander'; r.spd=0.2; r.t=0.5; }
    } else if(r.state==='flee'){ r.t+=dt; spd=r.fleeSpd;
      if(r.t>0.15&&r.hole){ const dx=r.hole.x-r.x, dz=r.hole.z-r.z; r.h=angleDamp(r.h,Math.atan2(dx,dz),8,dt); if(Math.hypot(dx,dz)<0.1){ if(r.hole.cushion){ r.state='wander'; r.spd=0; r.t=rand(2,8); r.hole=null; } else { r.remove=true; return; } } }
      if(r.t>r.fleeT){ r.state='wander'; r.t=rand(0.3,0.9); r.spd=0; r.hole=null; }
    }
    if(spd>0){ const nx=r.x+Math.sin(r.h)*spd*dt, nz=r.z+Math.cos(r.h)*spd*dt; const [px,pz]=roachMove(r.x,r.z,nx,nz); if(px===r.x&&pz===r.z&&r.state!=='feed'){ r.h+=rand(1.8,2.8)*(Math.random()<0.5?1:-1); r.hole=null; if(r.state==='toCushion'){ r.state='wander'; r.t=0.5; } } r.x=px; r.z=pz; }
    m.g.position.set(r.x,0,r.z); m.g.rotation.y=r.h; m.pose(clamp(spd/1.2,0,1),dt,0);
  }
}

// A* 격자 (사람용)
class NavGrid{
  constructor(){ this.cs=0.1; this.nx=40; this.nz=60; this.blk=new Uint8Array(this.nx*this.nz);
    for(let j=0;j<this.nz;j++) for(let i=0;i<this.nx;i++){ const x=ROOM.x1+(i+0.5)*this.cs, z=ROOM.z1+(j+0.5)*this.cs; let b=(x<ROOM.x1+0.24||x>ROOM.x2-0.24||z<ROOM.z1+0.24||z>ROOM.z2-0.24)?1:0; if(!b) for(const o of OBST){ if(!o.human&&inObst(o,x,z,0.24)){ b=1; break; } } this.blk[j*this.nx+i]=b; } }
  cell(x,z){ return [clamp(Math.floor((x-ROOM.x1)/this.cs),0,this.nx-1),clamp(Math.floor((z-ROOM.z1)/this.cs),0,this.nz-1)]; }
  free(i,j){ return i>=0&&j>=0&&i<this.nx&&j<this.nz&&!this.blk[j*this.nx+i]; }
  nearestFree(i,j){ if(this.free(i,j)) return [i,j]; for(let r=1;r<8;r++) for(let dj=-r;dj<=r;dj++) for(let di=-r;di<=r;di++){ if(this.free(i+di,j+dj)) return [i+di,j+dj]; } return [i,j]; }
  path(x0,z0,x1,z1){
    let [si,sj]=this.nearestFree(...this.cell(x0,z0)); let [gi,gj]=this.nearestFree(...this.cell(x1,z1));
    const N=this.nx*this.nz, g=new Float32Array(N).fill(1e9), f=new Float32Array(N).fill(1e9), from=new Int32Array(N).fill(-1), closed=new Uint8Array(N);
    const h=(i,j)=>Math.hypot(i-gi,j-gj); const s=sj*this.nx+si, goal=gj*this.nx+gi; g[s]=0; f[s]=h(si,sj);
    const open=[s];
    while(open.length){ let bi=0; for(let k=1;k<open.length;k++) if(f[open[k]]<f[open[bi]]) bi=k; const c=open.splice(bi,1)[0]; if(c===goal) break; closed[c]=1; const ci=c%this.nx, cj=(c/this.nx)|0;
      for(let dj=-1;dj<=1;dj++) for(let di=-1;di<=1;di++){ if(!di&&!dj) continue; const ni=ci+di, nj=cj+dj; if(!this.free(ni,nj)) continue; if(di&&dj&&(!this.free(ci+di,cj)||!this.free(ci,cj+dj))) continue; const n=nj*this.nx+ni; if(closed[n]) continue; const ng=g[c]+Math.hypot(di,dj); if(ng<g[n]){ g[n]=ng; f[n]=ng+h(ni,nj); from[n]=c; if(!open.includes(n)) open.push(n); } } }
    if(from[goal]<0&&goal!==s) return [[x1,z1]];
    const out=[]; let c=goal; while(c>=0&&c!==s){ out.push([ROOM.x1+(c%this.nx+0.5)*this.cs,ROOM.z1+((c/this.nx|0)+0.5)*this.cs]); c=from[c]; } out.reverse();
    const sm=[]; let cur=[x0,z0]; let k=0; while(k<out.length){ let far=k; for(let m=out.length-1;m>k;m--){ if(this.clear(cur[0],cur[1],out[m][0],out[m][1])){ far=m; break; } } sm.push(out[far]); cur=out[far]; k=far+1; }
    if(sm.length) sm[sm.length-1]=[x1,z1]; else sm.push([x1,z1]); return sm;
  }
  clear(x0,z0,x1,z1){ const n=Math.ceil(Math.hypot(x1-x0,z1-z0)/0.05); for(let k=1;k<n;k++){ const t=k/n; const [i,j]=this.cell(lerp(x0,x1,t),lerp(z0,z1,t)); if(!this.free(i,j)) return false; } return true; }
}

  // 시작 시선: 가구 옆면에 코를 박지 않게, 트인 방향 가운데 사람 쪽에 가까운 곳을 본다
  startYaw(){
    const P=this.p, A=this.ai, tx=A?A.x:1.45, tz=A?A.z:-1.9, want=Math.atan2(tx-P.x,tz-P.z);
    let best=want, bs=-1e9;
    for(let k=0;k<48;k++){ const a=k/48*TAU, sx=Math.sin(a), sz=Math.cos(a); let free=0;
      for(let d=0.08;d<=3;d+=0.06){ const x=P.x+sx*d, z=P.z+sz*d; if(x<ROOM.x1||x>ROOM.x2||z<ROOM.z1||z>ROOM.z2) break; let hit=false; for(const o of OBST){ if(!o.roach&&inObst(o,x,z)){ hit=true; break; } } if(hit) break; free=d; }
      const sc=Math.min(free,2.2)+0.9*Math.cos(wrapAng(a-want)); if(sc>bs){ bs=sc; best=a; } }
    return best;
  }
  // 숨는 자리 안내: 처음 숨는 자리를 드나드는 순간에 한 번

  // 먹이 안내: 사람이 둔 먹이가 처음 가까이 눈앞에 들어올 때 한 번
  hintTrap(){ if(this.hinted.trap||!this.traps.length) return; const P=this.p; for(const t of this.traps){ const dx=t.x-P.x, dz=t.z-P.z; if(Math.hypot(dx,dz)<0.9&&Math.abs(wrapAng(Math.atan2(dx,dz)-this.camYaw))<0.75){ this.hinted.trap=true; this.G.ui.hint(HINTS.trap(BAIT_LABEL[t.kind]),4.4,0); return; } } }
  setupHuman(){

    if(this.gen>0){

      A.state='hunt'; A.awake=true; A.wake=1.2; A.lightsOn=true; A.look=1.4;

  giveWeapon(){
    const w=this.ai.weapon; if(w==='hand') return; const m=makeItem(w); this.weaponMesh=m; this.human.hold.add(m);
    if(w==='slipper'){ m.rotation.set(Math.PI/2,0,0); m.position.set(0,-0.02,0.06); } else if(w==='book'){ m.rotation.set(Math.PI/2,0,0.2); m.position.set(0,-0.1,0.05); } else if(w==='pan'){ m.rotation.set(0.3,Math.PI,0); m.position.set(0,-0.06,0.2); } else if(w==='tissue'){ m.rotation.set(Math.PI/2,0,0); m.position.set(0,-0.06,0.04); } else if(w==='spray'||w==='flame'){ m.rotation.set(Math.PI/2,0,0); m.position.set(0,-0.02,0.02); } else if(w==='vacuum'){ this.human.hold.remove(m); this.grp.add(m); this.vac=m; m.children[2].visible=false; const tube=cyl(0.02,0.02,1,M.std(0xa5a5ad)); this.grp.add(tube); this.vacTube=tube; }
  }
clearTraps(){

}
  spawnTraps(){
    this.clearTraps(); if(!this.baitKinds.length) return;
    const spots=[[-0.6,1.4],[0.5,0.9],[-0.35,-1.2],[1.1,1.9],[-1.0,0.2],[0.75,-0.55]];
    const n=Math.min(this.baitKinds.length,1+Math.floor(this.gen/3));
    const pool=spots.slice(); 
    for(let i=0;i<n;i++){
      const kind=this.baitKinds[i%this.baitKinds.length];
      const s=pool.splice(Math.floor(rand(pool.length)),1)[0]; if(!s) break;
      const mesh=makeItem(kind); mesh.position.set(s[0],0,s[1]); mesh.rotation.y=rand(TAU); this.grp.add(mesh);
    
      this.traps.push({kind,x:s[0],z:s[1],mesh});
    }




  }

 // ── 부화 직후 주변에 보이는 흰 약충. 사람 AI의 공격 대상에는 넣지 않는다. ──
  clearHatchNymphs(){
    for(const n of this.hatchNymphs) this.grp.remove(n.m.g);
    this.hatchNymphs.length=0;
  }
  spawnHatchNymphs(x,z,h){
    this.clearHatchNymphs();
    for(let i=0;i<5;i++){
      const a=h+rand(-1.4,1.4), d=rand(0.015,0.04);
      const m=makeNymph();
      m.g.visible=false;
      this.grp.add(m.g);
      this.hatchNymphs.push({
        x:x+Math.sin(a)*d,z:z+Math.cos(a)*d,h:a,
        ox:x,oz:z,sp:rand(0.38,0.62),turn:rand(-2.2,2.2),
        delay:i*0.12+rand(0,0.06),t:0,life:rand(7,10),m
      });
    }
  }
  updateHatchNymphs(dt){
    for(let i=this.hatchNymphs.length-1;i>=0;i--){
      const n=this.hatchNymphs[i];
      if(n.delay>0){ n.delay-=dt; if(n.delay>0) continue; n.m.g.visible=true; }
      n.t+=dt;
      if(n.t>=n.life){ this.grp.remove(n.m.g); this.hatchNymphs.splice(i,1); continue; }
      if(Math.random()<dt*2.2) n.turn=rand(-2.5,2.5);
      const homeD=Math.hypot(n.x-n.ox,n.z-n.oz);
      if(homeD>0.34) n.h=angleDamp(n.h,Math.atan2(n.ox-n.x,n.oz-n.z),5,dt);
      else n.h+=n.turn*dt;
      const sp=n.sp*(0.72+0.28*Math.sin(n.t*13+i));
      const nx=n.x+Math.sin(n.h)*sp*dt, nz=n.z+Math.cos(n.h)*sp*dt;
      const [px,pz]=roachMove(n.x,n.z,nx,nz);
      if(px===n.x&&pz===n.z) n.h+=rand(1.8,2.8)*(Math.random()<0.5?1:-1);
      n.x=px; n.z=pz;
      n.m.g.position.set(n.x,0,n.z); n.m.g.rotation.y=n.h;
      n.m.pose(clamp(sp/0.7,0,1),dt,0);
    }
  }


  // ── 다른 바퀴들 ──
  npcTarget(){ return Math.min(30,16+this.gen*2); }
  spawnNpcs(){ this.clearNpcs(); const n=this.npcTarget(); for(let i=0;i<n;i++) this.addNpc(rand(0.3,6)); this.npcT=2; }
  addNpc(delay){ const r=Math.random(); const pool=r<0.7?HOLE_LIST:HOLES.filter(h=>!h.hole); const h=pool[Math.floor(rand(pool.length))]; const m=makeRoach(); m.g.visible=false; this.grp.add(m.g); const n={x:h.x,z:h.z,h:Math.atan2(h.dx,h.dz),spd:0,state:'hide',t:delay,hole:h,m,hidden:true,vx:0,vz:0,turn:0,startle:0,fleeSoon:-1,poison:0,dead:0,slug:Math.random()<0.7,bold:Math.random()<0.35,trap:null,eat:0}; this.npcs.push(n); return n; }
  spotExit(h){ const dn=Math.hypot(h.dx,h.dz)||1; const R=h.rect?h.rz:(h.r||HOLE_R); return [h.x+h.dx/dn*(R*0.35),h.z+h.dz/dn*(R*0.35)]; }
  clearNpcs(){ for(const n of this.npcs) this.grp.remove(n.m.g); this.npcs.length=0; }
  npcFlee(n){ if(n.state==='dead'||n.state==='poison') return; n.state='flee'; n.trap=null; let best=null,bd=1e9; for(const h of HOLES){ const d=dist2(n.x,n.z,h.x,h.z)*(0.7+Math.random()*0.6); if(d<bd){bd=d;best=h;} } n.hole=best; }
  killNpc(n,weapon){ if(n.state==='dead') return; n.state='dead'; n.t=0; n.dead=0; n.startle=0; n.hidden=false; n.m.g.visible=true; n.bake=weapon==='flame'?'burnt':weapon==='spray'?'belly':'crushed';
    const d=Math.hypot(n.x-this.p.x,n.z-this.p.z), pan=clamp(Math.sin(wrapAng(Math.atan2(n.x-this.p.x,n.z-this.p.z)-this.camYaw)),-1,1);
   
       if(weapon==='vacuum'){
      n.t=1;

      // 아주 가까울 때만 들린다.
      if(d<0.55){
        SFX.vacuumSuck();
      }

      return;
    }

    // 먹이나 살충제로 독사한 배경 바퀴에게
    // 압사 파열음을 붙이지 않는다.
    if(weapon==='spray'){
      return;
    }

    // 불도 압사음이 아니라 작은 연소음만 낸다.
    if(weapon==='flame'){
      const g=clamp(
        0.32/(0.45+d),
        0.04,
        0.26
      );

      SFX.kill(
        'flame',
        0,
        g,
        0,
        pan,
        clamp(0.34+d*0.28,0.34,1)
      );

      this.G.shake(
        clamp(0.16/(0.4+d),0.01,0.18)
      );

      return;
    }

    // 손·슬리퍼·책·프라이팬으로 실제 압사했을 때만.
    SFX.npcCrush(d,pan,weapon);

    this.G.shake(
      clamp(0.5/(0.4+d),0.05,0.6)
    );

    const a=rand(TAU);

    this.G.paint.splat(
      n.x,
      n.z,
      Math.cos(a),
      Math.sin(a),
      0.09,
      0.45,
      weapon
    );
 }


  updateNpcs(dt){
    const A=this.ai; let alive=0;
    for(let i=this.npcs.length-1;i>=0;i--){ const n=this.npcs[i], m=n.m;
      // 죽는 즉시 시체로 바꾼다 (청소기에 빨려 간 것(t=1)은 시체를 남기지 않는다)
      if(n.state==='dead'){ if(!n.baked){ n.baked=true; if(n.t<1){ this.G.paint.corpse(n.x,n.z,n.h,0.45,n.bake||'crushed'); this.G.corpses.add(n.x,n.z,n.h,n.bake||'crushed'); } } this.grp.remove(m.g); this.npcs.splice(i,1); continue; }
      alive++;
      if(n.state==='poison'){ n.t-=dt; n.twitch=(n.twitch||0)+dt*rand(10,30); m.pose(0.6+0.4*Math.sin(n.twitch),dt*rand(0.5,3),0.15); if(n.t<=0) this.killNpc(n,'spray'); continue; }
      if(n.state==='hide'){ n.t-=dt; if(n.t<=0&&!(A.searchHole===n.hole&&A.state==='search')){ n.hidden=false; m.g.visible=true; n.state='wander'; n.spd=rand(0.15,0.3); n.t=rand(0.6,2); const [ex,ez]=this.spotExit(n.hole); n.x=ex+(n.hole.rect?rand(-0.3,0.3):0); n.z=ez; n.h=Math.atan2(n.hole.dx,n.hole.dz)+rand(-0.6,0.6); n.fleeSoon=-1; m.g.position.set(n.x,0,n.z); } continue; }
      if(A.lightsOn&&n.fleeSoon<0&&n.state==='wander'&&!n.bold&&!n.trap) n.fleeSoon=rand(3,11);
      if(n.fleeSoon>0){ n.fleeSoon-=dt; if(n.fleeSoon<=0&&n.state==='wander') this.npcFlee(n); }
      if(n.state!=='eat'&&(A.awake||A.state==='sit')&&n.startle<=0&&Math.hypot(n.x-A.x,n.z-A.z)<(n.bold?0.32:0.55)){ n.startle=n.bold?rand(1.0,1.6):n.slug?rand(0.6,1.0):rand(0.2,0.4); }
      if(n.startle>0){ n.startle-=dt; if(n.startle<=0){ n.startle=0; this.npcFlee(n); } m.pose(0,dt,0); m.g.position.set(n.x,0,n.z); m.g.rotation.y=n.h; continue; }
      let spd=0;
      if(n.state==='wander'){ n.t-=dt; if(n.t<0){ if(n.spd>0){ n.spd=0; n.t=rand(0.5,2.2); } else { n.spd=rand(0.12,0.3); n.t=rand(0.6,2.2); n.turn=rand(-1,1); } } if(n.spd>0){ n.h+=n.turn*dt; spd=n.spd; } if(Math.random()<dt*0.025) this.npcFlee(n);
        if(!n.trap&&this.traps.length&&Math.random()<dt*0.9){ for(const t of this.traps){ if(dist2(n.x,n.z,t.x,t.z)<2.2*2.2){ n.trap=t; n.state='toTrap'; n.tx=t.x+rand(-0.1,0.1); n.tz=t.z+rand(-0.1,0.1); break; } } } }
      else if(n.state==='toTrap'){ const dx=n.tx-n.x, dz=n.tz-n.z, d=Math.hypot(dx,dz); n.h=angleDamp(n.h,Math.atan2(dx,dz),6,dt); if(d>0.05) spd=0.35; else { n.state='eat'; n.eat=rand(3,7); } }
      else if(n.state==='eat'){ n.eat-=dt; n.h+=Math.sin(this.G.time*7+n.x*20)*dt*1.4; spd=0.015; 
      

        if(n.eat<=0){ n.state='poison'; n.t=rand(2,4); m.g.rotation.z=Math.PI; m.g.position.y=ROACH_L*ROACH_TOP; continue; } }
      else if(n.state==='flee'){ spd=n.slug?0.6:0.8; const dx=n.hole.x-n.x, dz=n.hole.z-n.z; n.h=angleDamp(n.h,Math.atan2(dx,dz),8,dt); if(inSpot(n.hole,n.x,n.z)&&Math.hypot(dx,dz)<(n.hole.rect?0.35:(n.hole.r||0.1)*0.6)){ n.state='hide'; n.hidden=true; m.g.visible=false; n.t=A.lightsOn?rand(6,14):rand(4,10); n.fleeSoon=-1; n.vx=n.vz=0; continue; } }
      if(spd>0){ const nx=n.x+Math.sin(n.h)*spd*dt, nz=n.z+Math.cos(n.h)*spd*dt; const [px,pz]=roachMove(n.x,n.z,nx,nz); if(px===n.x&&pz===n.z){ n.h+=rand(1.8,2.8)*(Math.random()<0.5?1:-1); if(n.state==='flee') n.hole=HOLES[Math.floor(rand(HOLES.length))]; } n.vx=(px-n.x)/Math.max(dt,1e-4); n.vz=(pz-n.z)/Math.max(dt,1e-4); n.x=px; n.z=pz; } else { n.vx=n.vz=0; }
      m.g.position.set(n.x,0,n.z); m.g.rotation.y=n.h; m.pose(clamp(spd/1.2,0,1),dt,0);
    }
    this.npcT-=dt; if(alive<this.npcTarget()&&this.npcT<=0){ this.addNpc(rand(0.8,3)); this.npcT=rand(0.8,2); }
  }
  // ── 보임/빛 ──
  litAt(x,z){ return this.ai.lightsOn||x>0.6; }   // 불이 꺼져 있으면 커튼 틈으로 들어오는 창가 쪽만 밝다
  canSeeAt(x,z,hidden){ const A=this.ai; if(hidden||!(A.state==='sit'||A.awake)) return false; const dx=x-A.x, dz=z-A.z, d=Math.hypot(dx,dz); if(d>3.2||!this.litAt(x,z)) return false; const a=Math.atan2(dx,dz); return Math.abs(wrapAng(a-A.h-this.human.headYaw))<(A.state==='sit'?1.3:0.95)+(d<0.55?1.2:0); }
  // 트인 바닥에 가만히 서 있으면 사람이 곁눈으로도 알아챈다 (1.4m 안, 0.6초 이상 멈춤)
  canSee(){ const P=this.p, A=this.ai; if(this.phase!=='play') return false; if(this.canSeeAt(P.x,P.z,P.hidden)) return true; return A.awake&&!P.hidden&&(P.stillT||0)>0.6&&this.litAt(P.x,P.z)&&Math.hypot(P.x-A.x,P.z-A.z)<1.4; }
  visibleTargets(){ const out=[]; const P=this.p; if(this.canSee()) out.push({ref:'player',x:P.x,z:P.z,vx:P.vx,vz:P.vz}); for(const n of this.npcs){ if(n.state==='dead'||n.state==='poison'||n.hidden) continue; if(this.canSeeAt(n.x,n.z,false)) out.push({ref:n,x:n.x,z:n.z,vx:n.vx,vz:n.vz}); } return out; }

  beginStrike(sx,sz,intoHole){

      z:A.z+nz*rd,
      intoHole,
      hit:false,

      // 공격 방향
      nx,
      nz,

      // 공격 방향에 수직인 방향

       * 프라이팬 모델의 원점은 팬 바닥 중심이다.
       * 손잡이가 +Z 방향으로 뻗어 있으므로,

        0

  updateStrike(dt){

           const up=

          ? k/0.45
          : 1;

      const down=
        k<0.45
          ? 0
          : (k-0.45)/0.55;

      H.armR.sh.rotation.x=
        lerp(-0.3,-2.4,up)*(1-down)+
        lerp(-2.4,0.6,down)*down;

      H.armR.el.rotation.x=
        -0.4*(1-down);

      // 현재 프레임의 실제 손 위치를 계속 가져온다.

        /*

        const handX=
          this.tmp3.x+
          S.nx*(0.24+0.04*up);

        const handY=Math.max(
          0.05,
          this.tmp3.y-
          0.02+
          0.08*up*(1-0.7*down)
        );

          this.tmp3.z+
          S.nz*(0.24+0.04*up);

        if(k<0.45){

            handX+
              S.rx*
              S.swingSide*

            handY,

              S.rz*
              S.swingSide*
              0.035*
              up

            sm.position

              S.swingSide*

              handY,
              0.015,
              blend

              0.09*
              arc,

            lerp(

              S.z,

        }

          A.h,
          0

        if(nearMe&&hidOk){ this.killPlayer('crush'); } else if(!hitNpc){ SFX.thud(Math.hypot(P.x-S.x,P.z-S.z),0,A.weapon==='book'||A.weapon==='pan'?1.2:0.8); } }
    } else { if(S.t>WU+W.rec*0.45){ A.state='hunt'; A.rec=W.rec*0.5; H.strikeAnim=false; H.armR.sh.rotation.x=0; H.armR.el.rotation.x=-0.25; this.grp.remove(sm); this.strikeMesh=null; if(this.weaponMesh) this.weaponMesh.visible=true; A.strike=null; } }
  }

  killPlayer(type){
    if(this.phase!=='play') return;

    const P=this.p;
    const A=this.ai;

    // 죽는 순간 카메라가 바라볼 위치
    let tx=A.x;
    let ty=1.12;
    let tz=A.z;

    // 청소기는 노즐을 바라본다.
    if(type==='vacuum'&&A.nozzle){
      tx=A.nozzle[0];
      ty=0.07;
      tz=A.nozzle[1];

    // 독 먹이는 가장 가까운 먹이를 바라본다.
    }else if(type==='trap'&&this.traps.length){
      let best=this.traps[0];
      let bd=Infinity;

      for(const q of this.traps){
        const d=dist2(P.x,P.z,q.x,q.z);

        if(d<bd){
          bd=d;
          best=q;
        }
      }

      tx=best.x;
      ty=0.04;
      tz=best.z;

    // 불과 스프레이는 사람이 들고 있는 도구 쪽을 바라본다.
    }else if(
      (type==='flame'||type==='poison')&&
      this.weaponMesh
    ){
      this.weaponMesh.getWorldPosition(this.tmp3);

      tx=this.tmp3.x;
      ty=this.tmp3.y;
      tz=this.tmp3.z;
    }

    let dx=tx-P.x;
    let dz=tz-P.z;

    if(Math.hypot(dx,dz)<0.02){
      tx=A.x;
      ty=1.12;
      tz=A.z;

      dx=tx-P.x;
      dz=tz-P.z;
    }

    this.phase='dying';

    this.death={
      type,
      t:0,
      weapon:A.weapon,
      target:{
        x:tx,
        y:ty,
        z:tz
      },
      faceYaw:Math.atan2(dx,dz),
      roll:Math.random()<0.5?-1:1,
      baked:false
    };

    P.spd=0;
    P.vx=0;
    P.vz=0;

    // 죽기 직전 누르고 있던 스틱과 버튼 입력을 초기화한다.
    this.G.input.reset();

    // 옛 코드처럼 즉시 암전하지 않는다.
    this.G.blackout(false,true);

    this.G.ui.tox(0);
    this.G.ui.eggState('none');
    this.G.ui.miniOn(false);
    this.G.ui.hintClear();
    this.G.ui.vignette(false);

    document.getElementById('stick').style.display='none';

    this.hideWarn();

    SFX.stopLoop('spray');
    SFX.stopLoop('flame');
    SFX.stopLoop('vacuum');

    // 이미 넣어둔 새 죽음 음향을 실제로 호출한다.
    SFX.deathSequence(type,A.weapon);

    // 이미 넣어둔 DeathFX 화면을 실제로 시작한다.
    this.deathFX.start(type);

    this.G.shake(
      type==='crush'
        ? 1.6
        : type==='vacuum'
          ? 1.1
          : 0.85
    );
  }

  updateDeath(dt){
    const D=this.death;
    const P=this.p;

    D.t=Math.min(2.3,D.t+dt);

    // 체액, 파편, 점멸, 화면 찢김 등을 매 프레임 갱신한다.
    this.deathFX.update(dt);

    if(D.type==='crush'){
      this.roach.pose(
        0,
        dt,
        clamp(D.t/0.24,0,1)
      );

      if(D.t>=0.18&&!D.baked){
        D.baked=true;

        this.G.paint.corpse(
          P.x,
          P.z,
          P.h,
          0.5,
          'crushed'
        );

        this.G.corpses.add(
          P.x,
          P.z,
          P.h,
          'crushed'
        );
      }

    }else if(D.type==='vacuum'){
      const k=clamp(D.t/0.92,0,1);

      this.roach.g.position.set(
        lerp(P.x,D.target.x,k*0.82),
        lerp(0,0.05,k),
        lerp(P.z,D.target.z,k*0.82)
      );

      this.roach.g.rotation.y+=dt*(12+24*k);
      this.roach.pose(1,dt,0.08*k);

      if(D.t>0.82){
        this.roach.g.visible=false;
      }

    }else if(D.type==='flame'){
      const k=clamp(D.t/1.05,0,1);

      this.roach.pose(
        0.25,
        dt,
        0.72*k
      );

      this.roach.g.rotation.z=
        Math.sin(D.t*34)*0.12*(1-k);

      if(D.t>=0.86&&!D.baked){
        D.baked=true;

        this.G.paint.corpse(
          P.x,
          P.z,
          P.h,
          0.5,
          'burnt'
        );

        this.G.corpses.add(
          P.x,
          P.z,
          P.h,
          'burnt'
        );
      }

    }else{
      // 스프레이·독 먹이
      const fall=clamp(D.t/1.48,0,1);

      this.roach.pose(
        0.45+0.55*Math.sin(D.t*38),
        dt*rand(0.4,2.2),
        0.12+0.18*fall
      );

      this.roach.g.rotation.z=
        D.roll*Math.PI*fall;

      this.roach.g.position.y=
        ROACH_L*ROACH_TOP*fall;

      if(Math.random()<dt*7){
        SFX.poisonTwitch();
      }

      if(D.t>=1.72&&!D.baked){
        D.baked=true;

        this.G.paint.corpse(
          P.x,
          P.z,
          P.h,
          0.5,
          'belly'
        );

        this.G.corpses.add(
          P.x,
          P.z,
          P.h,
          'belly'
        );
      }
    }

    if(D.t>=2.3){
      this.afterDeath();
    }
  }

  afterDeath(){
    if(this.doneStep) return;

    this.doneStep=true;

    // DeathFX가 완전히 검게 닫힌 상태를 실제 fade로 이어받는다.

    this.deathFX.stop();
    this.G.camera.up.set(0,1,0);
    this.roach.g.visible=false;

      this.lineEnd();

      this.nextGen(450);
      return;

    // 알집은 있지만 아직 성숙하지 않았으면 관전
    this.toWatch();

    deathCamera(dt){
    const P=this.p;
    const D=this.death;
    const cam=this.G.camera;
    const t=Math.min(2.3,D.t);

    const yaw=D.faceYaw;
    const fx=Math.sin(yaw);
    const fz=Math.cos(yaw);

    const rx=fz;
    const rz=-fx;

    // 청소기: 노즐 안으로 끌려가며 회전

      const k=clamp(t/1.22,0,1);

        lerp(P.x,D.target.x,e*0.88),
        lerp(0.075,0.038,e),
        lerp(P.z,D.target.z,e*0.88)
      );

      cam.up.set(
        rx*Math.sin(spin),
        Math.cos(spin),
        rz*Math.sin(spin)
      ).normalize();

      this.tmp.set(
        D.target.x,
        D.target.y,
        D.target.z
      );

      cam.lookAt(this.tmp);

      D.type==='crush' &&
      t<0.2 &&
      this.strikeMesh

        P.x-fx*back,
        lerp(0.075,0.028,k),
        P.z-fz*back

        this.strikeMesh.position

        0.028,
        this.strikeMesh.position.y+0.028

    let roll=0;
    let y=0.065;
    let side=0;

      side=D.roll*0.025*fall;

        D.roll*0.68*fall+
        Math.sin(t*27)*0.07*(1-fall);

      P.x-fx*0.045+rx*side,
      y,
      P.z-fz*0.045+rz*side

      rx*Math.sin(roll),
      Math.cos(roll),
      rz*Math.sin(roll)

      lerp(D.target.y,0.055,fall);

      D.target.x,
      targetY,
      D.target.z

}
