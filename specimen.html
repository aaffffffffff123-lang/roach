<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>한 마리 작업대</title>
<style>
:root{
  --ivory:#fbf4e4;
  --ivory2:#efe2c2;
  --ink:#342113;
  --ink2:#765033;
  --edge:#c39b5b;
  --steel:#b8bcc0;
  --dark:#17120e;
  --warn:#8f271b;
  --sans:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --serif:"Apple Myungjo","Nanum Myeongjo","Noto Serif KR","Batang",serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a77e48;color:var(--ink);font-family:var(--sans);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;-webkit-tap-highlight-color:transparent;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#ui{position:fixed;inset:0;pointer-events:none}
#topbar{
  position:fixed;left:calc(12px + env(safe-area-inset-left));right:calc(12px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));
  display:flex;gap:9px;justify-content:space-between;align-items:flex-start;pointer-events:none
}
#titlebox{
  min-width:160px;padding:10px 13px;border-radius:16px;background:rgba(251,244,228,.92);
  box-shadow:0 2px 0 var(--edge),0 7px 22px rgba(30,18,8,.22);backdrop-filter:blur(9px)
}
#titlebox b{display:block;font-family:var(--serif);font-size:20px;line-height:1;letter-spacing:-.045em}
#titlebox small{display:block;margin-top:6px;color:var(--ink2);font-size:10px;font-weight:800;letter-spacing:.11em}
#vitals{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;max-width:62vw}
.chip{
  min-width:64px;padding:8px 9px;border-radius:13px;background:rgba(251,244,228,.90);text-align:center;
  box-shadow:0 2px 0 var(--edge),0 5px 16px rgba(30,18,8,.18);backdrop-filter:blur(8px)
}
.chip strong{display:block;font-family:var(--serif);font-size:15px;line-height:1;white-space:nowrap}
.chip span{display:block;margin-top:4px;color:var(--ink2);font-size:9px;font-weight:800}
#toolbelt{
  position:fixed;left:50%;bottom:calc(11px + env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;gap:7px;max-width:calc(100vw - 18px);padding:5px;overflow-x:auto;pointer-events:auto;scrollbar-width:none
}
#toolbelt::-webkit-scrollbar{display:none}
.tool{
  flex:0 0 auto;min-width:65px;height:48px;padding:0 9px;border-radius:15px;background:rgba(251,244,228,.96);
  box-shadow:0 2px 0 var(--edge),0 6px 16px rgba(34,20,9,.25);font-size:11px;font-weight:900;line-height:1.05;
  display:grid;place-items:center;transition:transform .08s,background .1s,color .1s,opacity .1s
}
.tool:active{transform:translateY(2px)}
.tool.sel{background:var(--ink);color:var(--ivory);box-shadow:0 2px 0 #100905,0 7px 18px rgba(0,0,0,.32);transform:translateY(-3px)}
.tool span{display:block;font-size:9px;opacity:.66;margin-top:2px}
#side{
  position:fixed;right:calc(11px + env(safe-area-inset-right));bottom:calc(73px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:flex-end;gap:7px;pointer-events:auto
}
.sidebtn{
  padding:10px 14px;border-radius:999px;background:rgba(251,244,228,.94);font-size:11px;font-weight:900;
  box-shadow:0 2px 0 var(--edge),0 5px 15px rgba(32,19,8,.22);white-space:nowrap
}
.sidebtn:active{transform:translateY(2px)}
.sidebtn.dark{background:var(--ink);color:var(--ivory);box-shadow:0 2px 0 #100905,0 5px 15px rgba(0,0,0,.3)}
#partcard{
  position:fixed;left:calc(12px + env(safe-area-inset-left));bottom:calc(76px + env(safe-area-inset-bottom));
  max-width:min(360px,62vw);padding:10px 12px;border-radius:14px;background:rgba(31,21,14,.78);color:var(--ivory);
  box-shadow:0 8px 22px rgba(0,0,0,.22);backdrop-filter:blur(8px);opacity:0;transform:translateY(5px);transition:.16s;pointer-events:none
}
#partcard.show{opacity:1;transform:none}
#partcard b{display:block;font-size:13px;line-height:1.15}
#partcard span{display:block;margin-top:4px;font-size:10px;line-height:1.45;color:rgba(251,244,228,.75);word-break:keep-all}
#hint{
  position:fixed;left:50%;bottom:calc(73px + env(safe-area-inset-bottom));transform:translateX(-50%);
  max-width:min(640px,70vw);padding:9px 14px;border-radius:999px;background:rgba(32,20,12,.80);color:var(--ivory);
  text-align:center;font-size:11px;font-weight:800;line-height:1.4;opacity:0;transition:opacity .18s;pointer-events:none;word-break:keep-all
}
#hint.show{opacity:1}
#meter{
  position:fixed;left:50%;top:calc(74px + env(safe-area-inset-top));transform:translateX(-50%);
  width:min(320px,58vw);height:9px;border-radius:999px;background:rgba(30,19,11,.30);overflow:hidden;opacity:0;transition:opacity .12s;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(251,244,228,.35)
}
#meter.show{opacity:1}
#meter i{display:block;width:0;height:100%;border-radius:inherit;background:var(--ivory);box-shadow:0 0 14px rgba(255,244,214,.7)}
#toast{
  position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.94);padding:13px 18px;border-radius:17px;
  background:rgba(25,16,10,.86);color:var(--ivory);font-family:var(--serif);font-size:18px;text-align:center;
  opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)
}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#intro{
  position:fixed;inset:0;display:grid;place-items:center;padding:22px;background:rgba(28,17,9,.50);backdrop-filter:blur(7px);pointer-events:auto
}
#intro.hide{display:none}
.card{width:min(560px,94vw);padding:25px 23px 21px;border-radius:25px;background:var(--ivory2);text-align:center;box-shadow:0 4px 0 #99713f,0 24px 64px rgba(20,11,5,.42)}
.card h1{margin:0;font-family:var(--serif);font-size:37px;letter-spacing:-.065em}
.card p{margin:15px auto 18px;max-width:470px;color:var(--ink2);font-size:13px;line-height:1.75;word-break:keep-all}
.card button{padding:13px 23px;border-radius:999px;background:var(--ink);color:var(--ivory);font-weight:900;box-shadow:0 3px 0 #100905}
#flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0}
@media(max-width:760px){
  #titlebox{min-width:128px;padding:9px 11px}#titlebox b{font-size:17px}#titlebox small{display:none}
  .chip{min-width:55px;padding:7px 7px}.chip strong{font-size:13px}.chip span{font-size:8px}
  #vitals{max-width:64vw}.tool{min-width:59px;height:45px;font-size:10px;padding:0 8px}
  #side{bottom:calc(68px + env(safe-area-inset-bottom))}.sidebtn{padding:9px 12px;font-size:10px}
  #partcard{bottom:calc(70px + env(safe-area-inset-bottom));max-width:58vw;padding:8px 10px}
  #hint{bottom:calc(68px + env(safe-area-inset-bottom));max-width:66vw;padding:8px 11px}
  #meter{top:calc(68px + env(safe-area-inset-top));width:54vw}
}
@media(max-height:590px){
  #topbar{top:calc(6px + env(safe-area-inset-top))}.chip{padding:6px 7px}.chip span{display:none}
  #toolbelt{bottom:calc(5px + env(safe-area-inset-bottom))}.tool{height:41px}
  #side{bottom:calc(55px + env(safe-area-inset-bottom))}
  #partcard,#hint{bottom:calc(55px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="topbar">
    <div id="titlebox"><b>한 마리 작업대</b><small>PIN · CUT · PUNCTURE · HEAT</small></div>
    <div id="vitals">
      <div class="chip"><strong id="lifeText">생존</strong><span>상태</span></div>
      <div class="chip"><strong id="mobilityText">100%</strong><span>이동성</span></div>
      <div class="chip"><strong id="pinText">0</strong><span>고정핀</span></div>
      <div class="chip"><strong id="pieceText">0</strong><span>분리 조각</span></div>
    </div>
  </div>

  <div id="toolbelt">
    <button class="tool sel" data-tool="pin">핀<span>고정</span></button>
    <button class="tool" data-tool="tweezer">족집게<span>잡아뜯기</span></button>
    <button class="tool" data-tool="clipper">손톱깎이<span>정밀 절단</span></button>
    <button class="tool" data-tool="awl">송곳<span>눌러 관통</span></button>
    <button class="tool" data-tool="cutter">커터<span>반복 칼집</span></button>
    <button class="tool" data-tool="lighter">목 긴 라이터<span>국소 가열</span></button>
    <button class="tool" data-tool="piezo">압전 딱딱이<span>전기 펄스</span></button>
  </div>

  <div id="side">
    <button class="sidebtn" id="labelBtn">구조 이름 켜기</button>
    <button class="sidebtn dark" id="resetBtn">새 실험체</button>
  </div>

  <div id="partcard"><b id="partName"></b><span id="partState"></span></div>
  <div id="hint"></div>
  <div id="meter"><i></i></div>
  <div id="toast"></div>
  <div id="flash"></div>

  <div id="intro">
    <div class="card">
      <h1>한 마리 작업대</h1>
      <p>핀으로 고정하지 않은 채 족집게로 당기면 실험체 전체가 끌려온다. 몸통을 고정하면 관절과 작은 파츠를 따로 분리할 수 있다. 커터는 한 번에 자르지 않고 같은 선을 반복할수록 깊어진다. 화면은 두 손가락으로 회전·확대한다.</p>
      <button id="startBtn">작업 시작</button>
    </div>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module" src="specimen-main.js"></script>
</body>
</html>
