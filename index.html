<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>바퀴</title>
<style>
:root{
  --ivory:#FBF4E4; --ivory2:#F3E9CF; --ink:#3A2412; --ink2:#6A4526; --edge:#C9A86C;
  --sans:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --serif:"Apple Myungjo","Nanum Myeongjo","Noto Serif KR","Batang",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#EBDFC0;font-family:var(--sans);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none;color:var(--ink)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;margin:0;-webkit-tap-highlight-color:transparent;touch-action:none}

/* 스틱 (2라운드) — 손을 대지 않아도 기본 자리에 흐리게 떠 있고, 손가락이 닿으면 그 자리로 옮겨간다 */
#stick{position:fixed;left:0;top:0;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;background:rgba(251,244,228,.10);border:2px solid rgba(251,244,228,.34);display:none;pointer-events:none;opacity:.45;transition:opacity .18s}
#stick.live{opacity:1;background:rgba(251,244,228,.16);border-color:rgba(251,244,228,.6)}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--ivory);box-shadow:0 2px 0 var(--edge),0 4px 10px rgba(0,0,0,.45)}

/* 1라운드 UI */
#r1ui{position:fixed;inset:0;display:none;pointer-events:none}
#r1ui>*{pointer-events:auto}
#wcol{position:fixed;right:calc(10px + env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
#bcol{position:fixed;left:calc(10px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
@media (max-height:540px){ #wcol{display:grid;grid-template-columns:repeat(2,60px)} }
.slot{width:60px;height:40px;border-radius:12px;background:var(--ivory);color:var(--ink);font-size:13px;font-weight:700;letter-spacing:-.02em;box-shadow:0 2px 0 var(--edge),0 4px 10px rgba(80,50,20,.28);display:grid;place-items:center;position:relative;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.slot.bait{background:var(--ivory2)}
.slot.sel{background:var(--ink);color:var(--ivory);transform:scale(1.06);box-shadow:0 2px 0 var(--ink2),0 4px 10px rgba(80,50,20,.35)}
.slot:active{transform:translateY(2px)}
#kills{position:fixed;left:calc(14px + env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top));font-family:var(--serif);font-size:30px;line-height:1;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.5);opacity:0;transition:opacity .4s}
#kills.show{opacity:.75}
#kills small{font-size:15px;margin-left:3px}

#quit{position:fixed;top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));padding:12px 18px;border-radius:999px;background:var(--ivory);color:var(--ink);font-size:15px;font-weight:600;line-height:1;box-shadow:0 2px 0 var(--edge),0 4px 12px rgba(80,50,20,.28);opacity:0;transition:opacity .7s;pointer-events:none}
#quit.show{opacity:1;pointer-events:auto}
#confirm{position:fixed;top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));display:none;flex-direction:column;gap:10px;align-items:flex-end}
#confirm.show{display:flex}
#confirm button{padding:13px 20px;border-radius:999px;font-size:16px;font-weight:600;line-height:1;box-shadow:0 2px 0 var(--edge),0 4px 12px rgba(80,50,20,.28)}
#confirm .stop{background:var(--ink);color:var(--ivory)}
#confirm .more{background:var(--ivory);color:var(--ink)}
#confirm button:active{transform:translateY(2px)}

/* 2라운드 UI */
#r2ui{position:fixed;inset:0;display:none;pointer-events:none}
#r2ui>*{pointer-events:auto}
/* 조작은 아래, 상태는 위 */
#pad{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;align-items:center}
.rbtn{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:700;line-height:1;position:relative;background:var(--ivory);color:var(--ink);box-shadow:0 2px 0 var(--edge),0 5px 14px rgba(0,0,0,.5)}
.rbtn:active{transform:translateY(2px)}
.rbtn.off{opacity:.4}
#egg{--p:0}
#egg::before{content:"";position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(var(--ivory) calc(var(--p)*1turn),rgba(0,0,0,.42) 0);-webkit-mask:radial-gradient(circle closest-side,transparent 76%,#000 77%);mask:radial-gradient(circle closest-side,transparent 76%,#000 77%)}
#egg.laid{background:var(--ivory2);color:var(--ink2)}
#egg.ready{box-shadow:0 2px 0 var(--edge),0 0 0 5px var(--ivory),0 0 22px 6px rgba(251,244,228,.75)}
#egg.danger{animation:eggblink .36s steps(2) infinite}
@keyframes eggblink{50%{opacity:.25}}
#egg.pop{animation:eggpop .5s ease-out}
@keyframes eggpop{0%{transform:scale(.6)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
#dash::after{content:"";position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(rgba(0,0,0,.45) calc(var(--c)*1turn),transparent 0);-webkit-mask:radial-gradient(circle closest-side,transparent 76%,#000 77%);mask:radial-gradient(circle closest-side,transparent 76%,#000 77%);--c:0}
#tapfx{position:fixed;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid rgba(251,244,228,.9);opacity:0;pointer-events:none}
#tapfx.go{animation:tapfx .45s ease-out}
@keyframes tapfx{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.8)}}

/* 미니맵 */
#mini{position:fixed;right:calc(12px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));width:88px;height:132px;border-radius:8px;background:rgba(22,14,7,.82);border:1px solid rgba(251,244,228,.3);box-shadow:0 2px 12px rgba(0,0,0,.55);display:none;pointer-events:none}
#mini.show{display:block}
/* 알집 상태 */
#eggbar{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);padding:7px 14px;border-radius:999px;background:rgba(20,12,6,.55);color:#F3E9CF;font-size:14px;font-weight:600;line-height:1;letter-spacing:-.01em;display:none;pointer-events:none;white-space:nowrap}
#eggbar.show{display:block}
#eggbar.warn{background:rgba(150,30,20,.72)}

/* 2라운드 신호·안내 */
#vig{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 38%,rgba(0,0,0,.82) 100%)}
#tox{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 30%,rgba(90,110,30,.75) 100%)}
#hint{position:fixed;left:50%;top:calc(62px + env(safe-area-inset-top));transform:translateX(-50%);max-width:82vw;text-align:center;font-family:var(--serif);font-size:18px;line-height:1.6;color:#F6EFDD;background:rgba(26,16,8,.66);padding:10px 16px;border-radius:16px;opacity:0;transition:opacity .5s;pointer-events:none;word-break:keep-all}
#hint.show{opacity:1}
#hint.dark{color:#3A2412;background:rgba(251,244,228,.88);box-shadow:0 2px 0 var(--edge)}
#genlabel{position:fixed;left:0;right:0;top:33%;text-align:center;font-family:var(--serif);font-size:44px;letter-spacing:.06em;color:#F3E9CF;text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 20px rgba(0,0,0,.8);opacity:0;transition:opacity .7s;pointer-events:none}
#genlabel.show{opacity:1}
#genlabel small{display:block;font-size:17px;letter-spacing:.02em;margin-top:10px;opacity:.85}

/* 전환/결과 */
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}

#endtext{
  position:fixed;
  inset:0;
  display:none;
  place-items:center;
  padding:32px;
  text-align:center;
  background:#000;
  color:#F3E9CF;
  font-family:var(--serif);
  font-size:30px;
  line-height:1.55;
  letter-spacing:.02em;
  pointer-events:none
}

#endtext .eyebrow{
  display:block;
  margin-bottom:18px;
  font-family:var(--sans);
  font-size:13px;
  font-weight:700;
  letter-spacing:.16em;
  color:rgba(243,233,207,.58)
}

#endtext .tools{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:9px;
  max-width:560px
}

#endtext .tools span{
  padding:8px 13px;
  border:1px solid rgba(243,233,207,.38);
  border-radius:999px;
  font-family:var(--sans);
  font-size:16px;
  line-height:1
}

#endtext .baitline{
  margin-top:18px;
  font-family:var(--sans);
  font-size:14px;
  line-height:1.6;
  color:rgba(243,233,207,.64);
  word-break:keep-all
}




#rank{position:fixed;inset:0;display:none;background:var(--ivory2);color:var(--ink);font-family:var(--serif)}
#rank .now{position:absolute;left:0;right:0;top:22%;text-align:center;font-size:92px;line-height:1;letter-spacing:-.02em}
#rank .now small{font-size:38px;letter-spacing:.06em;margin-left:6px}
#rank .sub{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:18px;color:var(--ink2);line-height:1.7;padding:0 24px;word-break:keep-all}
#rank .list{position:absolute;left:0;right:0;top:54%;text-align:center;font-size:18px;line-height:1.85;color:var(--ink2)}
#rank .list div:first-child{color:var(--ink)}
#rank .again{position:absolute;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));text-align:center;font-size:16px;color:var(--ink2);opacity:.8;font-family:var(--sans)}
#rank .allover{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(34px + env(safe-area-inset-bottom));padding:11px 20px;border-radius:999px;background:var(--ivory);font-size:14px;font-weight:600;font-family:var(--sans);box-shadow:0 2px 0 var(--edge)}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="stick"><div id="knob"></div></div>

  <div id="r1ui">
    <div id="wcol"></div>
    <div id="bcol"></div>
    <div id="kills"><span class="n">0</span><small>마리</small></div>
    <div id="quit">그만할까?</div>
    <div id="confirm">
      <button class="stop">그만하기</button>
      <button class="more">계속하기</button>
    </div>
  </div>

  <div id="r2ui">
    <canvas id="mini" width="176" height="264"></canvas>
    <div id="eggbar"></div>

    <div id="pad">
      <button id="egg" class="rbtn">알 낳기</button>
      <button id="dash" class="rbtn">달리기</button>
    </div>

    <div id="tapfx"></div>
  </div>

  <div id="vig"></div>
  <div id="tox"></div>
  <div id="hint"></div>
  <div id="genlabel"></div>
  <div id="fade"></div>
  <div id="endtext"></div>

  <div id="rank">
    <div class="now"></div>
    <div class="sub"></div>
    <div class="list"></div>
    <div class="again">화면을 누르면 같은 조건으로 다시</div>
    <button class="allover">처음부터</button>
  </div>




</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ───────── 공통 ─────────
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const TAU=Math.PI*2;
const wrapAng=a=>((a+Math.PI)%TAU+TAU)%TAU-Math.PI;
const angleLerp=(a,b,t)=>a+wrapAng(b-a)*t;
const damp=(a,b,rate,dt)=>lerp(a,b,1-Math.exp(-rate*dt));
const angleDamp=(a,b,rate,dt)=>angleLerp(a,b,1-Math.exp(-rate*dt));
const dist2=(ax,az,bx,bz)=>{const dx=ax-bx,dz=az-bz;return dx*dx+dz*dz;};
const now=()=>performance.now()/1000;

// ───────── 방 ─────────
const ROOM={x1:-2,x2:2,z1:-3,z2:3,h:2.4};
const OBST=[
  {n:'counter',x1:-2,z1:1.2,x2:-1.45,z2:2.45,h:0.86,roach:false,human:false},
  {n:'fridge',x1:-2,z1:0.2,x2:-1.4,z2:0.9,h:1.4,roach:false,human:false},
  {n:'bed',x1:0.9,z1:-2.9,x2:2,z2:-0.9,h:0.45,roach:false,human:false},
  {n:'desk',x1:-1.6,z1:-3,x2:-0.2,z2:-2.4,h:0.72,roach:true,human:false},
  {n:'chair',x1:-1.1,z1:-2.3,x2:-0.7,z2:-1.9,h:0.45,roach:true,human:false},
  {n:'shelf',x1:0.2,z1:-3,x2:0.9,z2:-2.7,h:1.8,roach:false,human:false},
  {n:'trash',x1:0.55,z1:2.45,x2:0.95,z2:2.85,h:0.5,roach:false,human:false},
];
// 숨는 자리: 구멍 5곳 + 방석 밑 + 책상 밑. 사람은 이 자리들을 차례로 뒤진다.
const HOLES=[
  {n:'fridge',label:'냉장고 밑',x:-1.52,z:0.55,dx:1,dz:0,hole:true},
  {n:'sink',label:'싱크대 밑',x:-1.52,z:1.7,dx:1,dz:0,hole:true},
  {n:'drain',label:'하수구',x:-1.78,z:2.8,dx:0.93,dz:-0.37,hole:true},
  {n:'crack',label:'벽지 틈',x:1.94,z:0.2,dx:-1,dz:0,hole:true},
  {n:'shelf',label:'책장 뒤',x:0.55,z:-2.66,dx:0,dz:1,hole:true},
  {n:'cushion',label:'방석 밑',x:0.1,z:-0.4,dx:0,dz:1,r:0.2,cushion:true},
  {n:'desk',label:'책상 밑',x:-0.9,z:-2.7,dx:0,dz:1,rect:true,rx:0.66,rz:0.27},
];
const HOLE_LIST=HOLES.filter(h=>h.hole);
const CUSHION=HOLES.find(h=>h.n==='cushion');
const HOLE_R=0.17;
const inSpot=(h,x,z)=>h.rect?(Math.abs(x-h.x)<h.rx&&Math.abs(z-h.z)<h.rz):dist2(x,z,h.x,h.z)<(h.r||HOLE_R)*(h.r||HOLE_R);
function spotAt(x,z){ for(const h of HOLES){ if(inSpot(h,x,z)) return h; } return null; }
const ROACH_L=0.13;           // 바퀴 몸길이 (연출상 실물의 3배쯤 — 폰에서 손가락으로 잡히는 크기)
const LAMP_POS=new THREE.Vector3(-0.55,1.08,-2.72);
const SWITCH_STAND={x:0.2,z:2.55};
const BEDSIDE={x:0.55,z:-1.55};

function inObst(o,x,z,m=0){return x>o.x1-m&&x<o.x2+m&&z>o.z1-m&&z<o.z2+m;}
function nearHole(x,z,r){ if(r===undefined) return spotAt(x,z); let best=null,bd=1e9; for(const h of HOLES){ if(h.rect) continue; const d=dist2(x,z,h.x,h.z); if(d<r*r&&d<bd){bd=d;best=h;} } return best; }
function roachMove(x,z,nx,nz){
  const m=0.025;
  const ok=(px,pz)=>{
    if(px<ROOM.x1+m||px>ROOM.x2-m||pz<ROOM.z1+m||pz>ROOM.z2-m) return false;
    if(nearHole(px,pz,HOLE_R)) return true;
    for(const o of OBST){ if(!o.roach&&inObst(o,px,pz,0.01)) return false; }
    return true;
  };
  if(ok(nx,nz)) return [nx,nz];
  if(ok(nx,z)) return [nx,z];
  if(ok(x,nz)) return [x,nz];
  return [x,z];
}

// ───────── 소리 ─────────
class AudioFX{
  constructor(){this.ctx=null;this.loops={};}
  ensure(){
    if(!this.ctx){
      const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
      this.ctx=new C();
      this.master=this.ctx.createGain(); this.master.gain.value=0.85;
      this.comp=this.ctx.createDynamicsCompressor(); this.comp.threshold.value=-14; this.comp.ratio.value=5; this.comp.attack.value=0.002; this.comp.release.value=0.12;
      this.master.connect(this.comp); this.comp.connect(this.ctx.destination);
      const len=this.ctx.sampleRate*2, buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      this.noiseBuf=buf;
    }
    if(this.ctx.state==='suspended') this.ctx.resume();
  }
  get t(){return this.ctx?this.ctx.currentTime:0;}
  env(g,t,att,dur,peak){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002),t+att); g.gain.exponentialRampToValueAtTime(0.0001,t+att+dur); }
  noise({t=0,dur=0.1,gain=0.5,att=0.002,type='bandpass',freq=2000,q=1,freqEnd=null,rate=1,pan=0,trem=0}={}){
    if(!this.ctx) return; const c=this.ctx, t0=c.currentTime+t;
    const s=c.createBufferSource(); s.buffer=this.noiseBuf; s.loop=true; s.playbackRate.value=rate;
    s.start(t0,Math.random()*1.5);
    const f=c.createBiquadFilter(); f.type=type; f.frequency.setValueAtTime(freq,t0); f.Q.value=q;
    if(freqEnd) f.frequency.exponentialRampToValueAtTime(Math.max(20,freqEnd),t0+att+dur);
    const g=c.createGain(); this.env(g,t0,att,dur,gain);
    let node=g;
    if(trem>0){ const tg=c.createGain(); const n=Math.floor((att+dur)*trem*2)+2; const arr=new Float32Array(n); for(let i=0;i<n;i++) arr[i]=0.35+0.65*(i%2); tg.gain.setValueCurveAtTime(arr,t0,att+dur+0.01); g.connect(tg); node=tg; }
    const p=c.createStereoPanner(); p.pan.value=clamp(pan,-1,1);
    s.connect(f); f.connect(g); node.connect(p); p.connect(this.master);
    s.stop(t0+att+dur+0.05);
  }
  tone({t=0,dur=0.1,gain=0.3,att=0.002,freq=200,freqEnd=null,type='sine',pan=0}={}){
    if(!this.ctx) return; const c=this.ctx, t0=c.currentTime+t;
    const o=c.createOscillator(); o.type=type; o.frequency.setValueAtTime(freq,t0);
    if(freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(20,freqEnd),t0+att+dur);
    const g=c.createGain(); this.env(g,t0,att,dur,gain);
    const p=c.createStereoPanner(); p.pan.value=clamp(pan,-1,1);
    o.connect(g); g.connect(p); p.connect(this.master); o.start(t0); o.stop(t0+att+dur+0.05);
  }
  loop(name,make){ if(!this.ctx||this.loops[name]) return; const c=this.ctx; const g=c.createGain(); g.gain.setValueAtTime(0.0001,c.currentTime); g.connect(this.master); const nodes=make(c,g); this.loops[name]={g,nodes}; g.gain.exponentialRampToValueAtTime(1,c.currentTime+0.06); }
  stopLoop(name){ const L=this.loops[name]; if(!L) return; const c=this.ctx; L.g.gain.cancelScheduledValues(c.currentTime); L.g.gain.setValueAtTime(L.g.gain.value||0.5,c.currentTime); L.g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.12); setTimeout(()=>{L.nodes.forEach(n=>{try{n.stop();}catch(e){}});},200); delete this.loops[name]; }
  setLoopGain(name,v){ const L=this.loops[name]; if(!L) return; L.g.gain.setTargetAtTime(Math.max(0.0001,v),this.ctx.currentTime,0.05); }

  // ── 바퀴가 눌려 죽는 소리. 1라운드와 2라운드가 같은 소리다. ──
  // bright: 1이면 위에서 내려다보며 듣는 소리(파작·바삭), 낮을수록 바닥에서 가까이 듣는 소리(고역이 눌리고 저역이 남는다)
  kill(weapon,combo=0,mult=1,delay=0,pan=0,bright=1){

function texFloor(){
  const c=document.createElement('canvas'); c.width=c.height=1024; const g=c.getContext('2d');
  g.fillStyle='#E2AC46'; g.fillRect(0,0,1024,1024);
  const plank=1024/4;
  for(let p=0;p<4;p++){
    const x0=p*plank; g.fillStyle=`hsl(${36+rand(-2,2)},${64+rand(-4,4)}%,${55+rand(-1.5,1.5)}%)`; g.fillRect(x0,0,plank,1024);
    for(let i=0;i<70;i++){ g.strokeStyle=`hsla(30,55%,${30+rand(20)}%,${rand(0.05,0.14)})`; g.lineWidth=rand(0.6,2.2); g.beginPath(); const y=rand(1024); g.moveTo(x0+rand(-20,20),y); for(let k=1;k<=6;k++) g.lineTo(x0+k*plank/6+rand(-14,14),y+rand(-40,40)); g.stroke(); }
    g.fillStyle='rgba(120,70,20,0.35)'; g.fillRect(x0,0,2,1024); g.fillStyle='rgba(255,240,200,0.25)'; g.fillRect(x0+2,0,2,1024);
  }
  const id=g.getImageData(0,0,1024,1024), d=id.data; for(let i=0;i<d.length;i+=4){ const n=rand(-10,10); d[i]+=n; d[i+1]+=n; d[i+2]+=n; } g.putImageData(id,0,0);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(4/1.2,6/1.2); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
function texWall(){
  const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
  g.fillStyle='#F4EBD6'; g.fillRect(0,0,256,256);
  g.fillStyle='rgba(200,170,120,0.35)'; for(let y=0;y<256;y+=32) for(let x=0;x<256;x+=32){ g.beginPath(); g.arc(x+16+((y/32)%2)*8,y+16,2,0,TAU); g.fill(); }
  const id=g.getImageData(0,0,256,256), d=id.data; for(let i=0;i<d.length;i+=4){ const n=rand(-6,6); d[i]+=n; d[i+1]+=n; d[i+2]+=n; } g.putImageData(id,0,0);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(8,4); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function texTile(){

}

}


const NYMPH_SCALE=0.46;
function makeNymph(){
  const m=makeRoach();
  m.parts.wing.visible=false;
  m.g.traverse(o=>{
    if(!o.isMesh) return;
    if(o.material===MAT.roachBody||o.material===MAT.roachWing) o.material=MAT.nymphBody;
    else if(o.material===MAT.roachRim||o.material===MAT.roachPro) o.material=MAT.nymphPlate;
    else if(o.material===MAT.roachSeam) o.material=MAT.nymphMark;
    else if(o.material===MAT.roachLeg) o.material=MAT.nymphLeg;
  });
  const adultPose=m.pose;
  m.pose=(speedNorm,dt,dead=0)=>{
    adultPose(speedNorm,dt,dead);
    m.g.scale.multiplyScalar(NYMPH_SCALE);
  };
  m.pose(0,0,0);
  return m;
}

class NavGrid{
  constructor(){ this.cs=0.1; this.nx=40; this.nz=60; this.blk=new Uint8Array(this.nx*this.nz);
    for(let j=0;j<this.nz;j++) for(let i=0;i<this.nx;i++){ const x=ROOM.x1+(i+0.5)*this.cs, z=ROOM.z1+(j+0.5)*this.cs; let b=(x<ROOM.x1+0.24||x>ROOM.x2-0.24||z<ROOM.z1+0.24||z>ROOM.z2-0.24)?1:0; if(!b) for(const o of OBST){ if(!o.human&&inObst(o,x,z,0.24)){ b=1; break; } } this.blk[j*this.nx+i]=b; } }
  cell(x,z){ return [clamp(Math.floor((x-ROOM.x1)/this.cs),0,this.nx-1),clamp(Math.floor((z-ROOM.z1)/this.cs),0,this.nz-1)]; }
  free(i,j){ return i>=0&&j>=0&&i<this.nx&&j<this.nz&&!this.blk[j*this.nx+i]; }
  nearestFree(i,j){ if(this.free(i,j)) return [i,j]; for(let r=1;r<8;r++) for(let dj=-r;dj<=r;dj++) for(let di=-r;di<=r;di++){ if(this.free(i+di,j+dj)) return [i+di,j+dj]; } return [i,j]; }
  path(x0,z0,x1,z1){
    let [si,sj]=this.nearestFree(...this.cell(x0,z0)); let [gi,gj]=this.nearestFree(...this.cell(x1,z1));
    const N=this.nx*this.nz, g=new Float32Array(N).fill(1e9), f=new Float32Array(N).fill(1e9), from=new Int32Array(N).fill(-1), closed=new Uint8Array(N);
    const h=(i,j)=>Math.hypot(i-gi,j-gj); const s=sj*this.nx+si, goal=gj*this.nx+gi; g[s]=0; f[s]=h(si,sj);
    const open=[s];
    while(open.length){ let bi=0; for(let k=1;k<open.length;k++) if(f[open[k]]<f[open[bi]]) bi=k; const c=open.splice(bi,1)[0]; if(c===goal) break; closed[c]=1; const ci=c%this.nx, cj=(c/this.nx)|0;
      for(let dj=-1;dj<=1;dj++) for(let di=-1;di<=1;di++){ if(!di&&!dj) continue; const ni=ci+di, nj=cj+dj; if(!this.free(ni,nj)) continue; if(di&&dj&&(!this.free(ci+di,cj)||!this.free(ci,cj+dj))) continue; const n=nj*this.nx+ni; if(closed[n]) continue; const ng=g[c]+Math.hypot(di,dj); if(ng<g[n]){ g[n]=ng; f[n]=ng+h(ni,nj); from[n]=c; if(!open.includes(n)) open.push(n); } } }
    if(from[goal]<0&&goal!==s) return [[x1,z1]];
    const out=[]; let c=goal; while(c>=0&&c!==s){ out.push([ROOM.x1+(c%this.nx+0.5)*this.cs,ROOM.z1+((c/this.nx|0)+0.5)*this.cs]); c=from[c]; } out.reverse();
    const sm=[]; let cur=[x0,z0]; let k=0; while(k<out.length){ let far=k; for(let m=out.length-1;m>k;m--){ if(this.clear(cur[0],cur[1],out[m][0],out[m][1])){ far=m; break; } } sm.push(out[far]); cur=out[far]; k=far+1; }
    if(sm.length) sm[sm.length-1]=[x1,z1]; else sm.push([x1,z1]); return sm;
  }
  clear(x0,z0,x1,z1){ const n=Math.ceil(Math.hypot(x1-x0,z1-z0)/0.05); for(let k=1;k<n;k++){ const t=k/n; const [i,j]=this.cell(lerp(x0,x1,t),lerp(z0,z1,t)); if(!this.free(i,j)) return false; } return true; }
}

class UI{
  constructor(G){ this.G=G;
    const wcol=document.getElementById('wcol'), bcol=document.getElementById('bcol'); this.slotEls={};
    for(const k of [...SLOT_ORDER,...BAIT_SLOTS]){ const d=document.createElement('div'); d.className='slot'+(BAIT_SLOTS.includes(k)?' bait':''); d.textContent=LABEL[k]; d.addEventListener('pointerdown',e=>{ e.stopPropagation(); e.preventDefault(); SFX.ensure(); G.r1.selectItem(k); }); (BAIT_SLOTS.includes(k)?bcol:wcol).appendChild(d); this.slotEls[k]=d; }
    this.killsEl=document.getElementById('kills'); this.killsN=this.killsEl.querySelector('.n');
    this.quit=document.getElementById('quit'); this.confirm=document.getElementById('confirm');
    this.quit.addEventListener('pointerdown',e=>{ e.stopPropagation(); SFX.ensure(); this.quit.style.transition='none'; this.quit.classList.remove('show'); setTimeout(()=>{ this.quit.style.transition=''; },50); this.confirm.classList.add('show'); G.state='confirm'; });
    this.confirm.querySelector('.more').addEventListener('pointerdown',e=>{ e.stopPropagation(); this.confirm.classList.remove('show'); G.state='r1'; G.r1.touch(); this.quit.style.transition='none'; this.showQuit(true); setTimeout(()=>{ this.quit.style.transition=''; },50); });
    this.confirm.querySelector('.stop').addEventListener('pointerdown',e=>{ e.stopPropagation(); this.confirm.classList.remove('show'); G.toRound2(); });
    this.tapfx=document.getElementById('tapfx'); G.input.onDashTap=(x,y)=>{ const t=this.tapfx; t.style.left=x+'px'; t.style.top=y+'px'; t.classList.remove('go'); void t.offsetWidth; t.classList.add('go'); };
    this.pad=document.getElementById('pad'); this.egg=document.getElementById('egg'); this.dash=document.getElementById('dash'); this.eggbar=document.getElementById('eggbar');
    const eDown=e=>{ e.stopPropagation(); e.preventDefault(); SFX.ensure(); G.input.eggHold=true; }; const eUp=()=>{ G.input.eggHold=false; };
    this.egg.addEventListener('pointerdown',eDown); this.egg.addEventListener('pointerup',eUp); this.egg.addEventListener('pointercancel',eUp); this.egg.addEventListener('pointerleave',eUp);
    this.dash.addEventListener('pointerdown',e=>{ e.stopPropagation(); e.preventDefault(); SFX.ensure(); G.input.dashReq=true; });
    this.mini=document.getElementById('mini'); this.mctx=this.mini.getContext('2d'); this.miniT=0;
    this.rank=document.getElementById('rank');
    this.rank.addEventListener('pointerdown',e=>{ if(e.target.classList.contains('allover')) return; e.stopPropagation(); if(G.state==='rank'&&G.rankT>0.8) G.restart(); });
    this.rank.querySelector('.allover').addEventListener('pointerdown',e=>{ e.stopPropagation(); if(G.rankT>0.8) G.restartAll(); });
    this.endtext=document.getElementById('endtext'); this.fade=document.getElementById('fade');
  }
  selectSlot(k){ for(const s in this.slotEls) this.slotEls[s].classList.toggle('sel',s===k); }
  setKills(n){ if(n===null){ this.killsEl.classList.remove('show'); return; } this.killsN.textContent=n; this.killsEl.classList.toggle('show',n>0); }
  showQuit(b){ this.quit.classList.toggle('show',b&&this.G.state==='r1'); }
  eggState(mode){ const e=this.egg; if(e.dataset.mode===mode) return; const was=e.dataset.mode; e.dataset.mode=mode;
    this.pad.style.display=(mode==='none')?'none':'flex';
       e.classList.toggle(
      'laid',
      mode==='laid'
    );

    e.textContent=
      mode==='laid'
        ? '알집'
        : '알 낳기';
    if(mode==='show'&&was!=='show'){ e.classList.remove('pop'); void e.offsetWidth; e.classList.add('pop'); }
    if(mode!=='laid'){ e.classList.remove('ready','danger'); }
    if(mode==='none'){ e.style.setProperty('--p','0'); this.eggBar(null); } }
  eggProgress(k){ this.egg.style.setProperty('--p',k.toFixed(3)); }
  eggReady(b){ this.egg.classList.toggle('ready',b); }
  eggDanger(b){ this.egg.classList.toggle('danger',b); }
  eggBar(text,warn){ const el=this.eggbar; if(!text){ el.classList.remove('show'); return; } el.textContent=text; el.classList.add('show'); el.classList.toggle('warn',!!warn); }
  dashCool(k){ this.dash.style.setProperty('--c',clamp(k,0,1).toFixed(2)); this.dash.classList.toggle('off',k>0.02); }
  vignette(b){ document.getElementById('vig').style.opacity=b?'1':'0'; }
  tox(k){ document.getElementById('tox').style.opacity=clamp(k,0,1).toFixed(2); }
  miniOn(b){ this.mini.classList.toggle('show',b); }
  drawMini(d){
    if(!d) return; const c=this.mctx, W=176, H=264, px=x=>(x+2)/4*W, pz=z=>(z+3)/6*H;
    c.clearRect(0,0,W,H);
    c.fillStyle='rgba(240,232,210,0.10)'; c.fillRect(0,0,W,H);
    c.fillStyle='rgba(240,232,210,0.22)';
    for(const o of OBST) c.fillRect(px(o.x1),pz(o.z1),(o.x2-o.x1)/4*W,(o.z2-o.z1)/6*H);
    c.fillStyle='rgba(251,244,228,0.85)';
    for(const h of HOLES){ c.beginPath(); c.arc(px(h.x),pz(h.z),4,0,TAU); c.fill(); }
    c.fillStyle='rgba(150,190,60,0.95)';
    for(const t of d.traps){ c.beginPath(); c.arc(px(t[0]),pz(t[1]),4,0,TAU); c.fill(); }
    if(d.egg){ c.strokeStyle=d.ready?'#FBF4E4':'#F0C419'; c.lineWidth=3; c.beginPath(); c.arc(px(d.egg[0]),pz(d.egg[1]),7,0,TAU); c.stroke(); }
    if(d.human){ c.fillStyle='rgba(210,60,40,0.95)'; c.beginPath(); c.arc(px(d.human[0]),pz(d.human[1]),9,0,TAU); c.fill(); }
    if(d.me){ c.fillStyle='#FFFFFF'; c.beginPath(); c.arc(px(d.me[0]),pz(d.me[1]),5,0,TAU); c.fill(); c.strokeStyle='#FFFFFF'; c.lineWidth=2.5; c.beginPath(); c.moveTo(px(d.me[0]),pz(d.me[1])); c.lineTo(px(d.me[0])+Math.sin(d.me[2])*11,pz(d.me[1])+Math.cos(d.me[2])*11); c.stroke(); }
  }
  hint(text,dur=4.5,delay=0,dark=false){ this.hq=this.hq||[]; this.hq.push({text,dur,delay,dark}); if(!this.hintBusy) this.hintNext(); }
  hintNext(){ const el=document.getElementById('hint'); const q=this.hq; if(!q||!q.length){ this.hintBusy=false; return; } this.hintBusy=true; const h=q.shift(); this.hintTimer=setTimeout(()=>{ el.textContent=h.text; el.classList.toggle('dark',!!h.dark); el.classList.add('show'); this.hintTimer=setTimeout(()=>{ el.classList.remove('show'); this.hintTimer=setTimeout(()=>this.hintNext(),600); },h.dur*1000); },h.delay*1000); }
  hintClear(){ this.hq=[]; clearTimeout(this.hintTimer); this.hintBusy=false; document.getElementById('hint').classList.remove('show'); }
  genLabel(text,sub){ const el=document.getElementById('genlabel'); clearTimeout(this.genTimer); if(!text){ el.classList.remove('show'); return; } el.innerHTML=text+(sub?`<small>${sub}</small>`:''); el.classList.add('show'); this.genTimer=setTimeout(()=>el.classList.remove('show'),2600); }
}

// ───────── 게임 전체 ─────────
const G={time:0,state:'boot',shakeAmt:0,savedWeapons:null,savedBaits:null};
G.canvas=document.getElementById('gl');
G.renderer=new THREE.WebGLRenderer({canvas:G.canvas,antialias:true,powerPreference:'high-performance'});
G.renderer.shadowMap.enabled=true; G.renderer.shadowMap.type=THREE.PCFSoftShadowMap; G.renderer.toneMapping=THREE.ACESFilmicToneMapping; G.renderer.toneMappingExposure=1.0; G.renderer.outputColorSpace=THREE.SRGBColorSpace;
G.scene=new THREE.Scene(); G.scene.background=new THREE.Color(0xEBDFC0);
G.camera=new THREE.PerspectiveCamera(40,1,0.01,40); G.camBase=new THREE.Vector3(); G.camRight=new THREE.Vector3(1,0,0); G.camUp=new THREE.Vector3(0,0,-1); G.camFwd=new THREE.Vector3(0,0,-1);
G.isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
G.paint=new FloorPaint();
G.room=buildRoom(G.scene);
G.corpses=new Corpses(G.scene);
{ const ov=new THREE.Mesh(new THREE.PlaneGeometry(4,6),new THREE.MeshStandardMaterial({map:G.paint.tex,transparent:true,roughness:0.65,metalness:0,depthWrite:false})); ov.rotation.x=-Math.PI/2; ov.position.y=0.002; ov.receiveShadow=true; ov.renderOrder=1; G.scene.add(ov); }
// 조명 — 1라운드도 2라운드도 같은 낮이다. 다른 건 보는 높이뿐.
const SM=G.isTouch?1024:1536;
G.hemi=new THREE.HemisphereLight(0xfff6e8,0xd9a441,0.9); G.scene.add(G.hemi);
G.sun=new THREE.DirectionalLight(0xffffff,2.4); G.sun.position.set(1.0,7,0.7); G.sun.target.position.set(0,0,0); G.scene.add(G.sun,G.sun.target);
G.sun.castShadow=true; G.sun.shadow.mapSize.set(SM,SM); Object.assign(G.sun.shadow.camera,{left:-2.4,right:2.4,top:3.4,bottom:-3.4,near:1,far:12}); G.sun.shadow.camera.updateProjectionMatrix(); G.sun.shadow.bias=-0.0004; G.sun.shadow.normalBias=0.012;
// 커튼 사이로 들어오는 낮빛 — 2라운드의 주광원
G.win=new THREE.DirectionalLight(0xe8eeff,0); G.win.position.set(7,2.4,-1.9); G.win.target.position.set(-1.2,0,-0.2); G.scene.add(G.win,G.win.target);
G.win.castShadow=true; G.win.shadow.mapSize.set(SM,SM); Object.assign(G.win.shadow.camera,{left:-3.4,right:3.4,top:3.2,bottom:-2.2,near:1,far:14}); G.win.shadow.camera.updateProjectionMatrix(); G.win.shadow.bias=-0.0006; G.win.shadow.normalBias=0.012;
// 천장 형광등 — 방 전체에 고르게 떨어지는 빛
G.ceilLamp=new THREE.DirectionalLight(0xfff8ee,0); G.ceilLamp.position.set(0.2,6,0.3); G.ceilLamp.target.position.set(0,0,0); G.scene.add(G.ceilLamp,G.ceilLamp.target);
G.ceilLamp.castShadow=true; G.ceilLamp.shadow.mapSize.set(SM,SM); Object.assign(G.ceilLamp.shadow.camera,{left:-2.4,right:2.4,top:3.4,bottom:-3.4,near:1,far:11}); G.ceilLamp.shadow.camera.updateProjectionMatrix(); G.ceilLamp.shadow.bias=-0.0004; G.ceilLamp.shadow.normalBias=0.012;
G.setLighting=function(mode){
  const R=G.room;
  R.ceilGroup.visible=(mode!=='day');
  R.ceil.material.emissiveIntensity=mode==='on'?0.5:0.03;
  const glass=(col,i)=>{ R.glass.material.emissive.set(col); R.glass.material.emissiveIntensity=i; R.glass.material.color.set(col); };
  const cur=(mode==='dim'||mode==='empty')?0.72:1;
  MAT.curtain.color.setRGB(0.92*cur,0.84*cur,0.66*cur);
  if(mode==='day'){ // 1라운드 — 위에서 내려다본다
    G.hemi.intensity=0.62; G.hemi.color.set(0xfff6e8); G.hemi.groundColor.set(0xd9a441);
    G.sun.intensity=1.75; G.sun.color.set(0xfff4e2); G.sun.visible=true; G.sun.castShadow=true;
    G.win.intensity=0; G.win.visible=false; G.win.castShadow=false;
    G.ceilLamp.intensity=0; G.ceilLamp.visible=false; G.ceilLamp.castShadow=false;
    R.fluor.material.emissiveIntensity=1.4; R.lampBulb.material.emissiveIntensity=0;
    glass(0xcfe6f7,0.7); G.scene.background.set(0xEBDFC0); G.renderer.toneMappingExposure=1.02;
  } else if(mode==='dim'||mode==='empty'){ // 2라운드 — 같은 낮, 커튼이 쳐진 방
    G.hemi.intensity=0.42; G.hemi.color.set(0xC2CCE0); G.hemi.groundColor.set(0x7a5626);
    G.sun.intensity=0; G.sun.visible=false; G.sun.castShadow=false;
    G.win.intensity=mode==='empty'?2.5:2.7; G.win.visible=true; G.win.castShadow=true;
    G.ceilLamp.intensity=0; G.ceilLamp.visible=false; G.ceilLamp.castShadow=false;
    R.fluor.material.emissiveIntensity=0.02; R.lampBulb.material.emissiveIntensity=0;
    glass(0xF4F9FF,2.6); G.scene.background.set(0x2E2C29); G.renderer.toneMappingExposure=1.1;
  } else if(mode==='on'){ // 형광등이 켜졌다
    G.hemi.intensity=0.6; G.hemi.color.set(0xeef3ff); G.hemi.groundColor.set(0xc9a05a);
    G.sun.intensity=0; G.sun.visible=false; G.sun.castShadow=false;
    G.win.intensity=0.75; G.win.visible=true; G.win.castShadow=false;
    G.ceilLamp.intensity=2.1; G.ceilLamp.visible=true; G.ceilLamp.castShadow=true;
    R.fluor.material.emissiveIntensity=1.9; R.lampBulb.material.emissiveIntensity=0;
    glass(0xEAF3FF,1.4); G.scene.background.set(0x3A3833); G.renderer.toneMappingExposure=1.06;
  }
};
G.shake=function(a){ G.shakeAmt=Math.max(G.shakeAmt,a); };
G.blackout=function(on,instant=true){ const f=document.getElementById('fade'); f.style.transition=instant?'none':'opacity .6s'; f.style.background='#000'; f.style.opacity=on?'1':'0'; };
G.flash=function(col){ const f=document.getElementById('fade'); f.style.transition='none'; f.style.background=col; f.style.opacity='1'; setTimeout(()=>{ f.style.transition='background .5s'; f.style.background='#000'; },80); };
G.view={w:1.5,h:3.3}; G.ppm=260;
G.resize=function(){ const w=innerWidth,h=innerHeight; G.renderer.setSize(w,h,false); G.renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5)); G.camera.aspect=w/h; G.ppm=clamp(Math.min(w,h)/1.5,200,340); G.portrait=h>=w; G.camera.updateProjectionMatrix(); const V=h/G.ppm; G.topH=V/(2*Math.tan(G.camera.fov*Math.PI/360)); if(G.portrait){ G.view.h=V; G.view.w=V*w/h; } else { G.view.w=V; G.view.h=V*w/h; } };
G.setTopCam=function(cx,cz,scale=1){ const cam=G.camera; if(cam.fov!==40){ cam.fov=40; cam.updateProjectionMatrix(); G.resize(); } cam.up.set(G.portrait?0:1,0,G.portrait?-1:0); cam.position.set(cx,G.topH*scale,cz); cam.lookAt(cx,0,cz); if(G.portrait){ G.camRight.set(1,0,0); G.camUp.set(0,0,-1); } else { G.camRight.set(0,0,1); G.camUp.set(1,0,0); } };
window.addEventListener('resize',()=>G.resize());
G.input=new Input(G.canvas); G.ui=new UI(G); G.r1=new Round1(G); G.r2=new Round2(G);
const inR1=()=>G.state==='r1';
G.input.onPress=(x,y,t)=>{ if(inR1()) G.r1.press(x,y,t); };
G.input.onDrag=(x,y)=>{ if(inR1()) G.r1.drag(x,y); };
G.input.onRelease=()=>{ if(inR1()) G.r1.release(); };
G.input.onCancel=()=>{ if(inR1()) G.r1.cancel(); };
G.input.onPan=(dx,dy)=>{ if(inR1()) G.r1.pan(dx,dy); };
G.input.onAny=()=>{ if(inR1()) G.r1.touch(); };
const ALL_SLOTS=[...SLOT_ORDER,...BAIT_SLOTS];
G.input.onKey=(code,down)=>{
  if(inR1()){ if(down){ const n=parseInt(code.replace('Digit',''),10); if(n>=1&&n<=9) G.r1.selectItem(ALL_SLOTS[n-1]); if(code==='Digit0') G.r1.selectItem(ALL_SLOTS[9]); if(code==='Minus') G.r1.selectItem(ALL_SLOTS[10]); if(code==='Tab'){ const i=ALL_SLOTS.indexOf(G.r1.item); G.r1.selectItem(ALL_SLOTS[(i+1)%ALL_SLOTS.length]); } } }
  else if(G.state==='r2'){ if(code==='Space'&&down) G.input.dashReq=true; if(code==='KeyE') G.input.eggHold=down; }
};
window.addEventListener('keydown',e=>{ if(e.code==='Tab'&&inR1()) e.preventDefault(); });
window.addEventListener('wheel',e=>{ if(!inR1()) return; let i=ALL_SLOTS.indexOf(G.r1.item); i=(i+(e.deltaY>0?1:-1)+ALL_SLOTS.length)%ALL_SLOTS.length; G.r1.selectItem(ALL_SLOTS[i]); },{passive:true});
// 흐름
G.startRound1=function(){ G.state='r1'; G.r2.stop(); G.camera.fov=40; G.camera.near=0.05; G.camera.updateProjectionMatrix(); G.resize(); G.r1.start(); G.blackout(false,false); };


G.toRound2=function(){
  G.state='to_r2';

  G.ui.showQuit(false);
  G.r1.stop();
  G.ui.hintClear();
  G.input.reset();
  G.blackout(true,false);

  const used=[...G.r1.used].filter(k=>LETHAL_ORDER.includes(k));

  G.savedWeapons=(used.length?used:['hand']).sort(
    (a,b)=>LETHAL_ORDER.indexOf(a)-LETHAL_ORDER.indexOf(b)
  );

  G.savedBaits=[...G.r1.baitsUsed].sort(
    (a,b)=>BAIT_SLOTS.indexOf(a)-BAIT_SLOTS.indexOf(b)
  );

  // 사용한 도구는 2라운드 구성에만 반영하고 따로 설명하지 않는다.
  setTimeout(()=>{
    if(G.state==='to_r2') G.startRound2();
  },650);
};

G.startRound2=function(){
  G.state='r2';

  G.r1.stop();
  G.ui.showQuit(false);
  G.ui.confirm.classList.remove('show');

  G.camera.fov=68;
  G.camera.near=0.01;
  G.camera.updateProjectionMatrix();

  G.resize();
  G.paint.clear();
  G.corpses.clear();

  G.r2.start(
    G.savedWeapons||['hand'],
    G.savedBaits||[]
  );
};

G.lineEnded=function(gen){
  G.state='ended';

  G.r2.stop();
  G.input.reset();
  G.blackout(true);

  const e=document.getElementById('endtext');
  e.textContent='알집이 남지 않았다.';
  e.style.display='grid';

  setTimeout(()=>{
    e.style.display='none';
    G.showRank(gen,false);
  },1700);
};


G.ending=function(gen){
  G.state='ended';

  G.r2.stop();
  G.input.reset();
  G.showRank(gen,true);
};


G.showRank=function(gen,ended){
  G.state='rank';
  G.rankT=0;

  let list=[];

  try{
    list=JSON.parse(localStorage.getItem('roach_gens')||'[]');
  }catch(e){}

  list.unshift({g:gen,t:Date.now()});
  list=list.slice(0,10);

  try{
    localStorage.setItem('roach_gens',JSON.stringify(list));
  }catch(e){}

  const generations=gen+1;
  const rk=document.getElementById('rank');

  rk.querySelector('.now').innerHTML=
    `${generations}<small>세대</small>`;

  rk.querySelector('.sub').textContent=
    ended
      ? '사람은 방을 비웠다.'
      : `${generations}세대가 이어졌다.`;

  rk.querySelector('.list').innerHTML=
    list
      .slice(1)
      .map(o=>`<div>${Number(o.g)+1}세대</div>`)
      .join('');

  rk.style.display='block';
  G.blackout(false);
};


G.restart=function(){ document.getElementById('rank').style.display='none'; G.startRound2(); };
G.restartAll=function(){ document.getElementById('rank').style.display='none'; G.startRound1(); };
// 디버그 진입
const Q=new URLSearchParams(location.search); G.paused=Q.get('pause')==='1';
G.resize();
if(Q.get('r')==='2'){ G.savedWeapons=Q.get('w')?Q.get('w').split(','):LETHAL_ORDER.slice(); G.savedBaits=Q.get('b')?Q.get('b').split(','):['bone']; G.startRound2(); if(Q.get('gen')){ G.r2.gen=parseInt(Q.get('gen'),10); G.r2.startGen(); } }
else if(Q.get('r')==='rank'){ G.savedWeapons=['hand','slipper']; G.showRank(2,false); }
else G.startRound1();
window.__g=G; G.HOLES=HOLES;


G.advance=function(T,step=1/60){
  for(
    let i=0;
    i<Math.round(T/step);
    i++
  ){
    G.time+=step;

    if(G.state==='r1'){
      G.r1.update(step);
    }else if(G.state==='r2'){
      G.r2.update(step);
    }
  }

  G.paint.flush(G.time+999);
};


// 루프
let last=now(); const _off=new THREE.Vector3();
function frame(){ requestAnimationFrame(frame); const t=now(); let dt=Math.min(0.05,t-last); last=t; G.time+=dt;
  if(G.state==='rank') G.rankT+=dt;
  
  
if(!G.paused){
  if(G.state==='r1'){
    G.r1.update(dt);
  }else if(G.state==='r2'){
    G.r2.update(dt);
  }
}


  if(G.state==='r2'){ G.ui.miniT-=dt; if(G.ui.miniT<=0){ G.ui.miniT=0.1; G.ui.drawMini(G.r2.miniData()); } }
  if(G.shakeAmt>0.001){ const a=G.shakeAmt*0.02; _off.set(rand(-a,a),rand(-a,a),rand(-a,a)); G.camera.position.add(_off); G.shakeAmt*=Math.exp(-9*dt); }
  G.paint.flush(G.time); G.renderer.render(G.scene,G.camera);
}
frame();
</script>
