<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --ivory:#FBF4E4; --ivory2:#F3E9CF; --ink:#3A2412; --ink2:#6A4526; --edge:#C9A86C;
  --sans:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --serif:"Apple Myungjo","Nanum Myeongjo","Noto Serif KR","Batang",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#EBDFC0;font-family:var(--sans);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none;color:var(--ink)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;margin:0;-webkit-tap-highlight-color:transparent;touch-action:none}

/* 스틱 (2라운드) */
#stick{position:fixed;left:0;top:0;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;background:rgba(58,36,18,.10);border:2px solid rgba(58,36,18,.30);display:none;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--ivory);box-shadow:0 2px 0 var(--edge),0 4px 10px rgba(80,50,20,.3)}

/* 1라운드 UI: 무기는 오른쪽 세로 한 줄, 미끼는 왼쪽 아래 */
#r1ui{position:fixed;inset:0;display:none;pointer-events:none}
#r1ui>*{pointer-events:auto}
#wcol{position:fixed;right:calc(10px + env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
#bcol{position:fixed;left:calc(10px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
@media (max-height:540px){ #wcol{display:grid;grid-template-columns:repeat(2,60px)} }
.slot{width:60px;height:40px;border-radius:12px;background:var(--ivory);color:var(--ink);font-size:13px;font-weight:700;letter-spacing:-.02em;box-shadow:0 2px 0 var(--edge),0 4px 10px rgba(80,50,20,.28);display:grid;place-items:center;position:relative;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.slot.bait{background:var(--ivory2)}
.slot.sel{background:var(--ink);color:var(--ivory);transform:scale(1.06);box-shadow:0 2px 0 var(--ink2),0 4px 10px rgba(80,50,20,.35)}
.slot:active{transform:translateY(2px)}

#quit{position:fixed;top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));padding:12px 18px;border-radius:999px;background:var(--ivory);color:var(--ink);font-size:15px;font-weight:600;line-height:1;box-shadow:0 2px 0 var(--edge),0 4px 12px rgba(80,50,20,.28);opacity:0;transition:opacity .7s;pointer-events:none}
#quit.show{opacity:1;pointer-events:auto}
#confirm{position:fixed;top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));display:none;flex-direction:column;gap:10px;align-items:flex-end}
#confirm.show{display:flex}
#confirm button{padding:13px 20px;border-radius:999px;font-size:16px;font-weight:600;line-height:1;box-shadow:0 2px 0 var(--edge),0 4px 12px rgba(80,50,20,.28)}
#confirm .stop{background:var(--ink);color:var(--ivory)}
#confirm .more{background:var(--ivory);color:var(--ink)}
#confirm button:active{transform:translateY(2px)}

/* 2라운드 UI */
#r2ui{position:fixed;inset:0;display:none;pointer-events:none}
#r2ui>*{pointer-events:auto}
#eggwrap{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);width:58px;height:58px;pointer-events:none}
#egg{position:absolute;left:0;top:0;width:58px;height:58px;border-radius:50%;background:var(--ivory);box-shadow:0 0 0 3px var(--ink) inset,0 3px 0 var(--edge),0 6px 14px rgba(0,0,0,.45);display:none;place-items:center;--p:0;pointer-events:auto}
#egg.show{display:grid}
#egg{font-size:19px;font-weight:700;color:var(--ink)}
#tapfx{position:fixed;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid rgba(251,244,228,.9);opacity:0;pointer-events:none}
#tapfx.go{animation:tapfx .45s ease-out}
@keyframes tapfx{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.8)}}
#egg::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:conic-gradient(var(--ivory) calc(var(--p)*1turn),rgba(58,36,18,.6) 0);-webkit-mask:radial-gradient(circle closest-side,transparent 75%,#000 76%);mask:radial-gradient(circle closest-side,transparent 75%,#000 76%);filter:drop-shadow(0 0 3px rgba(0,0,0,.6))}

/* 2라운드 신호·안내 */
#vig{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 38%,rgba(0,0,0,.8) 100%)}
#hint{position:fixed;left:50%;top:calc(86px + env(safe-area-inset-top));transform:translateX(-50%);max-width:88vw;text-align:center;font-family:var(--serif);font-size:19px;line-height:1.65;color:#F3E9CF;text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 16px rgba(0,0,0,.8);opacity:0;transition:opacity .5s;pointer-events:none;word-break:keep-all}
#hint.show{opacity:1}
#genlabel{position:fixed;left:0;right:0;top:34%;text-align:center;font-family:var(--serif);font-size:46px;letter-spacing:.06em;color:#F3E9CF;text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 20px rgba(0,0,0,.8);opacity:0;transition:opacity .7s;pointer-events:none}
#genlabel.show{opacity:1}
#egg.laid{display:grid;pointer-events:none;background:var(--ivory2)}
#egg.pop{animation:eggpop .55s ease-out}
@keyframes eggpop{0%{transform:scale(.5)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
#egg.ready{box-shadow:0 0 0 3px var(--ink) inset,0 0 0 6px var(--ivory),0 0 18px 4px rgba(251,244,228,.7)}
#egg.danger{animation:eggblink .36s steps(2) infinite}
@keyframes eggblink{50%{opacity:.2}}

/* 전환/결과 */
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
#endtext{position:fixed;inset:0;display:none;place-items:center;font-family:var(--serif);font-size:30px;color:#F3E9CF;letter-spacing:.04em;background:#000}
#rank{position:fixed;inset:0;display:none;background:var(--ivory2);color:var(--ink);font-family:var(--serif)}
#rank .now{position:absolute;left:0;right:0;top:26%;text-align:center;font-size:96px;line-height:1;letter-spacing:-.02em}
#rank .now small{font-size:40px;letter-spacing:.06em;margin-left:6px}
#rank .list{position:absolute;left:0;right:0;top:52%;text-align:center;font-size:20px;line-height:1.9;color:var(--ink2)}
#rank .list div.cur{color:var(--ink)}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="stick"><div id="knob"></div></div>
  <div id="r1ui">
    <div id="wcol"></div>
    <div id="bcol"></div>
    <div id="quit">그만 죽이시겠습니까</div>
    <div id="confirm"><button class="stop">그만 죽이기</button><button class="more">더 죽이기</button></div>
  </div>
  <div id="r2ui">
    <div id="eggwrap"><button id="egg"></button></div>
    <div id="tapfx"></div>
  </div>
  <div id="vig"></div>
  <div id="hint"></div>
  <div id="genlabel"></div>
  <div id="fade"></div>
  <div id="endtext">대가 끊겼습니다</div>
  <div id="rank"><div class="now"></div><div class="list"></div></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ───────── 공통 ─────────
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const TAU=Math.PI*2;
const wrapAng=a=>((a+Math.PI)%TAU+TAU)%TAU-Math.PI;
const angleLerp=(a,b,t)=>a+wrapAng(b-a)*t;
const damp=(a,b,rate,dt)=>lerp(a,b,1-Math.exp(-rate*dt));
const angleDamp=(a,b,rate,dt)=>angleLerp(a,b,1-Math.exp(-rate*dt));
const dist2=(ax,az,bx,bz)=>{const dx=ax-bx,dz=az-bz;return dx*dx+dz*dz;};
const now=()=>performance.now()/1000;

// ───────── 방 ─────────
const ROOM={x1:-2,x2:2,z1:-3,z2:3,h:2.4};
const OBST=[
  {n:'counter',x1:-2,z1:1.2,x2:-1.45,z2:2.45,h:0.86,roach:false,human:false},
  {n:'fridge',x1:-2,z1:0.2,x2:-1.4,z2:0.9,h:1.4,roach:false,human:false},
  {n:'bed',x1:0.9,z1:-2.9,x2:2,z2:-0.9,h:0.45,roach:false,human:false},
  {n:'desk',x1:-1.6,z1:-3,x2:-0.2,z2:-2.4,h:0.72,roach:true,human:false},
  {n:'chair',x1:-1.1,z1:-2.3,x2:-0.7,z2:-1.9,h:0.45,roach:true,human:false},
  {n:'shelf',x1:0.2,z1:-3,x2:0.9,z2:-2.7,h:1.8,roach:false,human:false},
  {n:'trash',x1:0.55,z1:2.45,x2:0.95,z2:2.85,h:0.5,roach:false,human:false},
];
// 숨는 자리: 구멍(hole) 5곳 + 방석 밑 + 책상 밑. 사람은 이 자리들을 차례로 뒤진다.
const HOLES=[
  {n:'fridge',x:-1.52,z:0.55,dx:1,dz:0,hole:true},
  {n:'sink',x:-1.52,z:1.7,dx:1,dz:0,hole:true},
  {n:'drain',x:-1.78,z:2.8,dx:0.93,dz:-0.37,hole:true},
  {n:'crack',x:1.94,z:0.2,dx:-1,dz:0,hole:true},
  {n:'shelf',x:0.55,z:-2.66,dx:0,dz:1,hole:true},
  {n:'cushion',x:0.1,z:-0.4,dx:0,dz:1,r:0.2,cushion:true},           // 방석 밑
  {n:'desk',x:-0.9,z:-2.7,dx:0,dz:1,rect:true,rx:0.66,rz:0.27},      // 책상 밑
];
const HOLE_LIST=HOLES.filter(h=>h.hole);
const CUSHION=HOLES[5];
const HOLE_R=0.17;
const inSpot=(h,x,z)=>h.rect?(Math.abs(x-h.x)<h.rx&&Math.abs(z-h.z)<h.rz):dist2(x,z,h.x,h.z)<(h.r||HOLE_R)*(h.r||HOLE_R);
function spotAt(x,z){ for(const h of HOLES){ if(inSpot(h,x,z)) return h; } return null; }
const ROACH_L=0.13;           // 바퀴 몸길이 (연출상 실물의 3배쯤 — 폰에서 손가락으로 잡히는 크기)
const LAMP_POS=new THREE.Vector3(-0.55,1.08,-2.72);
const SWITCH_STAND={x:0.2,z:2.55};
const BEDSIDE={x:0.55,z:-1.55};

function inObst(o,x,z,m=0){return x>o.x1-m&&x<o.x2+m&&z>o.z1-m&&z<o.z2+m;}
// r를 주면 그 반경 안의 둥근 자리(구멍·방석)만, 안 주면 그 좌표가 속한 자리(책상 밑 포함)
function nearHole(x,z,r){ if(r===undefined) return spotAt(x,z); let best=null,bd=1e9; for(const h of HOLES){ if(h.rect) continue; const d=dist2(x,z,h.x,h.z); if(d<r*r&&d<bd){bd=d;best=h;} } return best; }
// 바퀴 이동 충돌: 가구 AABB(roach=false) + 벽. 구멍 반경 안이면 통과.
function roachMove(x,z,nx,nz){
  const m=0.025;
  const ok=(px,pz)=>{
    if(px<ROOM.x1+m||px>ROOM.x2-m||pz<ROOM.z1+m||pz>ROOM.z2-m) return false;
    if(nearHole(px,pz,HOLE_R)) return true;
    for(const o of OBST){ if(!o.roach&&inObst(o,px,pz,0.01)) return false; }
    return true;
  };
  if(ok(nx,nz)) return [nx,nz];
  if(ok(nx,z)) return [nx,z];
  if(ok(x,nz)) return [x,nz];
  return [x,z];
}

// ───────── 소리 ─────────
class AudioFX{
  constructor(){this.ctx=null;this.loops={};}
  ensure(){
    if(!this.ctx){
      const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
      this.ctx=new C();
      this.master=this.ctx.createGain(); this.master.gain.value=0.85;
      this.comp=this.ctx.createDynamicsCompressor(); this.comp.threshold.value=-14; this.comp.ratio.value=5; this.comp.attack.value=0.002; this.comp.release.value=0.12;
      this.master.connect(this.comp); this.comp.connect(this.ctx.destination);
      const len=this.ctx.sampleRate*2, buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      this.noiseBuf=buf;
    }
    if(this.ctx.state==='suspended') this.ctx.resume();
  }
  get t(){return this.ctx?this.ctx.currentTime:0;}
  env(g,t,att,dur,peak){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002),t+att); g.gain.exponentialRampToValueAtTime(0.0001,t+att+dur); }
  noise({t=0,dur=0.1,gain=0.5,att=0.002,type='bandpass',freq=2000,q=1,freqEnd=null,rate=1,pan=0,trem=0}={}){
    if(!this.ctx) return; const c=this.ctx, t0=c.currentTime+t;
    const s=c.createBufferSource(); s.buffer=this.noiseBuf; s.loop=true; s.playbackRate.value=rate;
    s.start(t0,Math.random()*1.5);
    const f=c.createBiquadFilter(); f.type=type; f.frequency.setValueAtTime(freq,t0); f.Q.value=q;
    if(freqEnd) f.frequency.exponentialRampToValueAtTime(Math.max(20,freqEnd),t0+att+dur);
    const g=c.createGain(); this.env(g,t0,att,dur,gain);
    let node=g;
    if(trem>0){ const tg=c.createGain(); const n=Math.floor((att+dur)*trem*2)+2; const arr=new Float32Array(n); for(let i=0;i<n;i++) arr[i]=0.35+0.65*(i%2); tg.gain.setValueCurveAtTime(arr,t0,att+dur+0.01); g.connect(tg); node=tg; }
    const p=c.createStereoPanner(); p.pan.value=clamp(pan,-1,1);
    s.connect(f); f.connect(g); node.connect(p); p.connect(this.master);
    s.stop(t0+att+dur+0.05);
  }
  tone({t=0,dur=0.1,gain=0.3,att=0.002,freq=200,freqEnd=null,type='sine',pan=0}={}){
    if(!this.ctx) return; const c=this.ctx, t0=c.currentTime+t;
    const o=c.createOscillator(); o.type=type; o.frequency.setValueAtTime(freq,t0);
    if(freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(20,freqEnd),t0+att+dur);
    const g=c.createGain(); this.env(g,t0,att,dur,gain);
    const p=c.createStereoPanner(); p.pan.value=clamp(pan,-1,1);
    o.connect(g); g.connect(p); p.connect(this.master); o.start(t0); o.stop(t0+att+dur+0.05);
  }
  loop(name,make){ if(!this.ctx||this.loops[name]) return; const c=this.ctx; const g=c.createGain(); g.gain.setValueAtTime(0.0001,c.currentTime); g.connect(this.master); const nodes=make(c,g); this.loops[name]={g,nodes}; g.gain.exponentialRampToValueAtTime(1,c.currentTime+0.06); }
  stopLoop(name){ const L=this.loops[name]; if(!L) return; const c=this.ctx; L.g.gain.cancelScheduledValues(c.currentTime); L.g.gain.setValueAtTime(L.g.gain.value||0.5,c.currentTime); L.g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.12); setTimeout(()=>{L.nodes.forEach(n=>{try{n.stop();}catch(e){}});},200); delete this.loops[name]; }
  setLoopGain(name,v){ const L=this.loops[name]; if(!L) return; L.g.gain.setTargetAtTime(Math.max(0.0001,v),this.ctx.currentTime,0.05); }

  // ── 1라운드: 파작·뿌직·아삭·바삭 ──
  kill(weapon,combo=0,mult=1,delay=0,pan=0){
    if(!this.ctx) return;
    const p=1+Math.min(combo,14)*0.045, g=mult*(0.75+Math.min(combo,14)*0.03);
    const muffle=weapon==='tissue'?0.45:1;
    this.tone({t:delay,dur:0.08,gain:0.55*g,freq:130*p,freqEnd:42,pan});
    const n=4+Math.floor(Math.random()*4);
    for(let i=0;i<n;i++) this.noise({t:delay+i*(0.006+Math.random()*0.012),dur:0.018+Math.random()*0.02,gain:0.55*g*muffle,freq:(2600+Math.random()*2600)*p,q:1.3,rate:0.9+Math.random()*0.5,pan});
    this.noise({t:delay,dur:0.07,gain:0.6*g*muffle,freq:1900*p,q:0.8,freqEnd:800,pan});
    this.noise({t:delay+0.012,dur:0.17,gain:0.5*g,freq:720*p,q:1.6,freqEnd:200,type:'lowpass',pan});
    switch(weapon){
      case 'slipper': this.noise({t:delay,dur:0.045,gain:0.7*g,freq:700,q:0.6,freqEnd:250,pan}); break;
      case 'pan': for(const f of [1240,2870,4300]) this.tone({t:delay,dur:0.32,gain:0.09*g,freq:f*(1+Math.random()*0.01),type:'sine',pan}); this.noise({t:delay,dur:0.03,gain:0.6*g,freq:3200,q:0.5,pan}); this.noise({t:delay,dur:0.09,gain:0.6*g,freq:800,q:1,freqEnd:300,pan}); break;
      case 'book': this.noise({t:delay,dur:0.14,gain:0.9*g,freq:260,q:0.7,type:'lowpass',freqEnd:120,pan}); break;
      case 'tissue': this.noise({t:delay,dur:0.22,gain:0.6*g,freq:420,q:1.2,type:'lowpass',freqEnd:160,pan}); break;
      case 'hand': this.noise({t:delay,dur:0.028,gain:0.8*g,freq:1500,q:0.5,pan}); this.noise({t:delay,dur:0.06,gain:0.6*g,freq:500,q:0.8,freqEnd:200,pan}); break;
      case 'flame': for(let i=0;i<5;i++) this.noise({t:delay+0.03*i,dur:0.02,gain:0.3*g,freq:5000+Math.random()*3000,q:2,pan}); break;
      case 'vacuum': this.noise({t:delay,dur:0.14,gain:0.5*g,freq:400,q:1.5,freqEnd:2800,pan}); break;
      case 'stomp': this.noise({t:delay,dur:0.09,gain:0.9*g,freq:300,q:0.7,type:'lowpass',freqEnd:100,pan}); break;
    }
  }
  miss(weapon,pan=0){
    if(!this.ctx) return;
    switch(weapon){
      case 'hand': this.noise({dur:0.03,gain:0.6,freq:1400,q:0.5,pan}); this.tone({dur:0.06,gain:0.25,freq:110,freqEnd:50,pan}); break;
      case 'slipper': this.noise({dur:0.05,gain:0.7,freq:650,q:0.6,freqEnd:220,pan}); this.tone({dur:0.07,gain:0.3,freq:120,freqEnd:45,pan}); break;
      case 'pan': for(const f of [1240,2870,4300]) this.tone({dur:0.5,gain:0.14,freq:f,pan}); this.noise({dur:0.03,gain:0.6,freq:3400,q:0.5,pan}); this.tone({dur:0.09,gain:0.35,freq:130,freqEnd:45,pan}); break;
      case 'book': this.noise({dur:0.16,gain:0.95,freq:240,q:0.7,type:'lowpass',freqEnd:100,pan}); this.tone({dur:0.1,gain:0.4,freq:100,freqEnd:40,pan}); break;
      case 'tissue': this.noise({dur:0.14,gain:0.4,freq:380,q:1,type:'lowpass',freqEnd:150,pan}); break;
    }
  }
  spawnBait(){ if(!this.ctx) return; this.noise({dur:0.08,gain:0.3,freq:900,q:0.8,freqEnd:300}); }
  startSpray(){ this.loop('spray',(c,g)=>{ const s=c.createBufferSource(); s.buffer=this.noiseBuf; s.loop=true; const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=2600; const f2=c.createBiquadFilter(); f2.type='peaking'; f2.frequency.value=5000; f2.gain.value=6; const gg=c.createGain(); gg.gain.value=0.35; s.connect(f); f.connect(f2); f2.connect(gg); gg.connect(g); s.start(); return [s]; }); }

function texFloor(){
  const c=document.createElement('canvas'); c.width=c.height=1024; const g=c.getContext('2d');
  g.fillStyle='#E2AC46'; g.fillRect(0,0,1024,1024);
  // 장판 목무늬 (1.2m 타일)
  const plank=1024/4;
  for(let p=0;p<4;p++){
    const x0=p*plank; g.fillStyle=`hsl(${36+rand(-2,2)},${64+rand(-4,4)}%,${55+rand(-1.5,1.5)}%)`; g.fillRect(x0,0,plank,1024);
    for(let i=0;i<70;i++){ g.strokeStyle=`hsla(30,55%,${30+rand(20)}%,${rand(0.05,0.14)})`; g.lineWidth=rand(0.6,2.2); g.beginPath(); const y=rand(1024); g.moveTo(x0+rand(-20,20),y); for(let k=1;k<=6;k++) g.lineTo(x0+k*plank/6+rand(-14,14),y+rand(-40,40)); g.stroke(); }
    g.fillStyle='rgba(120,70,20,0.35)'; g.fillRect(x0,0,2,1024); g.fillStyle='rgba(255,240,200,0.25)'; g.fillRect(x0+2,0,2,1024);
  }
  const id=g.getImageData(0,0,1024,1024), d=id.data; for(let i=0;i<d.length;i+=4){ const n=rand(-10,10); d[i]+=n; d[i+1]+=n; d[i+2]+=n; } g.putImageData(id,0,0);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(4/1.2,6/1.2); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
function texWall(){
  const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
  g.fillStyle='#F4EBD6'; g.fillRect(0,0,256,256);
  g.fillStyle='rgba(200,170,120,0.35)'; for(let y=0;y<256;y+=32) for(let x=0;x<256;x+=32){ g.beginPath(); g.arc(x+16+((y/32)%2)*8,y+16,2,0,TAU); g.fill(); }
  const id=g.getImageData(0,0,256,256), d=id.data; for(let i=0;i<d.length;i+=4){ const n=rand(-6,6); d[i]+=n; d[i+1]+=n; d[i+2]+=n; } g.putImageData(id,0,0);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(8,4); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function texTile(){

}

// 공유 지오메트리 (바퀴마다 새로 만들지 않음)
const RG=(()=>{
  const teardrop=()=>{ // 단위 구를 앞이 넓고 꼬리가 좁은 납작한 물방울꼴로
    const geo=new THREE.SphereGeometry(1,20,14); const p=geo.attributes.position;
    for(let i=0;i<p.count;i++){ const x=p.getX(i), y=p.getY(i), z=p.getZ(i); const t=(z+1)/2; const w=0.42+0.58*Math.pow(t,0.55), h=0.55+0.45*Math.pow(t,0.6); p.setXYZ(i,x*w,y*h,z); }
    geo.computeVertexNormals(); return geo;
  };
  return {
    body:teardrop(), sph:new THREE.SphereGeometry(1,14,10), head:new THREE.SphereGeometry(1,10,8),
    seam:new THREE.BoxGeometry(0.012,0.01,0.62), cerc:new THREE.CylinderGeometry(0.012,0.004,0.14,5),
    ant:new THREE.CylinderGeometry(0.0065,0.0028,0.38,5),
    fem:{}, tib:{}
  };
})();
const LEG_DEF=[ // z위치, 벌어지는 각(앞쪽=0 → 옆=π/2 → 뒤), 넓적다리, 종아리, 굵기
  {z:0.30, yaw:0.85, fl:0.28, tl:0.31, w:0.85},
  {z:0.06, yaw:1.62, fl:0.34, tl:0.41, w:1.0},
  {z:-0.20,yaw:2.40, fl:0.44, tl:0.57, w:1.15},
];
const HIP_Y=0.055, LEG_ELEV=0.55;
for(let i=0;i<3;i++){ const d=LEG_DEF[i]; RG.fem[i]=new THREE.CylinderGeometry(0.017*d.w,0.011*d.w,d.fl,6); RG.tib[i]=new THREE.CylinderGeometry(0.0085*d.w,0.0035*d.w,d.tl,6); const hK=HIP_Y+d.fl*Math.sin(LEG_ELEV); d.knee=-(LEG_ELEV+Math.asin(Math.min(0.98,hK/d.tl))); }
function makeRoach(){
  const g=new THREE.Group(); const L=ROACH_L;
  const parts={legs:[],ants:[]};
  const mk=(geo,mat,sx,sy,sz,x,y,z,cast=true)=>{ const m=new THREE.Mesh(geo,mat); m.scale.set(sx,sy,sz); m.position.set(x,y,z); m.castShadow=cast; m.receiveShadow=false; g.add(m); return m; };
  // 배(아래) + 날개 등판(위, 조금 더 넓고 김) + 봉합선
  parts.abd=mk(RG.body,MAT.roachBody,0.165,0.075,0.42,0,0.075,-0.10);
  parts.wing=mk(RG.body,MAT.roachWing,0.185,0.048,0.46,0,0.108,-0.09);
  mk(RG.seam,MAT.roachSeam,1,1,1,0,0.15,-0.14,false);
  // 전흉배판: 연한 테두리판 위에 진한 판
  mk(RG.sph,MAT.roachRim,0.195,0.028,0.155,0,0.10,0.33);
  mk(RG.sph,MAT.roachPro,0.172,0.05,0.137,0,0.112,0.33);
  // 머리: 판 아래 앞쪽으로 살짝만
  mk(RG.head,MAT.roachPro,0.062,0.045,0.055,0,0.052,0.455,false);
  // 꼬리돌기
  for(const s of [1,-1]){ const c=mk(RG.cerc,MAT.roachLeg,1,1,1,s*0.04,0.06,-0.55,false); c.rotation.set(-1.35,0,-s*0.35); }
  // 더듬이: 앞으로 길게, 살짝 위로
  for(const s of [1,-1]){ const base=new THREE.Group(); base.position.set(s*0.035,0.09,0.5); base.rotation.order='YXZ'; base.rotation.set(1.25,s*0.42,0); g.add(base); let parent=base; const segs=[]; for(let i=0;i<3;i++){ const seg=new THREE.Group(); const m=new THREE.Mesh(RG.ant,MAT.roachLeg); m.position.y=0.19; m.scale.set(1-i*0.25,1,1-i*0.25); m.castShadow=false; seg.add(m); seg.position.y=i?0.38:0; seg.rotation.x=-0.1; parent.add(seg); parent=seg; segs.push(seg);} parts.ants.push({base,segs,s}); }
  // 다리 6개: 좌우 거울 대칭, 앞다리는 앞으로 뒷다리는 뒤로
  for(const s of [1,-1]) LEG_DEF.forEach((d,i)=>{ const hip=new THREE.Group(); hip.position.set(s*0.13,HIP_Y,d.z); g.add(hip); const fem=new THREE.Group(); hip.add(fem); const fm=new THREE.Mesh(RG.fem[i],MAT.roachLeg); fm.rotation.z=-Math.PI/2; fm.position.x=d.fl/2; fm.castShadow=false; fem.add(fm); const knee=new THREE.Group(); knee.position.x=d.fl; fem.add(knee); const tm=new THREE.Mesh(RG.tib[i],MAT.roachLeg); tm.rotation.z=-Math.PI/2; tm.position.x=d.tl/2; tm.castShadow=false; knee.add(tm); parts.legs.push({hip,fem,knee,s,i,d}); });
  g.scale.setScalar(L);
  const st={phase:rand(TAU),antT:rand(TAU),dead:0};
  function pose(speedNorm,dt,dead=0){
    st.phase+=dt*(6+speedNorm*26); st.antT+=dt*4;
    for(const lg of parts.legs){ const d=lg.d; const tri=((lg.i+(lg.s>0?0:1))%2===0)?1:-1; const sw=Math.sin(st.phase)*tri; const amp=0.10+0.32*speedNorm;
      const yw=d.yaw-sw*amp*(1-dead)+dead*0.25*(lg.i-1); // 죽으면 다리가 옆으로 모임
      lg.hip.rotation.y=lg.s>0?(yw-Math.PI/2):(1.5*Math.PI-yw);
      const lift=Math.max(0,sw)*0.45*speedNorm*(1-dead);
      lg.fem.rotation.z=(LEG_ELEV+lift)*(1-dead)+dead*0.12;
      lg.knee.rotation.z=(d.knee-lift*0.2)*(1-dead)-0.35*dead; }
    for(const a of parts.ants){ const w=Math.sin(st.antT*1.7+a.s)*0.22; a.base.rotation.set(1.25+Math.sin(st.antT+a.s*2)*0.12,a.s*(0.42+w),0); a.segs.forEach((sg,i)=>{ sg.rotation.x=-0.1+Math.sin(st.antT*2.3+i+a.s)*0.1; }); }
    g.scale.set(L*(1+dead*0.3),L*(1-dead*0.7),L);
  }
  pose(0,0);
  return {g,parts,pose,st};
}

  constructor(scene,cap=360){

    const W=(lx,lz)=>[x+lx*Math.cos(h)+lz*Math.sin(h), z-lx*Math.sin(h)+lz*Math.cos(h)];

    const sh=burnt?0.78:1; // 탄 놈은 쪼그라듦
    const put=(mesh,idx,px,py,pz,rx,ry,rz,sx,sy,sz,color)=>{ d.position.set(px,py,pz); d.rotation.set(rx,ry,rz); d.scale.set(sx,sy,sz); d.updateMatrix(); mesh.setMatrixAt(idx,d.matrix); if(color!==undefined) mesh.setColorAt(idx,this.col.set(color)); };
    // 뒤 조각(배): 뒤로 물러나 비틀림. 뒤집힌 놈은 갈라지지 않고 통째로 뒤집힘
    { const gap=crushed?rand(0.08,0.16)*L:0; const lat=crushed?rand(-0.06,0.06)*L:0; const [px,pz]=W(lat,-0.10*L-gap*0.5); const yaw=h+(crushed?rand(-0.35,0.35):rand(-0.1,0.1));

    // 앞 조각(가슴): 앞으로, 다른 각도로
    { const gap=crushed?rand(0.08,0.16)*L:0; const lat=crushed?rand(-0.08,0.08)*L:0; const [px,pz]=W(lat,0.16*L+gap*0.5); const yaw=h+(crushed?rand(-0.55,0.55):rand(-0.1,0.1));
      put(this.pieces,i*2+1,px,belly?0.035*L:0.018*L,pz,rand(-0.1,0.1),yaw,belly?Math.PI:rand(-0.2,0.2),(crushed?1.05:1)*sh,belly?1.9:0.85*sh,(crushed?0.4:0.5)*sh,bodyCol);

  }

// 1라운드: 한 손가락 = 그 자리 행동(내려치기·뿌리기·미끼), 두 손가락 = 화면 끌기. 마우스: 왼쪽 = 행동, 오른쪽 끌기 = 화면 이동.
// 2라운드: 손가락 댄 자리에 스틱.
class Input{
  constructor(canvas){
    this.canvas=canvas; this.keys=new Set(); this.pointers=new Map();
    this.stick={active:false,id:null,ox:0,oy:0,x:0,y:0,vx:0,vy:0};
    this.mouse={x:innerWidth/2,y:innerHeight/2,live:false}; this.lastType='touch'; this.look={dx:0,dy:0}; this.lookId=null; this.lookOn=false;
    this.mode='r1'; this.onPress=null; this.onDrag=null; this.onRelease=null; this.onCancel=null; this.onPan=null; this.onAny=null; this.onKey=null;
    this.dashReq=false; this.eggHold=false;

    window.addEventListener('pointermove',e=>this.move(e));
    window.addEventListener('pointerup',e=>this.up(e)); window.addEventListener('pointercancel',e=>this.up(e));

    canvas.addEventListener('contextmenu',e=>e.preventDefault());
    window.addEventListener('blur',()=>{ this.keys.clear(); this.reset(); });
  }
  down(e){

    const p={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,type:this.lastType,role:'none',stick:false,t0:performance.now()};
    if(this.mode==='r1'){

      else { let act=null,pan=0; for(const q of this.pointers.values()){ if(q.role==='act') act=q; if(q.role==='pan') pan++; }
        if(act){ act.role='pan'; p.role='pan'; this.onCancel&&this.onCancel(); } else if(pan) p.role='pan'; else p.role='act'; }

class Splatter{
  constructor(scene,paint){
    this.n=320; this.paint=paint; const geo=new THREE.SphereGeometry(1,6,5);
    this.mesh=new THREE.InstancedMesh(geo,M.gloss(0x5a3416,{roughness:0.3}),this.n); this.mesh.castShadow=false; this.mesh.frustumCulled=false; scene.add(this.mesh);

    this.dummy=new THREE.Object3D(); this.next=0; this.color=new THREE.Color(); this.L=0; this.hideAll();
  }
  hideAll(){ for(let i=0;i<this.n;i++){ this.dummy.position.set(0,-10,0); this.dummy.scale.setScalar(0.0001); this.dummy.updateMatrix(); this.mesh.setMatrixAt(i,this.dummy.matrix); } this.mesh.instanceMatrix.needsUpdate=true; }
  setLevel(L){ this.L=L; const h=lerp(74,62,L)/360, s=lerp(0.55,0.45,L), l=lerp(0.34,0.22,L); this.mesh.material.color.setHSL(h,s,l); }
  burst(x,z,dx,dz,count,power=1){
    const base=Math.atan2(dz,dx);
    for(let i=0;i<count;i++){ const q=this.p[this.next]; this.next=(this.next+1)%this.n; const a=base+rand(-0.9,0.9), sp=rand(0.3,1.5)*power; q.on=true; q.x=x; q.z=z; q.y=0.02; q.vx=Math.cos(a)*sp; q.vz=Math.sin(a)*sp; q.vy=rand(0.5,1.8)*power; q.r=rand(0.004,0.012); q.yel=Math.random()<0.25; }
  }
  update(dt){
    let any=false;
    for(let i=0;i<this.n;i++){ const q=this.p[i]; if(!q.on) continue; any=true;
      q.vy-=9.8*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.z+=q.vz*dt;
      if(q.y<=0){ q.on=false; if(q.x>ROOM.x1&&q.x<ROOM.x2&&q.z>ROOM.z1&&q.z<ROOM.z2) this.paint.drop(q.x,q.z,q.r*1.6,this.L,q.yel); this.dummy.position.set(0,-10,0); this.dummy.scale.setScalar(0.0001); }

      this.dummy.updateMatrix(); this.mesh.setMatrixAt(i,this.dummy.matrix);
    }
    if(any) this.mesh.instanceMatrix.needsUpdate=true;
  }
}

// ───────── 뿌리기/불꽃/흡입 입자 ─────────
class Puffs{
  constructor(scene){
    this.n=180; const geo=new THREE.SphereGeometry(1,8,6);
    this.mat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.85,depthWrite:false});
    this.mesh=new THREE.InstancedMesh(geo,this.mat,this.n); this.mesh.frustumCulled=false; scene.add(this.mesh);
    this.p=[]; for(let i=0;i<this.n;i++) this.p.push({on:false,life:0,x:0,y:0,z:0,vx:0,vy:0,vz:0,r:0.01,kind:'spray'});
    this.dummy=new THREE.Object3D(); this.next=0; this.col=new THREE.Color(); this.mesh.instanceColor=null;

    this.clear();
  }
  clear(){ for(const q of this.p) q.on=false; for(let i=0;i<this.n;i++){ this.dummy.position.set(0,-10,0); this.dummy.scale.setScalar(0.0001); this.dummy.updateMatrix(); this.mesh.setMatrixAt(i,this.dummy.matrix);} this.mesh.instanceMatrix.needsUpdate=true; }
  emit(kind,x,y,z,dx,dz,n=3,spd=1.6){
    const base=Math.atan2(dz,dx);
    for(let i=0;i<n;i++){ const q=this.p[this.next]; this.next=(this.next+1)%this.n; const a=base+rand(-0.3,0.3), s=rand(0.5,1)*spd; q.on=true; q.kind=kind; q.x=x; q.y=y; q.z=z; q.vx=Math.cos(a)*s; q.vz=Math.sin(a)*s; q.vy=kind==='flame'?(y>0.3?rand(-2.2,-1.2):rand(0.2,0.6)):(y>0.3?rand(-2.6,-1.4):rand(-0.25,0.05)); q.life=kind==='flame'?(y>0.3?rand(0.45,0.7):rand(0.18,0.35)):(y>0.3?rand(0.7,1.1):rand(0.35,0.7)); q.r=kind==='flame'?rand(0.012,0.03):rand(0.01,0.025); }
  }

      if(q.life<=0||q.y<0){ q.on=false; this.dummy.position.set(0,-10,0); this.dummy.scale.setScalar(0.0001); }
      else { q.x+=q.vx*dt; q.y+=q.vy*dt; q.z+=q.vz*dt; q.vx*=0.94; q.vz*=0.94; const grow=q.kind==='flame'?1+ (0.35-q.life)*1.5:1+dt*2; this.dummy.position.set(q.x,q.y,q.z); this.dummy.scale.setScalar(q.r*grow);

    }

}

// A* 격자 (사람용)
class NavGrid{
  constructor(){ this.cs=0.1; this.nx=40; this.nz=60; this.blk=new Uint8Array(this.nx*this.nz);
    for(let j=0;j<this.nz;j++) for(let i=0;i<this.nx;i++){ const x=ROOM.x1+(i+0.5)*this.cs, z=ROOM.z1+(j+0.5)*this.cs; let b=(x<ROOM.x1+0.24||x>ROOM.x2-0.24||z<ROOM.z1+0.24||z>ROOM.z2-0.24)?1:0; if(!b) for(const o of OBST){ if(!o.human&&inObst(o,x,z,0.24)){ b=1; break; } } this.blk[j*this.nx+i]=b; } }
  cell(x,z){ return [clamp(Math.floor((x-ROOM.x1)/this.cs),0,this.nx-1),clamp(Math.floor((z-ROOM.z1)/this.cs),0,this.nz-1)]; }
  free(i,j){ return i>=0&&j>=0&&i<this.nx&&j<this.nz&&!this.blk[j*this.nx+i]; }
  nearestFree(i,j){ if(this.free(i,j)) return [i,j]; for(let r=1;r<8;r++) for(let dj=-r;dj<=r;dj++) for(let di=-r;di<=r;di++){ if(this.free(i+di,j+dj)) return [i+di,j+dj]; } return [i,j]; }
  path(x0,z0,x1,z1){
    let [si,sj]=this.nearestFree(...this.cell(x0,z0)); let [gi,gj]=this.nearestFree(...this.cell(x1,z1));
    const N=this.nx*this.nz, g=new Float32Array(N).fill(1e9), f=new Float32Array(N).fill(1e9), from=new Int32Array(N).fill(-1), closed=new Uint8Array(N);
    const h=(i,j)=>Math.hypot(i-gi,j-gj); const s=sj*this.nx+si, goal=gj*this.nx+gi; g[s]=0; f[s]=h(si,sj);
    const open=[s];
    while(open.length){ let bi=0; for(let k=1;k<open.length;k++) if(f[open[k]]<f[open[bi]]) bi=k; const c=open.splice(bi,1)[0]; if(c===goal) break; closed[c]=1; const ci=c%this.nx, cj=(c/this.nx)|0;
      for(let dj=-1;dj<=1;dj++) for(let di=-1;di<=1;di++){ if(!di&&!dj) continue; const ni=ci+di, nj=cj+dj; if(!this.free(ni,nj)) continue; if(di&&dj&&(!this.free(ci+di,cj)||!this.free(ci,cj+dj))) continue; const n=nj*this.nx+ni; if(closed[n]) continue; const ng=g[c]+Math.hypot(di,dj); if(ng<g[n]){ g[n]=ng; f[n]=ng+h(ni,nj); from[n]=c; if(!open.includes(n)) open.push(n); } } }
    if(from[goal]<0&&goal!==s) return [[x1,z1]];
    const out=[]; let c=goal; while(c>=0&&c!==s){ out.push([ROOM.x1+(c%this.nx+0.5)*this.cs,ROOM.z1+((c/this.nx|0)+0.5)*this.cs]); c=from[c]; } out.reverse();
    // 직선화
    const sm=[]; let cur=[x0,z0]; let k=0; while(k<out.length){ let far=k; for(let m=out.length-1;m>k;m--){ if(this.clear(cur[0],cur[1],out[m][0],out[m][1])){ far=m; break; } } sm.push(out[far]); cur=out[far]; k=far+1; }
    if(sm.length) sm[sm.length-1]=[x1,z1]; else sm.push([x1,z1]); return sm;
  }
  clear(x0,z0,x1,z1){ const n=Math.ceil(Math.hypot(x1-x0,z1-z0)/0.05); for(let k=1;k<n;k++){ const t=k/n; const [i,j]=this.cell(lerp(x0,x1,t),lerp(z0,z1,t)); if(!this.free(i,j)) return false; } return true; }
}

    const lk=inp.consumeLook(); const [lx,ly]=inp.lookKeys(); let moved=false;
    if(lk.dx||lk.dy){ this.camYaw-=lk.dx*0.0065; this.camPitch=clamp(this.camPitch-lk.dy*0.0055,-0.3,1.25); moved=true; }
    if(lx||ly){ this.camYaw-=lx*1.9*dt; this.camPitch=clamp(this.camPitch+ly*1.5*dt,-0.3,1.25); moved=true; }
    this.lookIdle=moved||inp.lookOn?0:this.lookIdle+dt;
    const dH=this.distH(); const near=(A.awake||A.state==='sit')&&dH<2.4;
    // 손 안 대고 걷는 중이면 진행 방향을 천천히 따라감 (위를 보고 있거나 사람이 가까우면 안 돌림)
    if(this.lookIdle>0.9&&P.spd>0.1&&this.camPitch<0.35&&!near){ const d=wrapAng(P.h-this.camYaw); this.camYaw+=clamp(d*(1-Math.exp(-1.0*dt)),-0.55*dt,0.55*dt); }
    if(this.lookIdle>1.2&&this.camPitch>0.05&&!near&&!(A.state==='strike')) this.camPitch=damp(this.camPitch,0.05,1.2,dt);
    // 올려다보기 보조: 앞쪽 가까이 있는 사람의 얼굴 / 내려오는 무기 쪽으로 고개만
    let tgt=null, w=0;
    if((A.awake||A.state==='sit')&&dH<2.8){ const a=wrapAng(Math.atan2(A.x-P.x,A.z-P.z)-this.camYaw); if(Math.abs(a)<0.8){ H.root.updateWorldMatrix(true,true); H.head.getWorldPosition(this.tmp3); tgt=this.tmp3; w=clamp((2.8-dH)/1.6,0,1)*clamp(1-Math.abs(a)/0.8,0,1); } }
    if(A.state==='strike'&&A.strike&&!A.strike.hit&&this.strikeMesh){ const S=A.strike; const a=wrapAng(Math.atan2(S.x-P.x,S.z-P.z)-this.camYaw); if(Math.hypot(P.x-S.x,P.z-S.z)<A.W.r*2.2&&Math.abs(a)<1.0){ tgt=this.strikeMesh.position; w=Math.max(w,Math.min(1,S.t/0.15)); } }
    w*=clamp((this.lookIdle-0.25)/0.5,0,1);
    this.assistW=damp(this.assistW||0,w,6,dt); if(tgt){ if(!this.lookTgt) this.lookTgt=tgt.clone(); else this.lookTgt.lerp(tgt,1-Math.exp(-8*dt)); }
    this.applyCam(P.x,P.z,this.camYaw,this.camPitch,this.lookTgt?this.assistW:0,this.lookTgt);
  }
  applyCam(x,z,yaw,pitch,w,tgt){ const G=this.G, cam=G.camera; const fx=Math.sin(yaw), fz=Math.cos(yaw);
    let cx=x, cz=z, short=0.37;
    for(let back=0.42;back>=0.05;back-=0.04){ const tx=clamp(x-fx*back,-1.95,1.95), tz=clamp(z-fz*back,-2.95,2.95); let ok=true; for(const o of OBST){ if(!o.roach&&inObst(o,tx,tz,0.02)){ ok=false; break; } } if(ok){ cx=tx; cz=tz; short=0.42-back; break; } }
    const cy=0.15+short*0.6;
    G.camBase.set(cx,cy,cz);
    const reach=0.7-short*1.4; this.tmp.set(x+fx*reach*Math.cos(pitch),Math.max(0,0.13-short*0.45)+reach*Math.sin(pitch)+cy-0.15,z+fz*reach*Math.cos(pitch));
    if(w>0.001&&tgt){ const hd=Math.hypot(tgt.x-cx,tgt.z-cz); this.tmp2.set(cx+fx*hd,tgt.y,cz+fz*hd); this.tmp.lerp(this.tmp2,w); } // 좌우는 그대로, 위로만
    cam.position.copy(G.camBase); cam.up.set(0,1,0); cam.lookAt(this.tmp); cam.updateMatrixWorld();
    G.camRight.set(1,0,0).applyQuaternion(cam.quaternion); G.camRight.y=0; G.camRight.normalize(); G.camFwd.set(fx,0,fz); }
  deathCamera(dt){ const P=this.p, D=this.death; if(D.type==='poison'){ const A=this.ai; const yaw=Math.atan2(A.x-P.x,A.z-P.z); this.camYaw=angleDamp(this.camYaw,yaw,4,dt); const cam=this.G.camera; cam.position.set(P.x,0.06,P.z); this.tmp.set(A.x,1.55,A.z); cam.lookAt(this.tmp); } else if(D.type==='egg'){ this.applyCam(P.x,P.z,this.camYaw,this.camPitch,0,null); } }
  leaveCamera(dt){ const L=this.leaveCam; const cam=this.G.camera; cam.position.set(L.x,0.1,L.z); this.tmp.set(L.x+Math.sin(L.yaw)*1,0.25,L.z+Math.cos(L.yaw)*1); cam.lookAt(this.tmp); }
}
// ───────── UI ─────────
class UI{
  constructor(G){ this.G=G;
    const wcol=document.getElementById('wcol'), bcol=document.getElementById('bcol'); this.slotEls={};
    for(const k of [...SLOT_ORDER,...BAIT_SLOTS]){ const d=document.createElement('div'); d.className='slot'+(BAIT_SLOTS.includes(k)?' bait':''); d.textContent=LABEL[k]; d.addEventListener('pointerdown',e=>{ e.stopPropagation(); e.preventDefault(); SFX.ensure(); G.r1.selectItem(k); }); (BAIT_SLOTS.includes(k)?bcol:wcol).appendChild(d); this.slotEls[k]=d; }
    this.quit=document.getElementById('quit'); this.confirm=document.getElementById('confirm');
    this.quit.addEventListener('pointerdown',e=>{ e.stopPropagation(); SFX.ensure(); this.quit.style.transition='none'; this.quit.classList.remove('show'); setTimeout(()=>{ this.quit.style.transition=''; },50); this.confirm.classList.add('show'); G.state='confirm'; });
    this.confirm.querySelector('.more').addEventListener('pointerdown',e=>{ e.stopPropagation(); this.confirm.classList.remove('show'); G.state='r1'; G.r1.touch(); this.quit.style.transition='none'; this.showQuit(true); setTimeout(()=>{ this.quit.style.transition=''; },50); });
    this.confirm.querySelector('.stop').addEventListener('pointerdown',e=>{ e.stopPropagation(); this.confirm.classList.remove('show'); G.toRound2(); });
    this.tapfx=document.getElementById('tapfx'); G.input.onDashTap=(x,y)=>{ const t=this.tapfx; t.style.left=x+'px'; t.style.top=y+'px'; t.classList.remove('go'); void t.offsetWidth; t.classList.add('go'); };
    this.egg=document.getElementById('egg'); this.egg.textContent='알'; const eDown=e=>{ e.stopPropagation(); e.preventDefault(); SFX.ensure(); G.input.eggHold=true; }; const eUp=()=>{ G.input.eggHold=false; }; this.egg.addEventListener('pointerdown',eDown); this.egg.addEventListener('pointerup',eUp); this.egg.addEventListener('pointercancel',eUp); this.egg.addEventListener('pointerleave',eUp);
    this.rank=document.getElementById('rank'); this.rank.addEventListener('pointerdown',e=>{ e.stopPropagation(); if(G.state==='rank'&&G.rankT>0.8) G.restart(); });
    this.endtext=document.getElementById('endtext'); this.fade=document.getElementById('fade');
  }
  selectSlot(k){ for(const s in this.slotEls) this.slotEls[s].classList.toggle('sel',s===k); }
  showQuit(b){ this.quit.classList.toggle('show',b&&this.G.state==='r1'); }
  // 알 버튼: none(숨김) / show(누를 수 있음, 처음 뜰 때 펄스) / laid(낳음, 링이 차오름)
  eggState(mode){ const e=this.egg; if(e.dataset.mode===mode) return; const was=e.dataset.mode; e.dataset.mode=mode; e.classList.toggle('show',mode==='show'); e.classList.toggle('laid',mode==='laid'); if(mode==='show'&&was!=='show'){ e.classList.remove('pop'); void e.offsetWidth; e.classList.add('pop'); } if(mode!=='laid'){ e.classList.remove('ready','danger'); } if(mode!=='show'&&mode!=='laid') e.style.setProperty('--p','0'); }
  eggProgress(k){ this.egg.style.setProperty('--p',k.toFixed(3)); }
  eggReady(b){ this.egg.classList.toggle('ready',b); }
  eggDanger(b){ this.egg.classList.toggle('danger',b); }
  vignette(b){ document.getElementById('vig').style.opacity=b?'1':'0'; }
  dashCool(b){}
  // 안내 한 줄: 순서대로 하나씩
  hint(text,dur=4.5,delay=0){ this.hq=this.hq||[]; this.hq.push({text,dur,delay}); if(!this.hintBusy) this.hintNext(); }
  hintNext(){ const el=document.getElementById('hint'); const q=this.hq; if(!q||!q.length){ this.hintBusy=false; return; } this.hintBusy=true; const h=q.shift(); this.hintTimer=setTimeout(()=>{ el.textContent=h.text; el.classList.add('show'); this.hintTimer=setTimeout(()=>{ el.classList.remove('show'); this.hintTimer=setTimeout(()=>this.hintNext(),600); },h.dur*1000); },h.delay*1000); }
  hintClear(){ this.hq=[]; clearTimeout(this.hintTimer); this.hintBusy=false; document.getElementById('hint').classList.remove('show'); }
  genLabel(text){ const el=document.getElementById('genlabel'); clearTimeout(this.genTimer); if(!text){ el.classList.remove('show'); return; } el.textContent=text; el.classList.add('show'); this.genTimer=setTimeout(()=>el.classList.remove('show'),2300); }
}

// ───────── 게임 전체 ─────────
const G={time:0,state:'boot',shakeAmt:0};
G.canvas=document.getElementById('gl');

G.renderer.shadowMap.enabled=true; G.renderer.shadowMap.type=THREE.PCFSoftShadowMap; G.renderer.toneMapping=THREE.ACESFilmicToneMapping; G.renderer.toneMappingExposure=1.0; G.renderer.outputColorSpace=THREE.SRGBColorSpace;

G.room=buildRoom(G.scene);
G.corpses=new Corpses(G.scene);
{ const ov=new THREE.Mesh(new THREE.PlaneGeometry(4,6),new THREE.MeshStandardMaterial({map:G.paint.tex,transparent:true,roughness:0.65,metalness:0,depthWrite:false})); ov.rotation.x=-Math.PI/2; ov.position.y=0.002; ov.receiveShadow=true; ov.renderOrder=1; G.scene.add(ov); }
// 조명
G.hemi=new THREE.HemisphereLight(0xfff6e8,0xd9a441,0.9); G.scene.add(G.hemi);
G.sun=new THREE.DirectionalLight(0xffffff,2.4); G.sun.position.set(1.0,7,0.7); G.sun.target.position.set(0,0,0); G.scene.add(G.sun,G.sun.target); G.isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0; G.sun.castShadow=true; G.sun.shadow.mapSize.set(G.isTouch?1536:2048,G.isTouch?1536:2048); Object.assign(G.sun.shadow.camera,{left:-2.6,right:2.6,top:3.6,bottom:-3.6,near:1,far:12}); G.sun.shadow.bias=-0.0004; G.sun.shadow.normalBias=0.015;
G.lamp=new THREE.SpotLight(0xffd98a,0,7,0.8,0.55,1.6); G.lamp.position.copy(LAMP_POS); G.lamp.target.position.set(0.3,0,-1.2); G.scene.add(G.lamp,G.lamp.target); G.lamp.castShadow=true; G.lamp.shadow.mapSize.set(G.isTouch?1024:2048,G.isTouch?1024:2048); G.lamp.shadow.camera.near=0.05; G.lamp.shadow.camera.far=8; G.lamp.shadow.bias=-0.0006; G.lamp.shadow.normalBias=0.01;
G.win=new THREE.DirectionalLight(0x9fb8ff,0); G.win.position.set(5,2.2,-1.9); G.win.target.position.set(0.5,0,-1.9); G.scene.add(G.win,G.win.target);
G.setLighting=function(mode){ const R=G.room; R.ceilGroup.visible=(mode!=='day'); R.ceil.material.emissiveIntensity=mode==='on'?0.55:0.05;
  const set=(h,s,l,w,fl,bulb,glass,bg,expo)=>{ G.hemi.intensity=h; G.sun.intensity=s; G.sun.visible=s>0; G.lamp.intensity=l; G.lamp.visible=l>0; G.win.intensity=w; R.fluor.material.emissiveIntensity=fl; R.fluor.material.color.set(fl>0.5?0xffffff:0xcfcfcf); R.lampBulb.material.emissiveIntensity=bulb; R.glass.material.emissive.set(glass[0]); R.glass.material.emissiveIntensity=glass[1]; R.glass.material.color.set(glass[0]); G.scene.background.set(bg); G.renderer.toneMappingExposure=expo; };
  if(mode==='day'){ set(0.55,1.7,0,0,1.6,0,[0xcfe6f7,0.7],0xEBDFC0,1.0); G.hemi.color.set(0xfff6e8); G.hemi.groundColor.set(0xd9a441); G.sun.color.set(0xffffff); }
  else if(mode==='night'){ set(0.42,0,46,0.75,0.02,1.8,[0x2a4070,0.9],0x05070c,1.12); G.hemi.color.set(0x6f84c0); G.hemi.groundColor.set(0x3a2410); }
  else if(mode==='on'){ set(0.7,1.9,34,0.3,1.6,1.4,[0x1b2a4a,0.5],0x05070c,1.0); G.hemi.color.set(0xf0f4ff); G.hemi.groundColor.set(0xd9a441); G.sun.color.set(0xf4f7ff); }
  else if(mode==='empty'){ set(0.38,0,46,0.85,0.02,1.8,[0x2a4070,1.0],0x05070c,1.12); G.hemi.color.set(0x6f84c0); G.hemi.groundColor.set(0x3a2410); }
};
G.shake=function(a){ G.shakeAmt=Math.max(G.shakeAmt,a); };
G.blackout=function(on,instant=true){ const f=document.getElementById('fade'); f.style.transition=instant?'none':'opacity .6s'; f.style.background='#000'; f.style.opacity=on?'1':'0'; };
G.flash=function(col){ const f=document.getElementById('fade'); f.style.transition='none'; f.style.background=col; f.style.opacity='1'; setTimeout(()=>{ f.style.transition='background .5s'; f.style.background='#000'; },80); };
// 뷰
G.view={w:1.5,h:3.3}; G.ppm=260;
G.resize=function(){ const w=innerWidth,h=innerHeight; G.renderer.setSize(w,h,false); G.renderer.setPixelRatio(Math.min(devicePixelRatio||1,w*h>1.6e6?1.5:2)); G.camera.aspect=w/h; G.ppm=clamp(Math.min(w,h)/1.5,200,340); G.portrait=h>=w; if(G.state==='r1'||G.state==='confirm') G.camera.fov=40; G.camera.updateProjectionMatrix(); const V=h/G.ppm; G.topH=V/(2*Math.tan(G.camera.fov*Math.PI/360)); if(G.portrait){ G.view.h=V; G.view.w=V*w/h; } else { G.view.w=V; G.view.h=V*w/h; } };

const inR1=()=>G.state==='r1'||G.state==='confirm';

  else if(G.state==='r2'){ if(code==='Space'&&down) G.input.dashReq=true; if(code==='KeyE') G.input.eggHold=down; }
};
window.addEventListener('keydown',e=>{ if(e.code==='Tab'&&inR1()) e.preventDefault(); });
