<style>
:root{

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9e0d0;color:var(--ink);font-family:var(--sans);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;border:0;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:none}
#specimenLabRoot{position:fixed;inset:0;overflow:hidden;background:#e9e0d0;contain:layout paint size;touch-action:none}

#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#ui{position:absolute;inset:0;pointer-events:none}
#specimenLabRoot.hide-hud #hint,#specimenLabRoot.hide-hud #partLabel,#specimenLabRoot.hide-hud #toast,#specimenLabRoot.hide-toolbar #toolbar,#specimenLabRoot.hide-actions #side{display:none!important}

.tool[hidden]{display:none!important}
#toolbar{position:absolute;left:50%;bottom:calc(11px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:7px;max-width:calc(100% - 16px);padding:5px;overflow-x:auto;pointer-events:auto;scrollbar-width:none}
#toolbar::-webkit-scrollbar{display:none}
.tool{position:relative;flex:0 0 auto;min-width:64px;height:49px;padding:0 8px;border-radius:14px;background:rgba(248,240,220,.96);box-shadow:0 2px 0 var(--line),0 7px 18px rgba(0,0,0,.25);font-size:11px;font-weight:900;line-height:1.05;display:grid;place-items:center;transition:transform .08s,background .08s,color .08s}
.tool:active{transform:translateY(2px)}.tool.sel{background:var(--ink);color:var(--ivory);transform:translateY(-2px);box-shadow:0 2px 0 #080504,0 7px 20px rgba(0,0,0,.34)}
.tool .key{position:absolute;right:5px;top:4px;font-size:8px;opacity:.45;font-weight:800}
#side{position:absolute;right:calc(10px + env(safe-area-inset-right));bottom:calc(76px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px;align-items:flex-end;pointer-events:auto}
.action{padding:9px 13px;border-radius:999px;background:rgba(248,240,220,.94);box-shadow:0 2px 0 var(--line),0 6px 16px rgba(0,0,0,.22);font-size:11px;font-weight:900;white-space:nowrap}.action:active{transform:translateY(2px)}.action.dark{background:rgba(48,32,23,.95);color:var(--ivory);box-shadow:0 2px 0 #090604,0 6px 16px rgba(0,0,0,.3)}
#hint{position:absolute;left:50%;bottom:calc(75px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(720px,70vw);padding:9px 14px;border-radius:999px;background:rgba(25,17,13,.8);color:var(--ivory);font-size:11px;font-weight:800;text-align:center;line-height:1.35;opacity:0;transition:opacity .18s;pointer-events:none;backdrop-filter:blur(7px)}#hint.show{opacity:1}

#intro{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:rgba(16,11,9,.58);backdrop-filter:blur(6px);pointer-events:auto;transition:opacity .25s}#intro.hide{opacity:0;pointer-events:none}
.card{width:min(570px,94vw);padding:25px 23px 21px;border-radius:25px;background:var(--ivory2);box-shadow:0 4px 0 #9b7648,0 24px 80px rgba(0,0,0,.48);text-align:center}.card h1{margin:0;font-family:var(--serif);font-size:34px;letter-spacing:-.055em}.card p{margin:15px auto 18px;max-width:470px;color:var(--ink2);font-size:13px;line-height:1.75;word-break:keep-all}.card button{padding:13px 22px;border-radius:999px;background:var(--ink);color:var(--ivory);font-weight:900;box-shadow:0 3px 0 #090504}
@media(max-width:720px){.tool{min-width:57px;height:45px;font-size:10px}#hint{max-width:62vw;bottom:calc(70px + env(safe-area-inset-bottom))}#side{bottom:calc(69px + env(safe-area-inset-bottom))}.action{padding:8px 11px;font-size:10px}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=(a,b,v)=>{const t=clamp((v-a)/Math.max(.000001,b-a));return t*t*(3-2*t)};

const TAU=Math.PI*2;
const damp=(a,b,r,dt)=>lerp(a,b,1-Math.exp(-r*dt));
const now=()=>performance.now()/1000;
const v3=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const q4=()=>new THREE.Quaternion();
const rootEl=$('#specimenLabRoot');
const canvas=$('#gl');
const uiEl=$('#ui');
const IS_COARSE=matchMedia('(pointer:coarse)').matches;
const IS_SMALL=IS_COARSE||Math.min(innerWidth,innerHeight)<760;
const FX_BUDGET=IS_SMALL?.58:1;
const Y_AXIS=new THREE.Vector3(0,1,0);
const DAMAGE_COLOR=new THREE.Color(0x28160f);
const TMP={
  a:new THREE.Vector3(),b:new THREE.Vector3(),c:new THREE.Vector3(),d:new THREE.Vector3(),
  q:new THREE.Quaternion(),box:new THREE.Box3(),localBox:new THREE.Box3(),
  color:new THREE.Color(),matrix:new THREE.Matrix4(),dummy:new THREE.Object3D()
};
const EMBEDDED=new URLSearchParams(location.search).get('embed')==='1';
const DEFAULT_OPTIONS={
  showHUD:true,showToolbar:true,showActions:true,showIntro:false,
  enabledTools:['tweezer','pin','camera'],quality:'auto',soundVolume:.8,
  resetOnEnter:false,onChange:null,onExit:null
};
let appOptions={...DEFAULT_OPTIONS};
let started=true,appPaused=false,pageHidden=document.hidden,disposed=false;

const SIDE_NAME={L:'왼쪽',R:'오른쪽'};
const LEG_NAME={front:'앞다리',middle:'가운데다리',rear:'뒷다리'};
const SEG_NAME={coxa:'밑마디',trochanter:'도래마디',femur:'넓적마디',tibia:'종아리마디',tarsus1:'발목 1마디',tarsus2:'발목 2마디',tarsus3:'발목 3마디',claw:'발톱'};
const TOOL_HINT={
  tweezer:'터치 후 드래그로 집어 당긴다. 작은 부위가 먼저 잡히며, 핀 머리를 누르면 핀도 뽑힌다.',
  pin:'고정할 부위를 누른다. 핀 머리를 다시 누르면 뺄 수 있다.',
  camera:'한 손가락 또는 마우스 왼쪽 드래그로 회전하고, 휠이나 두 손가락으로 확대한다.'
};

const geometryCache=new Map();
function sharedGeometry(key,factory){
  if(!geometryCache.has(key)){
    const g=factory();g.userData.shared=true;geometryCache.set(key,g);
  }
  return geometryCache.get(key);
}
function markSharedMaterial(m){m.userData.shared=true;return m}
function cloneWorkingMaterial(m){const q=m.clone();q.userData={...q.userData,shared:false};return q}
function disposeMaterial(m,force=false){
  if(!m||(!force&&m.userData?.shared))return;
  for(const k of ['map','normalMap','roughnessMap','metalnessMap','alphaMap','emissiveMap'])m[k]?.dispose?.();
  m.dispose?.();
}
function disposeObject3D(o,{force=false,remove=true}={}){
  if(!o)return;
  o.traverse?.(q=>{
    if(q.geometry&&(force||!q.geometry.userData?.shared))q.geometry.dispose?.();
    if(Array.isArray(q.material))q.material.forEach(m=>disposeMaterial(m,force));else disposeMaterial(q.material,force);
  });
  if(remove)o.removeFromParent?.();
}
function clearDynamicGroup(group){
  for(const child of [...group.children])disposeObject3D(child);
}

class AudioFX{
  constructor(){this.ctx=null;this.master=null;this.noiseBuf=null;this.volume=DEFAULT_OPTIONS.soundVolume;this.gate={}}
  setVolume(v){this.volume=clamp(Number(v)||0,0,1);if(this.master)this.master.gain.value=this.volume}
  ensure(){
    if(!this.ctx){
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(err){}
      this.ctx=new C();this.master=this.ctx.createGain();this.master.gain.value=this.volume;
      const comp=this.ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.knee.value=6;comp.ratio.value=6;comp.attack.value=.002;comp.release.value=.12;
      const out=this.ctx.createGain();out.gain.value=1.7;this.master.connect(comp);comp.connect(out);out.connect(this.ctx.destination);
      const n=this.ctx.sampleRate*2;this.noiseBuf=this.ctx.createBuffer(1,n,this.ctx.sampleRate);const d=this.noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    }
    if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});
  }
  ready(){return !!this.ctx&&this.ctx.state==='running'}
  // 같은 종류 소리가 너무 촘촘히 겹치지 않게
  allow(key,gap){if(!this.ready())return false;const t=this.ctx.currentTime;if(t-(this.gate[key]??-9)<gap)return false;this.gate[key]=t;return true}
  env(g,t,a,d,p){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,p),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
  noise({delay=0,dur=.08,gain=.25,freq=1800,end=null,q=1,type='bandpass',pan=0,attack=.002}={}){
    if(!this.ctx)return;const c=this.ctx,t=c.currentTime+delay,s=c.createBufferSource();s.buffer=this.noiseBuf;s.loop=true;s.playbackRate.value=rand(.82,1.28);const f=c.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(freq,t);f.Q.value=q;if(end)f.frequency.exponentialRampToValueAtTime(Math.max(30,end),t+dur);const g=c.createGain();this.env(g,t,attack,dur,gain);const p=c.createStereoPanner();p.pan.value=clamp(pan,-1,1);s.connect(f);f.connect(g);g.connect(p);p.connect(this.master);s.start(t,rand(0,1.5));s.stop(t+attack+dur+.04)
  }
  tone({delay=0,dur=.08,gain=.2,freq=180,end=null,type='sine',pan=0,attack=.002}={}){
    if(!this.ctx)return;const c=this.ctx,t=c.currentTime+delay,o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(freq,t);if(end)o.frequency.exponentialRampToValueAtTime(Math.max(20,end),t+dur);const g=c.createGain();this.env(g,t,attack,dur,gain);const p=c.createStereoPanner();p.pan.value=clamp(pan,-1,1);o.connect(g);g.connect(p);p.connect(this.master);o.start(t);o.stop(t+attack+dur+.04)
  }
  // ── 재료 소리 ──
  // 껍질이 잘게 부서지는 소리: 아주 짧은 딸깍을 불규칙하게 흩뿌린다 (바삭·뿌드득)
  crackle({delay=0,dur=.12,n=10,gain=.2,fmin=1800,fmax=6500,pan=0,q=2.2}={}){
    for(let i=0;i<n;i++){const k=Math.pow(Math.random(),.7);this.noise({delay:delay+k*dur,dur:rand(.003,.011),gain:gain*rand(.45,1.15)*(1-k*.45),freq:rand(fmin,fmax),q,pan:pan+rand(-.12,.12)})}
  }
  // 딱·뚝: 단단한 마디가 부러지는 한 방
  snap({delay=0,size=.5,gain=.5,pan=0}={}){
    const f=lerp(4200,1700,size);
    this.noise({delay,dur:.014+size*.012,gain,freq:f,q:.9,pan});
    this.noise({delay:delay+.002,dur:.03+size*.03,gain:gain*.55,freq:f*.45,q:1.4,end:f*.2,pan});
    this.tone({delay,dur:.035+size*.05,gain:gain*.45,freq:lerp(420,170,size),end:lerp(160,55,size),type:'triangle',pan});
  }
  // 찌걱·쩍: 속살과 진물이 딸려 나오는 젖은 소리
  squish({delay=0,size=.5,gain=.35,pan=0}={}){
    this.noise({delay,dur:.08+size*.1,gain,freq:lerp(1300,700,size),end:lerp(380,160,size),q:1.1,type:'lowpass',pan,attack:.006});
    this.noise({delay:delay+.01,dur:.05+size*.05,gain:gain*.6,freq:lerp(900,480,size),q:5,end:lerp(520,260,size),pan});
    const b=1+Math.round(size*3);for(let i=0;i<b;i++)this.tone({delay:delay+.02+i*rand(.025,.05),dur:rand(.018,.035),gain:gain*rand(.18,.34),freq:rand(260,520)*(1.2-size*.4),end:rand(110,190),pan:pan+rand(-.15,.15)});
  }
  thump({delay=0,gain=.4,pan=0}={}){this.tone({delay,dur:.13,gain,freq:125,end:42,pan});this.noise({delay,dur:.05,gain:gain*.4,freq:320,q:.8,type:'lowpass',pan})}
  // ── 행동 소리 ──
  tweezer(grip=.4){this.noise({dur:.012,gain:.2+grip*.12,freq:5200,q:2.6});this.tone({dur:.03,gain:.07,freq:2800,end:1700,type:'square'});this.tone({delay:.008,dur:.16,gain:.025,freq:4100,type:'sine'})}
  grab(part){
    if(!this.ready())return;this.tweezer(.5);
    const soft=part&&(part.role==='abdomen'||part.role==='eye'),small=part&&(part.small||['antenna','palp','cercus','claw'].includes(part.role));
    if(soft)this.squish({delay:.01,size:.15,gain:.14});
    else this.noise({delay:.004,dur:.012,gain:small?.12:.22,freq:small?4200:2600,q:2});
    this.crackle({delay:.01,dur:.05,n:small?2:4,gain:.08,fmin:2600,fmax:6000});
  }
  // 당기는 동안: 긴장이 커질수록 뿌드득이 촘촘해지고, 막이 늘어나는 끼익이 섞인다
  strain(part,k){
    if(!part||k<.12)return;const size=this.partSize(part),gap=lerp(.16,.035,clamp(k))*(1+size*.3);
    if(!this.allow('strain',gap))return;
    this.crackle({dur:.03,n:1+Math.round(k*3),gain:.09+.2*clamp(k),fmin:lerp(3800,1400,size),fmax:lerp(7800,4200,size)});
    if(k>.6&&Math.random()<.35)this.noise({dur:rand(.04,.08),gain:.05+.06*clamp(k-.6,0,1),freq:rand(650,1250),end:rand(900,1700),q:9});
    if(part.role==='abdomen'&&k>.45&&Math.random()<.3)this.squish({size:.2,gain:.08});
  }
  partSize(part){
    if(!part)return .5;const r=part.role;
    if(r==='core')return 1;if(r==='abdomen')return .85;if(r==='wing')return .6;if(r==='jaw')return .45;if(r==='eye')return .4;
    if(r==='leg')return part.small?.2:clamp((part.radius||.05)/.085,.25,.8);return .12;
  }
  // 부위마다 뜯어지는 소리가 다르다
  detach(part,force=.5){
    if(!this.ready())return;const r=part?.role||'leg',size=this.partSize(part),f=clamp(force),pan=rand(-.25,.25);
    if(r==='eye'){
      // 뽁 — 둥근 눈알이 소켓에서 빠지는 젖은 팝
      this.tone({dur:.07,gain:.34,freq:640,end:150,pan});this.noise({dur:.018,gain:.3,freq:1500,q:5,pan});
      this.crackle({dur:.04,n:3,gain:.12,fmin:2400,fmax:5200,pan});this.squish({delay:.03,size:.55,gain:.36,pan});
    }else if(r==='wing'){
      // 찌이익 — 날개막이 결을 따라 찢어진다
      const d=.22+f*.12;this.crackle({dur:d,n:26+Math.round(f*16),gain:.3,fmin:1400,fmax:5200,q:1.8,pan});
      this.noise({dur:d,gain:.28,freq:3400,end:1000,q:1.6,pan,attack:.02});this.snap({delay:d*.92,size:.25,gain:.35,pan});
    }else if(r==='core'||r==='abdomen'){
      // 뿌지직 — 몸통 껍질이 갈라지고 속이 쏟아진다
      this.crackle({dur:.14+f*.08,n:16+Math.round(f*12),gain:.26,fmin:900,fmax:4600,pan});
      this.snap({delay:.02,size:.95,gain:.5,pan});this.thump({delay:.03,gain:.34+f*.2,pan});
      this.squish({delay:.06,size:1,gain:.5,pan});this.squish({delay:.2,size:.7,gain:.24,pan:-pan});
    }else if(r==='jaw'){
      this.snap({size:.55,gain:.45,pan});this.crackle({dur:.05,n:5,gain:.14,pan});this.squish({delay:.03,size:.35,gain:.22,pan});
    }else{

      this.snap({size,gain:.3+size*.3+f*.12,pan});this.crackle({delay:.004,dur:.04+size*.05,n:3+Math.round(size*6),gain:.12+size*.08,pan});

    }
  }
  // 뿍 — 핀이 껍질을 뚫고 판에 박힌다
  pin(){
    if(!this.ready())return;this.snap({size:.45,gain:.42});this.crackle({dur:.035,n:4,gain:.13});

  }
  // 쪽 — 핀을 뽑을 때 진물이 달라붙는다
  unpin(){
    if(!this.ready())return;this.noise({dur:.045,gain:.16,freq:5200,q:1.4,type:'highpass'});

  }
  // 톡 — 진물 방울이 판에 떨어진다
  drip(size=.3){if(!this.allow('drip',.05))return;const p=rand(-.4,.4);this.tone({dur:.022,gain:.05+size*.06,freq:rand(1200,1800),end:rand(500,750),pan:p});this.noise({dur:.025,gain:.04,freq:700,type:'lowpass',pan:p})}

  land(part,v=1){if(!this.allow('land',.035))return;const size=this.partSize(part);this.noise({dur:.012+size*.015,gain:clamp(.05+v*.08+size*.1,0,.3),freq:lerp(4200,1500,size),q:1.3});if(size>.5)this.tone({dur:.05,gain:.1,freq:160,end:70,type:'triangle'})}

function pronotumGeometry(){
  const N=IS_SMALL?44:60,K=IS_SMALL?10:13,W=.78,LF=.66,LR=.43,P=3.3;
  const pos=[],col=[],idx=[],c=new THREE.Color();
  const cCenter=new THREE.Color(0x5a2710),cMid=new THREE.Color(0x7a3814),cBlot=new THREE.Color(0x2a0f05),cRim=new THREE.Color(0xbf8541),cUnder=new THREE.Color(0x6a4024);

  const tint=(u,x,z,under)=>{

    const bl=Math.exp(-(((Math.abs(x)-.17)/.12)**2+((z-.02)/.24)**2));c.lerp(cBlot,bl*.8);

  };

function abdomenGeometry(W,HD,HV,L){
  const M=IS_SMALL?24:34,R=IS_SMALL?8:11;
  const pos=[],col=[],idx=[],c=new THREE.Color();
  const cTop=new THREE.Color(0x5e2a11),cEdge=new THREE.Color(0x2c1006),cSide=new THREE.Color(0x9a6a3c),cBelly=new THREE.Color(0x87522a),cMem=new THREE.Color(0xb08a5e);
  for(let r=0;r<=R;r++){
    const v=r/R,z=L*(.5-v);
    const tuck=lerp(.88,1,smoothstep(0,.42,v)),lip=1+.045*smoothstep(.76,.95,v)-.05*smoothstep(.97,1,v);
    const sx=tuck*lip,syT=tuck*(lip-.22*smoothstep(.94,1,v)),syB=tuck*(1-.1*smoothstep(.95,1,v));
    for(let j=0;j<M;j++){
      const th=j/M*TAU,co=Math.cos(th),si=Math.sin(th);
      const x=W*sx*Math.sign(co)*Math.pow(Math.abs(co),2/2.2);
      const y=si>=0?HD*syT*Math.pow(si,2/2.0):-HV*syB*Math.pow(-si,2/3.4);

    }
  }
  for(let r=0;r<R;r++)for(let j=0;j<M;j++){const a=r*M+j,b=r*M+(j+1)%M,cc=(r+1)*M+(j+1)%M,d=(r+1)*M+j;idx.push(a,d,cc,a,cc,b)}
  const fc=pos.length/3;pos.push(0,(HD-HV)*.3,L*.5);col.push(cMem.r,cMem.g,cMem.b);
  const rc=fc+1;pos.push(0,(HD-HV)*.2,-L*.5);col.push(cEdge.r,cEdge.g,cEdge.b);
  for(let j=0;j<M;j++){idx.push(fc,j,(j+1)%M);idx.push(rc,R*M+(j+1)%M,R*M+j)}

  if(ooze&&rec.part&&objectInScene(rec.part.node)){specimen.addFluid(hole,.022,2,false);specimen.registerWound(rec.part.node,hole,.2,false,12);specimen.addTrauma(.035)}if(stimulate&&rec.part){specimen.stimulate(.12,rec.part);specimen.painImpulse=Math.max(specimen.painImpulse,.14)}if(!silent)SFX.unpin();updateStats(true);
}
function removePinsForSubtree(part,opts={}){if(!part)return;const parts=new Set(specimen.collectSubtree(part));for(const rec of [...specimen.pins])if(parts.has(rec.part))removePin(rec,opts)}
function removeAllPins(){const had=specimen.pins.length;for(const p of [...specimen.pins])removePin(p,{silent:true});if(had){SFX.unpin();toast('고정 핀을 전부 뺐다')}}

let grab=null;
const GRAB_TMP={target:new THREE.Vector3(),local:new THREE.Vector3(),delta:new THREE.Vector3()};
function beginGrab(sel){
  if(!sel)return;const p=sel.part;if(specimen.subtreeHasPins(p)){toast('고정 핀부터 뺀다');return}
  const rec=specimen.findLooseRecord(p);p.userDragging=true;SFX.grab(p);
  grab={part:p,rec,sel,startWorld:p.worldPos(v3()),startLocal:p.node.position.clone(),parent:p.node.parent,plane:new THREE.Plane(v3(0,1,0),-sel.hit.point.y),last:sel.hit.point.clone()};if(rec)rec.dragging=true;triggerToolAction();
}
function dragGrab(x,y){
  if(!grab)return;setRay(x,y);const tgt=raycaster.ray.intersectPlane(grab.plane,GRAB_TMP.target);if(!tgt)return;const p=grab.part,dragStep=tgt.distanceTo(grab.last);grab.last.copy(tgt);
  if(grab.rec||p.parentId===null&&p.state.detached){
    const rec=grab.rec||specimen.findLooseRecord(p);if(rec){rec.node.position.x=clamp(tgt.x,-tray.x+.1,tray.x-.1);rec.node.position.z=clamp(tgt.z,-tray.z+.1,tray.z-.1);rec.node.position.y=Math.max(boardTopY+.03,tgt.y);rec.vel.set(0,0,0);rec.rot.multiplyScalar(.2);resolveLooseFloor(rec)}return;
  }
  const dist=tgt.distanceTo(grab.startWorld),weak=clamp(1-p.state.cutDepth*.48-p.state.crack*.23-p.state.puncture*.18,.18,1),threshold=(.14+p.jointStrength*.3)*weak;
  p.state.strain=clamp(dist/Math.max(.04,threshold),0,2);SFX.strain(p,p.state.strain);p.state.shockPulse=Math.max(p.state.shockPulse,p.state.strain*.05);p.state.surfacePress=Math.max(p.state.surfacePress,.25+p.state.strain*.18);specimen.addTrauma(Math.min(.012,dragStep*.055+p.state.strain*.0012));specimen.stimulate(Math.min(.012,.003+p.state.strain*.003),p);
  if(grab.parent){const local=grab.parent.worldToLocal(GRAB_TMP.local.copy(tgt)),delta=GRAB_TMP.delta.copy(local).sub(grab.startLocal),max=.22+p.jointStrength*.11;if(delta.length()>max)delta.setLength(max);p.node.position.copy(grab.startLocal).addScaledVector(delta,.55)}
  if(dist>threshold&&p.parentId){const did=specimen.detachPart(p,tgt,clamp(.35+dist*.9,0,1),'pull');if(did){const rec=specimen.findLooseRecord(p);grab.rec=rec;if(rec){rec.dragging=true;rec.node.position.x=tgt.x;rec.node.position.z=tgt.z;rec.node.position.y=Math.max(boardTopY+.03,tgt.y);resolveLooseFloor(rec)}}}
}
function endGrab(){
  if(!grab)return;const p=grab.part;p.userDragging=false;p.state.strain=0;
  if(grab.rec){grab.rec.dragging=false;grab.rec.vel.set(rand(-.08,.08),.16,rand(-.08,.08));grab.rec.rot.set(rand(-1.5,1.5),rand(-1.5,1.5),rand(-1.5,1.5))}
  else if(p.node.parent===grab.parent)p.node.position.copy(grab.startLocal);grab=null;updateStats(true);
}

function updateFx(dt){
  for(let i=fxGroup.children.length-1;i>=0;i--){
    const m=fxGroup.children[i],f=m.userData.fx;if(!f)continue;f.life-=dt;
    if(f.life<=0){disposeObject3D(m);continue}
    f.vy-=3.7*dt;m.position.x+=f.vx*dt;m.position.y+=f.vy*dt;m.position.z+=f.vz*dt;
    if(f.vr){m.rotation.x+=f.vr.x*dt;m.rotation.y+=f.vr.y*dt;m.rotation.z+=f.vr.z*dt}
    if(m.position.y<=boardTopY+.01){m.position.y=boardTopY+.01;if(f.kind==='drop'){specimen.addFluid(m.position,f.stainSize||.032,1,f.dark??(Math.random()<.18));SFX.drip(clamp((f.stainSize||.03)*8));f.life=0}else{f.vy=Math.abs(f.vy)*.12;f.vx*=.55;f.vz*=.55}}
  }
}

const rect0=canvas.getBoundingClientRect();
const pointer={down:false,id:null,x:rect0.left+rect0.width/2,y:rect0.top+rect0.height/2,startX:0,startY:0,moved:0,multi:false};
const pointers=new Set();
function cancelAction(){if(grab)endGrab();contactAction=null;pointer.down=false;pointer.id=null;clearPartOutline();if(toolRig)toolRig.visible=false}
function handleDown(e){
  if(disposed||appPaused)return;SFX.ensure();pointers.add(e.pointerId);pointer.x=e.clientX;pointer.y=e.clientY;
  if(pointers.size>1){pointer.multi=true;cancelAction();return}if(tool==='camera')return;
  e.preventDefault();canvas.setPointerCapture?.(e.pointerId);pointer.down=true;pointer.id=e.pointerId;pointer.startX=pointer.x;pointer.startY=pointer.y;pointer.moved=0;updateToolRig(pointer.x,pointer.y);
  if(tool==='pin'){const pr=pickPin(pointer.x,pointer.y);if(pr)removePin(pr);else{const sel=pickPart(pointer.x,pointer.y);if(sel)startContactAction('pin',sel);else toast('고정할 부위를 정확히 누른다')}pointer.down=false;return}
  if(tool==='tweezer'){const pr=pickPin(pointer.x,pointer.y);if(pr){removePin(pr);triggerToolAction();pointer.down=false;return}const sel=pickPart(pointer.x,pointer.y);if(sel)beginGrab(sel);else toast('집을 부위를 정확히 누른다')}
}
function handleMove(e){
  pointer.x=e.clientX;pointer.y=e.clientY;pointer.moved+=Math.hypot(e.movementX||0,e.movementY||0);if(tool!=='camera')updateToolRig(pointer.x,pointer.y);
  if(!pointer.down||pointer.multi||pointer.id!==e.pointerId)return;if(tool==='tweezer')dragGrab(pointer.x,pointer.y);
}
function handleUp(e){
  pointers.delete(e.pointerId);if(pointers.size===0)pointer.multi=false;if(pointer.id!==e.pointerId)return;if(tool==='tweezer')endGrab();pointer.down=false;pointer.id=null;canvas.releasePointerCapture?.(e.pointerId);
}
function handlePointerLeave(){if(!pointer.down){toolVisible=false;if(toolRig)toolRig.visible=false;hidePartLabel();clearPartOutline()}}
function preventContext(e){e.preventDefault()}
canvas.addEventListener('pointerdown',handleDown,{passive:false});canvas.addEventListener('pointermove',handleMove,{passive:false});window.addEventListener('pointerup',handleUp,{passive:false});window.addEventListener('pointercancel',handleUp,{passive:false});canvas.addEventListener('contextmenu',preventContext);canvas.addEventListener('pointerleave',handlePointerLeave);

const UI={hint:$('#hint'),toast:$('#toast'),partLabel:$('#partLabel'),intro:$('#intro')};
let hintTimer=0,toastTimer=0,labelPart=null,statsT=0,lastStatsKey='',lastLabelText='';
function showHint(text,dur=3.5){UI.hint.textContent=text||'';UI.hint.classList.toggle('show',!!text);clearTimeout(hintTimer);if(text)hintTimer=setTimeout(()=>UI.hint.classList.remove('show'),dur*1000)}
function toast(text){UI.toast.textContent=text;UI.toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>UI.toast.classList.remove('show'),1050)}
function partStateText(p){const a=[];if(p.state.pinned)a.push('고정됨');if(p.state.detached)a.push('분리됨');return a.length?` · ${a.join(' · ')}`:''}
function showPartLabel(p){if(!p){hidePartLabel();return}labelPart=p;const text=p.label+partStateText(p);if(text!==lastLabelText){lastLabelText=text;UI.partLabel.textContent=text}UI.partLabel.classList.add('show')}
function hidePartLabel(){labelPart=null;lastLabelText='';UI.partLabel.classList.remove('show')}
function resultSnapshot(){
  specimen.computeSystems();const detached=[],damaged=[];for(const p of specimen.parts.values()){if(p.state.detached)detached.push(p.id);if(p.damageAmount()>.08)damaged.push({id:p.id,integrity:+p.state.integrity.toFixed(3),cut:+p.state.cutDepth.toFixed(3),crack:+p.state.crack.toFixed(3),puncture:+p.state.puncture.toFixed(3),burn:+p.state.burn.toFixed(3),detached:p.state.detached})}
  return {alive:specimen.life!=='still',lifeState:specimen.life,central:+specimen.central.toFixed(3),respiration:+specimen.respiration.toFixed(3),locomotion:+specimen.locomotion.toFixed(3),detachedPartIds:detached,damageSummary:damaged,fragmentCount:specimen.fragments,fragmentMass:specimen.fragments,totalCuts:specimen.totalCuts,pinCount:specimen.pins.length,reaction:+specimen.reaction.toFixed(3),fluidStainCount:fluidField.count(),fluidVolume:+specimen.fluidVolume.toFixed(4)};
}
function updateStats(force=false){
  const key=`${specimen.life}|${Math.round(specimen.locomotion*100)}|${specimen.pins.length}|${specimen.fragments}|${Math.round(specimen.reaction*100)}|${fluidField.count()}`;if(!force&&key===lastStatsKey)return;lastStatsKey=key;
  if(labelPart&&objectInScene(labelPart.node))showPartLabel(labelPart);
  if(typeof appOptions.onChange==='function'){try{appOptions.onChange(resultSnapshot())}catch(err){console.error('SpecimenLab onChange 오류',err)}}
}
function prepBases(target=specimen){for(const p of target.parts.values()){p.baseEuler=p.node.rotation.clone();p.meshBaseScales=p.meshes.map(m=>m.scale.clone());p.meshBasePos=p.meshes.map(m=>m.position.clone())}}
function settleBaseHeight(target=specimen){target.resolveConnectedFloor(0,true);target.baseRootY=target.root.position.y;target.floorOffset=0;target.floorTarget=0}
function firstEnabledTool(){return ['tweezer','pin','camera'].find(toolEnabled)||'camera'}
function resetSpecimen({silent=false}={}){
  cancelAction();specimen.clear();pinHeads.length=0;partSerial=0;specimen=new Specimen();prepBases(specimen);specimen.computeSystems();settleBaseHeight(specimen);lastStatsKey='';updateStats(true);setTool(firstEnabledTool());cameraHome();if(!silent)toast('새 실험체로 바꿨다');return specimen;
}
function cameraHome(){camera.position.set(0,6.9,7.1);controls.target.set(0,.35,-.1);controls.update()}
function applyOptions(next={}){
  const clean={},allowed=['showHUD','showToolbar','showActions','showIntro','enabledTools','quality','soundVolume','resetOnEnter','onChange','onExit'];for(const key of allowed)if(Object.prototype.hasOwnProperty.call(next,key))clean[key]=next[key];if(clean.enabledTools&&!Array.isArray(clean.enabledTools))delete clean.enabledTools;
  appOptions={...appOptions,...clean};appOptions.enabledTools=[...new Set((appOptions.enabledTools||[]).filter(k=>['tweezer','pin','camera'].includes(k)))];if(!appOptions.enabledTools.length)appOptions.enabledTools=['camera'];
  rootEl.classList.toggle('hide-hud',!appOptions.showHUD);rootEl.classList.toggle('hide-toolbar',!appOptions.showToolbar);rootEl.classList.toggle('hide-actions',!appOptions.showActions);rootEl.classList.toggle('hide-intro',!appOptions.showIntro);
  $$('.tool').forEach(b=>b.hidden=!appOptions.enabledTools.includes(b.dataset.tool));SFX.setVolume(appOptions.soundVolume);setQuality(appOptions.quality);
  if(!toolEnabled(tool))setTool(firstEnabledTool());if(started||!appOptions.showIntro)UI.intro.classList.add('hide');else UI.intro.classList.remove('hide');return {...appOptions};
}

const toolButtonHandlers=[];
for(const b of $$('.tool')){const fn=e=>{e.stopPropagation();e.preventDefault();SFX.ensure();setTool(b.dataset.tool)};b.addEventListener('pointerdown',fn);toolButtonHandlers.push([b,fn])}
function onUnpin(e){e.stopPropagation();e.preventDefault();removeAllPins()}
function onCenter(e){e.stopPropagation();e.preventDefault();cameraHome()}
function onReset(e){e.stopPropagation();e.preventDefault();SFX.ensure();resetSpecimen()}
function onStart(e){e.stopPropagation();e.preventDefault();SFX.ensure();started=true;appPaused=false;UI.intro.classList.add('hide');showHint(TOOL_HINT[tool],5)}
function onKeyDown(e){const map={Digit1:'tweezer',Digit2:'pin',Digit0:'camera'};if(map[e.code]&&toolEnabled(map[e.code])){e.preventDefault();setTool(map[e.code])}if(e.code==='Escape'){e.preventDefault();if(EMBEDDED)parent.postMessage({type:'specimen-lab-close',result:resultSnapshot()},location.origin);else cameraHome()}}
function onBlur(){cancelAction()}
function onVisibility(){pageHidden=document.hidden;last=now();if(pageHidden)cancelAction()}
$('#unpinBtn').addEventListener('pointerdown',onUnpin);$('#centerBtn').addEventListener('pointerdown',onCenter);$('#resetBtn').addEventListener('pointerdown',onReset);$('#startBtn').addEventListener('pointerdown',onStart);window.addEventListener('keydown',onKeyDown);window.addEventListener('blur',onBlur);document.addEventListener('visibilitychange',onVisibility);

function hoverUpdate(){
  if(!started||appPaused||pointer.down||tool==='camera'||pointer.multi)return;const sel=pickPart(pointer.x,pointer.y);if(sel){showPartLabel(sel.part);updateTargetVisual(sel)}else{hidePartLabel();updateTargetVisual(null)}
}
function resize(){
  if(disposed)return;const r=rootEl.getBoundingClientRect(),w=Math.max(1,Math.round(r.width||innerWidth)),h=Math.max(1,Math.round(r.height||innerHeight)),dpr=Math.max(.6,Math.min(devicePixelRatio||1,qualityState.dprCap)*qualityState.dprScale);renderer.setPixelRatio(dpr);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
function onWindowResize(){resize()}
window.addEventListener('resize',onWindowResize);const resizeObserver='ResizeObserver'in window?new ResizeObserver(resize):null;resizeObserver?.observe(rootEl);

let last=now(),hoverT=0,rafId=0;
function frame(){
  if(disposed)return;rafId=requestAnimationFrame(frame);const t=now(),rawDt=t-last,dt=Math.min(.05,Math.max(.001,rawDt));last=t;if(pageHidden)return;
  controls.update();toolAction=Math.max(0,toolAction-dt*3.5);if(!appPaused)updateContactAction(dt);
  if(started&&!appPaused){specimen.update(dt);updateFx(dt)}
  if((toolVisible||contactAction)&&tool!=='camera'&&!appPaused)updateToolRig(pointer.x,pointer.y);
  hoverT-=dt;if(hoverT<=0){hoverT=.08;hoverUpdate()}statsT-=dt;if(statsT<=0){statsT=.15;updateStats()}updateAdaptiveQuality(rawDt);renderer.render(scene,camera);
}

function mount(container,options={}){
  const host=typeof container==='string'?document.querySelector(container):container;if(!host)throw new Error('SpecimenLab.mount: 대상 컨테이너를 찾지 못했습니다.');if(host!==document.body&&getComputedStyle(host).position==='static')host.style.position='relative';host.appendChild(rootEl);rootEl.classList.toggle('embedded',host!==document.body);applyOptions(options);resize();return api;
}
function enter(payload={}){
  const options=payload.options||payload;applyOptions(options);if(payload.reset||appOptions.resetOnEnter)resetSpecimen({silent:true});started=true;appPaused=false;UI.intro.classList.add('hide');wake();return api;
}
function pause(){appPaused=true;cancelAction();return api}
function resume(){appPaused=false;started=true;last=now();return api}
function sleep(){appPaused=true;cancelAction();if(rafId){cancelAnimationFrame(rafId);rafId=0}return api}
function wake(){if(disposed)return api;appPaused=false;started=true;last=now();resize();if(!rafId)rafId=requestAnimationFrame(frame);return api}
function exit(){const result=resultSnapshot();started=false;appPaused=true;cancelAction();if(typeof appOptions.onExit==='function'){try{appOptions.onExit(result)}catch(err){console.error('SpecimenLab onExit 오류',err)}}return result}
function disposeApp(){
  if(disposed)return;disposed=true;cancelAnimationFrame(rafId);clearTimeout(hintTimer);clearTimeout(toastTimer);resizeObserver?.disconnect();
  canvas.removeEventListener('pointerdown',handleDown);canvas.removeEventListener('pointermove',handleMove);window.removeEventListener('pointerup',handleUp);window.removeEventListener('pointercancel',handleUp);canvas.removeEventListener('contextmenu',preventContext);canvas.removeEventListener('pointerleave',handlePointerLeave);
  for(const [b,fn] of toolButtonHandlers)b.removeEventListener('pointerdown',fn);$('#unpinBtn').removeEventListener('pointerdown',onUnpin);$('#centerBtn').removeEventListener('pointerdown',onCenter);$('#resetBtn').removeEventListener('pointerdown',onReset);$('#startBtn').removeEventListener('pointerdown',onStart);window.removeEventListener('keydown',onKeyDown);window.removeEventListener('blur',onBlur);document.removeEventListener('visibilitychange',onVisibility);window.removeEventListener('resize',onWindowResize);
  specimen.clear();clearPartOutline();controls.dispose();for(const child of [...scene.children])disposeObject3D(child,{force:true});for(const value of Object.values(mat))if(value?.isMaterial)disposeMaterial(value,true);disposeMaterial(pickMaterial,true);disposeMaterial(outlineSolidMat,true);disposeMaterial(outlineFlatMat,true);disposeMaterial(outlineLineMat,true);for(const g of geometryCache.values())g.dispose?.();geometryCache.clear();woodTexture.dispose();renderer.dispose();SFX.close();rootEl.remove();delete window.SpecimenLab;
}
const api={
  mount,enter,pause,resume,sleep,wake,exit,dispose:disposeApp,reset:resetSpecimen,setTool,configure:applyOptions,setQuality,
  result:resultSnapshot,
  debug:{
    select(id){const part=specimen.parts.get(id);return part?{part,hit:{point:part.worldPos(v3()),object:part.meshes[0],face:null}}:null},
    pin(id){const q=this.select(id);if(q)placePinImmediate(q);return resultSnapshot()},
    detach(id,force=.7){const q=this.select(id);if(q)specimen.detachPart(q.part,q.hit.point,clamp(force,0,1),'pull');return resultSnapshot()},
    unpinAll(){removeAllPins();return resultSnapshot()},
    snapFloor(){settleBaseHeight(specimen);return resultSnapshot()}
  },
  get specimen(){return specimen},get options(){return {...appOptions}}
};
window.SpecimenLab=api;
prepBases(specimen);specimen.computeSystems();settleBaseHeight(specimen);applyOptions(DEFAULT_OPTIONS);setTool('tweezer');resize();updateStats(true);rafId=requestAnimationFrame(frame);if(EMBEDDED)parent.postMessage({type:'specimen-lab-ready'},location.origin);
</script>
