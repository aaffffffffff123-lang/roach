name: Specimen lab check

on:
  push:
    paths:
      - 'specimen.html'
      - 'specimen-*.js'
      - 'SPECIMEN_LAB_DESIGN.md'
      - '.github/workflows/specimen-check.yml'
  workflow_dispatch:

jobs:
  syntax-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check specimen-core.js
          node --check specimen-anatomy.js
          node --check specimen-tools.js
          node --check specimen-main.js
          node --check specimen-smoke-test.cjs
      - name: Install browser driver
        run: npm install --no-save puppeteer-core@24
      - name: Find Chrome
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Start static server
        run: |
          python3 -m http.server 8765 > /tmp/specimen-server.log 2>&1 &
          echo $! > /tmp/specimen-server.pid
          sleep 1
      - name: Run WebGL smoke test
        run: node specimen-smoke-test.cjs
      - name: Upload rendered check image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specimen-render
          path: specimen-ci.png
          if-no-files-found: ignore
