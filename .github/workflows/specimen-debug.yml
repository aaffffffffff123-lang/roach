name: Specimen bootstrap diagnostic

on:
  push:
    paths:
      - 'specimen-smoke-debug2.b64'
      - '.github/workflows/specimen-debug.yml'
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save puppeteer-core@24
      - name: Find Chrome
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Start server
        run: |
          python3 -m http.server 8765 >/tmp/specimen-server.log 2>&1 &
          sleep 1
      - name: Diagnose browser bootstrap
        run: |
          base64 --decode specimen-smoke-debug2.b64 > specimen-smoke-debug2.cjs
          node specimen-smoke-debug2.cjs
