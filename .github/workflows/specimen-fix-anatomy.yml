name: Fix specimen anatomy method boundary

on:
  push:
    paths:
      - '.github/workflows/specimen-fix-anatomy.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore missing method brace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('specimen-anatomy.js')
          s = p.read_text()
          old = "    let total=0;for(const chain of this.legChains){let s=1;const majors=chain.parts.filter(p=>p.kind==='leg').slice(0,4);for(const p of majors){if(!p.bodyAttached)s*=.05;else s*=clamp(p.integrity*.8+p.nerve*.2,0,1)}total+=s}this.vitals.mobility=clamp(total/6,0,1);return this.vitals.mobility;\n  lifeState()"
          new = "    let total=0;for(const chain of this.legChains){let s=1;const majors=chain.parts.filter(p=>p.kind==='leg').slice(0,4);for(const p of majors){if(!p.bodyAttached)s*=.05;else s*=clamp(p.integrity*.8+p.nerve*.2,0,1)}total+=s}this.vitals.mobility=clamp(total/6,0,1);return this.vitals.mobility;\n  }\n  lifeState()"
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check specimen-anatomy.js
      - name: Commit fix and remove one-off workflow
        run: |
          rm .github/workflows/specimen-fix-anatomy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore specimen mobility method boundary"
          git push
