name: Assemble specimen modules

on:
  push:
    paths:
      - '.specimen-src/**'
      - '.github/workflows/specimen-assemble.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble source files
        run: |
          cat \
            .specimen-src/specimen-anatomy.js.00.part \
            .specimen-src/specimen-anatomy.js.01.part \
            .specimen-src/specimen-anatomy.js.02.part \
            .specimen-src/specimen-anatomy.js.03.part \
            .specimen-src/specimen-anatomy.js.04a.part \
            .specimen-src/specimen-anatomy.js.04b.part \
            .specimen-src/specimen-anatomy.js.04c.part \
            > specimen-anatomy.js

          cat \
            .specimen-src/specimen-tools.js.00.part \
            .specimen-src/specimen-tools.js.01.part \
            .specimen-src/specimen-tools.js.02.part \
            .specimen-src/specimen-tools.js.03.part \
            .specimen-src/specimen-tools.js.04.part \
            .specimen-src/specimen-tools.js.05a.part \
            .specimen-src/specimen-tools.js.05b.part \
            .specimen-src/specimen-tools.js.05c.part \
            .specimen-src/specimen-tools.js.06a.part \
            > specimen-tools.js
          base64 --decode .specimen-src/specimen-tools.js.06b.b64 >> specimen-tools.js
          base64 --decode .specimen-src/specimen-tools.js.06c.b64 >> specimen-tools.js
          base64 --decode .specimen-src/specimen-tools.js.07.b64 >> specimen-tools.js

          node --check specimen-anatomy.js
          node --check specimen-tools.js

      - name: Commit assembled modules
        run: |
          rm -rf .specimen-src
          rm -f .github/workflows/specimen-assemble.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build specimen anatomy and tool modules"
          git push
