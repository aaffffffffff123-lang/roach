// care-room.html — 간병: 구급상자로 집어 온 바퀴벌레 시체를 휴지 위에 눕혀 놓고 면봉·연고·브러시·핀셋으로 돌본다.

// ───────── 크기 (바퀴 몸길이 = 1) ─────────
const TISSUE=2.4, TW=TISSUE/2, TISSUE_Y=0.004;        // 네 번 접었다 편 휴지 한 장 (바퀴 몸길이의 2.4배)
const GN=SMALL?168:200, GW=3.3, GC=GW/(GN-1);          // 연고가 쌓이는 높이맵 (휴지보다 조금 넓게)
const WORK=TW+0.12;                                    // 이 안을 누르면 도구, 바깥을 끌면 시점

// ───────── 잡음 ─────────
const hash2=(x,y)=>{ const s=Math.sin(x*127.1+y*311.7)*43758.5453; return s-Math.floor(s); };

  return lerp(lerp(hash2(xi,yi),hash2(xi+1,yi),u),lerp(hash2(xi,yi+1),hash2(xi+1,yi+1),u),v); }
function fbm(x,y,o=4){ let a=.5,s=0,f=1; for(let i=0;i<o;i++){ s+=a*vnoise(x*f,y*f); f*=2.03; a*=.5; } return s; }

// ───────── 렌더러 ─────────
let renderer=null;
try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'}); }
catch(err){ showErr('이 기기에서는 3D 화면을 열 수 없습니다.'); throw err; }

renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const MAX_ANISO=renderer.capabilities.getMaxAnisotropy?.()||4;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xe7d8bf);
const camera=new THREE.PerspectiveCamera(40,1,.05,60);
{ const pm=new THREE.PMREMGenerator(renderer); scene.environment=pm.fromScene(new RoomEnvironment(),.04).texture; scene.environmentIntensity=.42; pm.dispose(); }
// 창에서 들어오는 낮빛 하나 + 방 안 반사광
const hemi=new THREE.HemisphereLight(0xfff5e6,0x7d6446,.38); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffefd6,2.85); sun.position.set(2.5,5.6,2.4); sun.castShadow=true;
sun.shadow.mapSize.set(SMALL?1024:2048,SMALL?1024:2048);
{ const c=sun.shadow.camera; c.left=-2.3; c.right=2.3; c.top=2.3; c.bottom=-2.3; c.near=1; c.far=14; }
sun.shadow.bias=-.00035; sun.shadow.normalBias=.012; scene.add(sun); scene.add(sun.target);
const fill=new THREE.DirectionalLight(0xdfe8ff,.32); fill.position.set(-3,2.6,-2.2); scene.add(fill);

// ───────── 책상 ─────────
function woodTexture(){
  const S=1024, c=document.createElement('canvas'); c.width=c.height=S; const g=c.getContext('2d');
  const grd=g.createLinearGradient(0,0,0,S); grd.addColorStop(0,'#dcae74'); grd.addColorStop(.5,'#d5a46a'); grd.addColorStop(1,'#ddb07a');
  g.fillStyle=grd; g.fillRect(0,0,S,S);
  // 넓은 결 띠
  for(let i=0;i<14;i++){ const y=Math.random()*S, h=30+Math.random()*90; g.fillStyle=`rgba(${170+Math.random()*30|0},${110+Math.random()*25|0},${60+Math.random()*20|0},${.06+Math.random()*.09})`; g.beginPath(); for(let x=0;x<=S;x+=32){ const yy=y+Math.sin(x/260+i)*18; x?g.lineTo(x,yy):g.moveTo(x,yy); } for(let x=S;x>=0;x-=32){ const yy=y+h+Math.sin(x/230+i*1.7)*16; g.lineTo(x,yy); } g.closePath(); g.fill(); }
  // 가는 결
  for(let i=0;i<320;i++){ const y=Math.random()*S, amp=3+Math.random()*9, ph=Math.random()*TAU, a=.05+Math.random()*.14;
    g.strokeStyle=`rgba(${120+Math.random()*40|0},${80+Math.random()*30|0},${45+Math.random()*20|0},${a.toFixed(3)})`; g.lineWidth=.5+Math.random()*1.6; g.beginPath();
    for(let x=-8;x<=S+8;x+=14){ const yy=y+Math.sin(x/170+ph)*amp+Math.sin(x/47+ph*2)*amp*.22; x<0?g.moveTo(x,yy):g.lineTo(x,yy); } g.stroke(); }
  // 숨구멍
  for(let i=0;i<2600;i++){ g.fillStyle=`rgba(110,72,40,${(.04+Math.random()*.08).toFixed(3)})`; g.fillRect(Math.random()*S,Math.random()*S,1+Math.random()*3,1); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2.4,2.4); t.anisotropy=MAX_ANISO; return t;
}
const desk=new THREE.Mesh(new THREE.PlaneGeometry(18,18),new THREE.MeshPhysicalMaterial({map:woodTexture(),roughness:.46,clearcoat:.35,clearcoatRoughness:.32}));
desk.rotation.x=-Math.PI/2; desk.receiveShadow=true; scene.add(desk);

// ───────── 휴지 ─────────
// 네 번 접었다 편 자국(가운데 세로로 솟은 산, 가로 접힌 골 양옆이 살짝 뜬 모양), 잔주름, 살짝 들린 귀퉁이.
// 종이는 책상 위에 놓여 있으니 책상보다 아래로는 절대 안 내려간다. 시체가 놓인 가운데는 평평하다
function tissueH(x,z){
  const ax=Math.abs(x)/TW, az=Math.abs(z)/TW; if(ax>1||az>1) return 0;
  const flat=sstep(.6,1.1,Math.hypot(x*.95,z));
  const ridge=.012*Math.exp(-(x*x)/.0016);
  const valley=.008*(Math.exp(-(z*z)/.03)-.55*Math.exp(-(z*z)/.0018));
  const wr=Math.pow(fbm(x*1.6+3.1,z*1.6-1.7,3),1.6)*.03+vnoise(x*7+11,z*7)*.003;
  const e=Math.max(ax,az), curl=.032*Math.pow(sstep(.8,1,e),2)*(.6+.4*vnoise(x*3,z*3+5));
  const corner=.03*Math.pow(sstep(.74,1,ax)*sstep(.74,1,az),1.2);
  return TISSUE_Y+(ridge+valley+wr)*flat+curl+corner;
}
const TCW=SMALL?1024:2048;
const tCv=document.createElement('canvas'); tCv.width=tCv.height=TCW; const tg=tCv.getContext('2d');
const tTex=new THREE.CanvasTexture(tCv); tTex.colorSpace=THREE.SRGBColorSpace; tTex.anisotropy=MAX_ANISO;
let tDirty=false, tFlushT=0;
function paintTissue(){
  tg.globalCompositeOperation='source-over';
  tg.fillStyle='#fcfbf7'; tg.fillRect(0,0,TCW,TCW);
  const s=TCW/1024;
  // 넓게 흐린 밝기 차 + 짧은 섬유
  for(let i=0;i<60;i++){ const x=Math.random()*TCW, y=Math.random()*TCW, r=(60+Math.random()*160)*s; const gr=tg.createRadialGradient(x,y,0,x,y,r); const c=Math.random()<.5?'238,234,224':'255,255,252'; gr.addColorStop(0,`rgba(${c},.35)`); gr.addColorStop(1,`rgba(${c},0)`); tg.fillStyle=gr; tg.fillRect(x-r,y-r,r*2,r*2); }
  tg.lineCap='round';
  for(let i=0;i<5200;i++){ const x=Math.random()*TCW, y=Math.random()*TCW, a=Math.random()*TAU, l=(2+Math.random()*7)*s; tg.strokeStyle=`rgba(${215+Math.random()*25|0},${210+Math.random()*25|0},${200+Math.random()*25|0},${(.12+Math.random()*.2).toFixed(2)})`; tg.lineWidth=(.5+Math.random()*.8)*s; tg.beginPath(); tg.moveTo(x,y); tg.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); tg.stroke(); }
  // 접힌 자국에 얇은 그늘
  const lx=TCW/2; const gx=tg.createLinearGradient(lx-6*s,0,lx+6*s,0); gx.addColorStop(0,'rgba(200,195,184,0)'); gx.addColorStop(.5,'rgba(200,195,184,.22)'); gx.addColorStop(1,'rgba(200,195,184,0)'); tg.fillStyle=gx; tg.fillRect(lx-6*s,0,12*s,TCW);
  const ly=TCW/2; const gy=tg.createLinearGradient(0,ly-5*s,0,ly+5*s); gy.addColorStop(0,'rgba(200,195,184,0)'); gy.addColorStop(.5,'rgba(200,195,184,.16)'); gy.addColorStop(1,'rgba(200,195,184,0)'); tg.fillStyle=gy; tg.fillRect(0,ly-5*s,TCW,10*s);
  tDirty=true;
}
const toTex=(x,z)=>[(x+TW)/TISSUE*TCW,(z+TW)/TISSUE*TCW];
/** 휴지에 배는 얼룩 (월드 좌표) */
function stain(x,z,r,rgb,a){
  if(Math.abs(x)>TW+r||Math.abs(z)>TW+r) return;
  const [px,py]=toTex(x,z), pr=Math.max(2,r/TISSUE*TCW);
  const gr=tg.createRadialGradient(px,py,0,px,py,pr);
  gr.addColorStop(0,`rgba(${rgb},${a.toFixed(3)})`); gr.addColorStop(.62,`rgba(${rgb},${(a*.75).toFixed(3)})`); gr.addColorStop(.86,`rgba(${rgb},${(a*.9).toFixed(3)})`); gr.addColorStop(1,`rgba(${rgb},0)`);
  tg.fillStyle=gr; tg.beginPath(); tg.ellipse(px,py,pr,pr*(.8+Math.random()*.4),Math.random()*Math.PI,0,TAU); tg.fill();
  tDirty=true;
}
function embossTexture(){
  // 다이아몬드 누빔 + 칸마다 작은 점 (흔한 각티슈 엠보싱). 높이를 그린 뒤 법선으로 바꾼다
  const S=256, H=new Float32Array(S*S);
  for(let y=0;y<S;y++) for(let x=0;x<S;x++){
    const u=x/S, v=y/S, a=(u+v)*5, b=(u-v)*5;
    const da=Math.abs(a-Math.round(a)), db=Math.abs(b-Math.round(b));

// ───────── 연고 ─────────
const oPos=new Float32Array(GN*GN*3), oNor=new Float32Array(GN*GN*3), oTh=new Float32Array(GN*GN);

{ for(let j=0;j<GN;j++) for(let i=0;i<GN;i++){ const k=j*GN+i; oPos[k*3]=-GW/2+i*GC; oPos[k*3+2]=-GW/2+j*GC; oNor[k*3+1]=1; }

// 얇게 묻은 곳은 비치고, 두껍게 쌓인 곳은 하얗게 막힌다. 두께가 없는 칸은 그리지 않는다(그림자에서도 뺀다)

function deposit(ax,az,bx,bz,vol,rb){
  const minx=Math.min(ax,bx)-rb, maxx=Math.max(ax,bx)+rb, minz=Math.min(az,bz)-rb, maxz=Math.max(az,bz)+rb;
  const i0=Math.max(1,Math.floor(gix(minx))), i1=Math.min(GN-2,Math.ceil(gix(maxx))), j0=Math.max(1,Math.floor(gix(minz))), j1=Math.min(GN-2,Math.ceil(gix(maxz)));

  let sum=0; const ks=[], ws=[];
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){ const x=-GW/2+i*GC, z=-GW/2+j*GC;
    let t=L2>0?((x-ax)*dx+(z-az)*dz)/L2:0; t=clamp(t); const d=Math.hypot(x-(ax+dx*t),z-(az+dz*t)); if(d>=rb) continue;
    const w=Math.pow(1-(d/rb)**2,1.5); ks.push(j*GN+i); ws.push(w); sum+=w; }
  if(sum<=0) return;

const SLOPE=1.7;
function slump(i0,i1,j0,j1,iters){
  i0=Math.max(1,i0); j0=Math.max(1,j0); i1=Math.min(GN-2,i1); j1=Math.min(GN-2,j1);
  const step=GC*SLOPE, N=[1,-1,GN,-GN]; let moved=false;
  for(let it=0;it<iters;it++) for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){ const k=j*GN+i, t=th[k]; if(t<=1e-5) continue; const s=base[k]+t;
    for(const o of N){ const n=k+o, ds=s-(base[n]+th[n]); if(ds<=0) continue;

  g.setTransform(sayDpr,0,0,sayDpr,0,0); g.clearRect(0,0,sayW,sayH); sayDrawn=true;

  if(!bubble.box||bubble.box.px!==px||bubble.box.W!==sayW){ const m=measureBubble(g,bubble.text,px,maxW); bubble.box={...m,W:sayW}; }
  const b=bubble.box, tb=$('#toolbar').getBoundingClientRect();

  b.cx=clamp(sayW/2+bubble.side*Math.min(sayW*.12,90),b.rx+8,sayW-b.rx-8); b.cy=Math.min(sayH*.86,tb.top)-px*2.1-b.ry; b.tx=sayW/2+bubble.side*sayW*.36; b.ty=sayH+40;

const Y_AXIS=new THREE.Vector3(0,1,0);

function leanQuat(out,tilt,side=1.0){
  const cx=camera.position.x-LOOK.x, cz=camera.position.z-LOOK.z; let fx=cx, fz=cz; const l=Math.hypot(fx,fz)||1; fx/=l; fz/=l;   // 카메라 쪽
  const rx=fz, rz=-fx;                                                                                                      // 화면 오른쪽
  const dx=fx*Math.cos(side)+rx*Math.sin(side), dz=fz*Math.cos(side)+rz*Math.sin(side);

}

function makeSwab(){

    for(let i=0;i<P.count;i++){ _v.fromBufferAttribute(P,i); const n=1+(vnoise(_v.x*5+seed,_v.y*5+_v.z*3)-.5)*.16+(hash2(i*.37,seed)-.5)*.03; _v.multiplyScalar(n); _v.x*=.08; _v.z*=.08; _v.y*=.2; P.setXYZ(i,_v.x,_v.y,_v.z); col[i*3]=col[i*3+1]=col[i*3+2]=1; }

/** 튜브 몸통 모양: 끝은 이음매로 납작, 쥔 자리는 눌리고, 많이 짤수록 뒤쪽부터 납작해진다 */

// 브러시: 나무 손잡이, 은색 쇠테, 끝이 밝은 두 빛깔 털. 털 덩어리는 정점을 직접 휘고 눌러 퍼지게 한다. 원점 = 털 끝
function strandTexture(){
  const W=256,H=512,c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  const grd=g.createLinearGradient(0,0,0,H); grd.addColorStop(0,'#f2e8d8'); grd.addColorStop(.42,'#e6d6bb'); grd.addColorStop(.62,'#8a6a4c'); grd.addColorStop(1,'#4b3626');

  const img=g.getImageData(0,0,W,H);

}
function makeBrush(){
  const root=new THREE.Group();

  for(let i=0;i<=NS;i++){ const s=i/NS; const r=s<.42?TR*Math.sin(Math.min(1,s/.42)*Math.PI/2)*(.35+.65*Math.sqrt(s/.42)):TR*(1-.24*sstep(.42,1,s)); prof.push(new THREE.Vector2(Math.max(.002,r),s*TL)); }

  const UV=geo.attributes.uv; for(let i=0;i<UV.count;i++) UV.setY(i,1-UV.getY(i));
  const P=geo.attributes.position, rest=Float32Array.from(P.array), sv=new Float32Array(P.count);

  handle.position.y=TL+.22+.87; handle.castShadow=true; root.add(handle);

// 핀셋: 끝이 가늘어지는 스테인리스 판 두 쪽이 마주 보고 서서 뒤에서 붙어 있다. 위에서 보면 끝이 모이는 V자. 원점 = 집게 끝, 뒤쪽이 +z
function makeTweezer(){
  const steel=new THREE.MeshStandardMaterial({color:0xf27aa6,metalness:.12,roughness:.32,envMapIntensity:1});
  const ribbed=new THREE.MeshStandardMaterial({color:0xd24f86,metalness:.1,roughness:.5,envMapIntensity:1});
  const pivot=new THREE.Group(), LEN=2.55, arms=[];
  // 판 가운데 자리: 끝은 벌어진 만큼, 가운데는 살짝 부풀고, 뒤는 붙는다
  const armX=(side,u,open)=>side*(.0045+open*.075*Math.pow(1-u,1.1)+.026*Math.sin(Math.PI*Math.min(1,u*1.05))*(1-u*.4));
  for(const side of [-1,1]){
    const geo=new THREE.BoxGeometry(1,1,1,1,2,36), P=geo.attributes.position; P.setUsage(THREE.DynamicDrawUsage);
    const rest=Float32Array.from(P.array);
    const mesh=new THREE.Mesh(geo,steel); mesh.castShadow=true; pivot.add(mesh);
    // 손 대는 자리의 미끄럼 방지 홈
    const grip=new THREE.Mesh(new THREE.BoxGeometry(.004,.052,.42),ribbed); grip.castShadow=false; pivot.add(grip);
    arms.push({side,geo,rest,grip});
  }
  pivot.visible=false; scene.add(pivot);
  let lastOpen=-1;
  const setGrip=v=>{
    const open=1-clamp(v); if(Math.abs(open-lastOpen)<.003) return; lastOpen=open;
    for(const A of arms){ const P=A.geo.attributes.position, R=A.rest;
      for(let i=0;i<P.count;i++){ const x=R[i*3], y=R[i*3+1], u=R[i*3+2]+.5;          // u: 0 끝 → 1 뒤
        const hgt=lerp(.014,.088,sstep(0,.42,u)), thk=lerp(.008,.015,u);              // 판 높이(세로) · 두께(벌어지는 쪽)
        P.setXYZ(i,armX(A.side,u,open)+x*thk,y*hgt+(1-u)*(1-u)*-.004,u*LEN); }
      P.needsUpdate=true; A.geo.computeVertexNormals(); A.geo.computeBoundingSphere();
      const gu=.62; A.grip.position.set(armX(A.side,gu,open)+A.side*(lerp(.008,.015,gu)/2+.002),0,gu*LEN); }
  };
  setGrip(0);
  return {root:pivot,setGrip,grip:0,gripT:0};
}

/** 화면 점이 닿는 표면(휴지·시체·연고 높이맵, 바깥은 책상) */
function pickSurface(sx,sy,out=new THREE.Vector3()){

  if(!found) t=tEnd;
  else{ let a=prevT,b=t; for(let i=0;i<7;i++){ const m=(a+b)/2, x=o.x+d.x*m, y=o.y+d.y*m, z=o.z+d.z*m; if(y<=surfY(x,z)) b=m; else a=m; } t=b; }

        const sx=gix(x-vx), sz=gix(z-vz), si=Math.round(sx), sj=Math.round(sz); const up=th[clamp(sj,1,GN-2)*GN+clamp(si,1,GN-2)];
        const avg=(th[k-1]+th[k+1]+th[k-GN]+th[k+GN])*.25; const w=(1-d/r)*sh; const nt=Math.fround(Math.max(0,lerp(th[k],lerp(avg,up,.6),w))); overCream=Math.max(overCream,th[k]); if(nt!==th[k]){ th[k]=nt; changed=true; } }

    if(corpse&&speed>.03){ for(const l of corpse.legs){ if(l===held?.leg) continue; l.mesh.getWorldPosition(_v2); const tip=legTipWorld(l,_v); const d=Math.min(Math.hypot(_v2.x-ax,_v2.z-az),Math.hypot(tip.x-ax,tip.z-az)); if(d>r) continue;

  const sw=touching?clamp(Math.pow(speed*.85,.75))*(.55+.45*T.press):0, wet=touching?clamp(Math.max(overCream/.01,T.cream*.55,T.stain*.6)):0;

// ───────── 다리 ─────────
const _lv=new THREE.Vector3();
function legTipWorld(l,out){ const s=l.samples; let far=s[0], fx=-1; for(const q of s){ if(q.x>fx){ fx=q.x; far=q; } } return out.copy(far).applyMatrix4(l.mesh.matrixWorld); }
function applyLeg(l){ l.grp.rotation.set(l.rx,l.ry+l.nudge,l.rz,'YXZ'); l.grp.updateMatrixWorld(true); drape(l.mesh,l.rest,legSup(l),l.top?l.supH:null); }
/** 면봉·브러시가 연고를 걷거나 민 자리에 얹혀 있던 다리를 다시 앉힌다: 밑이 낮아진 곳만 따라 내려앉고(떨어진 다리는 떨어진다), 덮인 연고 위로 솟지는 않는다 */
function resettleLegs(){
  const R=resettle; resettle=null; if(!R||!corpse) return;
  for(const l of corpse.legs){ if(!l.top||l===held?.leg) continue;
    l.mesh.updateMatrixWorld(true); let a=1e9,b=-1e9,c=1e9,d=-1e9;
    for(const q of l.samples){ _v.copy(q).applyMatrix4(l.mesh.matrixWorld); const i=gix(_v.x), j=gix(_v.z); if(i<a) a=i; if(i>b) b=i; if(j<c) c=j; if(j>d) d=j; }
    if(b<R[0]-2||a>R[1]+2||d<R[2]-2||c>R[3]+2) continue;
    if(l.fall) continue;
    if(l.detached){ const S=corpse.S, floor=(surfFloorUnder(l)-corpse.group.position.y)/S+l.L0.y;
      if(l.grp.position.y>floor+.002/S){ l.fall={v:0}; continue; } }        // 밑의 연고가 걷혔다 → 떨어진다
    drape(l.mesh,l.rest,legSup(l),l.supH,true);                           // 낮아진 곳만 따라 내려앉는다 (덮인 연고 위로 솟지는 않는다)
  }
}
/** 떨어진 다리를 월드 기준으로 d만큼 옮긴다 */
function moveLegWorld(l,d){ const S=corpse.S; _lv.copy(d); const q=corpse.group.quaternion.clone().invert(); _lv.applyQuaternion(q).multiplyScalar(1/S); l.grp.position.x+=_lv.x; l.grp.position.z+=_lv.z; l.grp.updateMatrixWorld(true); drape(l.mesh,l.rest,legSup(l),l.top?l.supH:null); }
/** 화면 점 근처의 다리를 고른다 */
function legAt(sx,sy){
  if(!corpse) return null;
  const r=canvas.getBoundingClientRect(), lim=(COARSE?46:30)**2; let best=null, bd=lim;
  for(const l of corpse.legs){ l.mesh.updateMatrixWorld(true);
    for(const q of l.samples){ _v.copy(q).applyMatrix4(l.mesh.matrixWorld).project(camera); const x=(_v.x*.5+.5)*r.width, y=(-_v.y*.5+.5)*r.height; const d=(x-sx)**2+(y-sy)**2; if(d<bd){ bd=d; best=l; } } }
  return best;
}
function grabAt(sx,sy,p){

function updateHeld(dt){

  h.lift=Math.min(1,h.lift+dt*7);
  if(l.detached){
    // 핀셋 끝을 따라간다

    _v.set(wx,0,wz); corpse.group.worldToLocal(_v);

function updateFalling(dt){

// 다리 밑 바닥 높이 (휴지·시체 몸·연고 가운데 가장 높은 곳)

// ───────── 도구 자리 잡기 (매 장면) ─────────
const TILT={swab:.78,ointment:.5,brush:.72,tweezer:0};
function placeTools(dt){
  const T=TOOLS[tool];
  if(entering&&tool==='tweezer') return;                 // 들어오는 동안은 핀셋이 시체를 내려놓는 중
  if(!pen.shown){ T.root.visible=false; return; }
  T.root.visible=true;
  // 따라가기: 누르는 동안은 빠르게, 떠 있을 땐 부드럽게
  const k=1-Math.exp(-(pen.down?38:22)*dt);
  const px=cur.x, pz=cur.z;
  cur.x+=(target.x-cur.x)*k; cur.z+=(target.z-cur.z)*k;
  const ground=surfY(cur.x,cur.z);
  let lift=pen.down?0:(pen.hover?.07:.16);
  if(tool==='brush') lift=pen.down?-.13*TOOLS.brush.press:(pen.hover?.05:.12);
  if(tool==='swab') lift=pen.down?-.012:(pen.hover?.05:.14);
  if(tool==='ointment') lift=pen.down?.12:.2;
  if(tool==='tweezer') lift=pen.down?(held?.05:.0):(pen.hover?.06:.15);
  cur.y=damp(cur.y,ground+lift,pen.down?40:18,dt);
  pen.vel.set((cur.x-px)/Math.max(dt,1e-3),0,(cur.z-pz)/Math.max(dt,1e-3));
  T.root.position.copy(cur);
  if(tool==='tweezer'){
    const tw=T; tw.grip=damp(tw.grip,held?1:tw.gripT,30,dt); tw.setGrip(tw.grip);
    // 화면 안쪽을 향해 비스듬히 내려다보며 집는다
    const yaw=Math.atan2(camera.position.x-cur.x,camera.position.z-cur.z)+.75;
    T.root.rotation.set(-.62,yaw,0,'YXZ');
  }else{
    leanQuat(_q,TILT[tool]); T.root.quaternion.slerp(_q,1-Math.exp(-10*dt));
  }
  if(tool==='ointment'){
    const tube=TOOLS.ointment, sq=squeezeLine?1:0;
    tube.squeeze=damp(tube.squeeze,sq,14,dt);
    // 쥐어 짜는 동안 몸통이 눌리고, 많이 쓸수록 뒤쪽부터 납작해진다
    shapeTube(tube);
    const rope=tube.rope;
    if(squeezeLine){ _v.set(0,0,0); tube.root.localToWorld(_v); const ex=squeezeLine.x, ez=squeezeLine.z, ey=surfY(ex,ez); _v2.set(ex,ey,ez);
      const len=_v.distanceTo(_v2); rope.visible=len>.01; rope.position.copy(_v).add(_v2).multiplyScalar(.5); rope.scale.set(.046*squeezeLine.flow+.008,len,.046*squeezeLine.flow+.008);
      rope.quaternion.setFromUnitVectors(Y_AXIS,_v2.sub(_v).normalize()); }
    else rope.visible=false;
  }
}

  // 줄마다 글자 자리 (글자는 제 가운데를 축으로 살짝 기울고 오르내린다)
  const rows=TITLE.map(L=>{ let x=0, i=0; const g=[];
    for(const ch of L.text){ if(ch===' '){ x+=L.size*.3; continue; } const t=TJ[ch]; const w=t.adv/100*L.size;
      g.push({t,x,w,s:L.size,col:L.colors[i%L.colors.length],rot:(rnd()*2-1)*5,dy:(rnd()*2-1)*L.size*.03}); x+=w; i++; }
    return {g,w:x,s:L.size}; });
  const pad=20, gap=8, W=Math.ceil(Math.max(...rows.map(r=>r.w))+pad*2);
  let y=pad+4; const base=[];
  for(const r of rows){ y+=r.s*.8; base.push(y); y+=r.s*.2+gap; }
  const H=Math.ceil(y-gap+pad+6);
  // 우표: 둘째 줄 오른쪽 끝에 비스듬히 붙인다
  const r2=rows[1], x2=(W-r2.w)/2-r2.s*.24, sw=r2.s*1.02, sh=sw*78/62;
  const sx=x2+r2.w+r2.s*.05, sy=base[1]-r2.s*.86;
  let shadow='', white='', color='', glyphs='', k=0;
  rows.forEach((r,ri)=>{ const x0=ri===1?x2:(W-r.w)/2;
    for(const q of r.g){
      const sc=(q.s/100).toFixed(4), cx=(q.w/2).toFixed(1), cy=(-q.s*.38).toFixed(1);
      const tr=`translate(${(x0+q.x).toFixed(1)} ${(base[ri]+q.dy).toFixed(1)}) rotate(${q.rot.toFixed(1)} ${cx} ${cy}) scale(${sc})`;
      const open=`<g class="tP" style="--i:${k}"><g class="tB" style="--i:${k}"><g transform="${tr}">`, close='</g></g></g>';
      glyphs+=`<path id="tcG${k}" d="${q.t.d}"/>`;                // 글자 모양은 한 번만 두고 겹마다 가져다 쓴다
      shadow+=`${open}<use href="#tcG${k}" transform="translate(0 5)" fill="#d9b07a" stroke="#d9b07a" stroke-width="25"/>${close}`;
      white+=`${open}<use href="#tcG${k}" fill="#fffaf0" stroke="#fffaf0" stroke-width="25"/>${close}`;
      color+=`${open}<use href="#tcG${k}" fill="${q.col}" stroke="${q.col}" stroke-width="7"/><use href="#tcG${k}" fill="url(#tcHatch)" stroke="url(#tcHatch)" stroke-width="7"/>`
        +`<path d="${tWobble(q.t.d,.55,rnd)}" fill="none" stroke="#3b2416" stroke-width="2.7" stroke-linecap="round"/>${close}`;
      k++;
    } });
  // 바퀴벌레 우표 (편지에 붙던 것과 같은 그림)
  let perf=''; for(let x=1;x<64;x+=6) perf+=`<circle cx="${x}" cy="0" r="2.6"/><circle cx="${x}" cy="78" r="2.6"/>`; for(let yy=4;yy<78;yy+=6) perf+=`<circle cx="0" cy="${yy}" r="2.6"/><circle cx="62" cy="${yy}" r="2.6"/>`;
  const stamp=`<g class="tS"><g transform="translate(${sx.toFixed(1)} ${sy.toFixed(1)}) rotate(9 ${(sw/2).toFixed(1)} ${(sh/2).toFixed(1)}) scale(${(sw/62).toFixed(4)})">`
    +`<rect x="2" y="5" width="62" height="78" rx="2" fill="#000" opacity=".16"/>`
    +`<g mask="url(#tcPerf)"><rect width="62" height="78" fill="#fff"/><rect x="5" y="5" width="52" height="68" fill="url(#tcSky)"/><circle cx="46" cy="16" r="6" fill="#ffd45a"/><rect x="5" y="58" width="52" height="15" fill="#d9a766"/></g>`
    +`<g transform="translate(31 38)"><ellipse cx="1.5" cy="3" rx="10" ry="19" fill="#000" opacity=".18"/>`
    +`<g stroke="#2b1406" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-2 -17 C-6 -24 -11 -27 -18 -30"/><path d="M2 -17 C6 -24 11 -27 18 -30"/><path d="M-6 -8 L-12 -11 L-16 -17"/><path d="M6 -8 L12 -11 L16 -17"/><path d="M-7 -2 L-14 1 L-19 6"/><path d="M7 -2 L14 1 L19 6"/><path d="M-6 3 L-13 10 L-17 21"/><path d="M6 3 L13 10 L17 21"/></g>`
    +`<path d="M0 -8 C8 -8 9 2 8 10 C7 18 3 22 0 22 C-3 22 -7 18 -8 10 C-9 2 -8 -8 0 -8 Z" fill="url(#tcWing)"/><path d="M0 -7 C-1 4 -1 14 0 22" stroke="#3a1a06" stroke-width=".8" fill="none"/>`
    +`<path d="M-4 -4 C-6 4 -5 12 -3 18" stroke="#f0c48a" stroke-width="1.1" fill="none" opacity=".45" stroke-linecap="round"/>`
    +`<path d="M0 -17 C6 -17 9 -13 9 -9 C9 -7 5 -6 0 -6 C-5 -6 -9 -7 -9 -9 C-9 -13 -6 -17 0 -17 Z" fill="url(#tcPro)"/>`
    +`<path d="M-2.4 -15.5 C-3 -12 -3 -9 -2.2 -7 M2.4 -15.5 C3 -12 3 -9 2.2 -7" stroke="#3a1a06" stroke-width="1.5" fill="none" stroke-linecap="round"/><ellipse cx="0" cy="-18" rx="2.8" ry="2" fill="#5a2d10"/></g></g></g>`;
  const Wt=Math.ceil(Math.max(W,sx+sw+pad)), Ht=Math.ceil(Math.max(H,sy+sh+pad));
  return `<svg viewBox="0 0 ${Wt} ${Ht}" role="img" aria-label="지금 이대로도 괜찮아"><defs>`
    +`<pattern id="tcHatch" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="rotate(-56)">`
    +`<path d="M-2 2.5H8.5M11 2.5H16" stroke="#fff" stroke-opacity=".45" stroke-width="1.5" stroke-linecap="round"/>`
    +`<path d="M-2 6.5H4M6.5 6.5H16" stroke="#fff" stroke-opacity=".3" stroke-width="1.2" stroke-linecap="round"/>`
    +`<path d="M-2 10H12" stroke="#fff" stroke-opacity=".38" stroke-width="1.7" stroke-linecap="round"/>`
    +`<path d="M3 12.8H16" stroke="#000" stroke-opacity=".09" stroke-width="1.1" stroke-linecap="round"/></pattern>`
    +glyphs+`<mask id="tcPerf"><rect width="62" height="78" fill="#fff"/><g fill="#000">${perf}</g></mask>`
    +`<radialGradient id="tcWing" cx=".42" cy=".3" r=".8"><stop offset="0" stop-color="#c98a4b"/><stop offset=".55" stop-color="#8a4a1e"/><stop offset="1" stop-color="#4a220b"/></radialGradient>`
    +`<radialGradient id="tcPro" cx=".45" cy=".35" r=".75"><stop offset="0" stop-color="#e2b77c"/><stop offset="1" stop-color="#9a6630"/></radialGradient>`
    +`<linearGradient id="tcSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${TITLE_SKY}"/><stop offset="1" stop-color="#fff6d8"/></linearGradient>`
    +`</defs><g stroke-linejoin="round">${shadow}${white}${color}</g>${stamp}</svg>`;
}

const titleEl=$('#title');
let titleUp=false, titleT=0, titleStamped=false, titleSeen=false;
/** 시체를 다 눕히면 뜬다. 글자가 하나씩 톡톡 올라오고 우표가 탁 붙은 뒤, 3.4초가 지나거나 아무 데나 누르면 걷힌다 */
function showTitle(){
  titleEl.innerHTML=titleSvg(1+((Math.random()*2147483645)|0));
  titleEl.classList.remove('out'); titleEl.classList.add('show'); titleEl.setAttribute('aria-hidden','false');
  titleUp=true; titleT=0; titleStamped=false; titleSeen=true;
  AU.playJingle();
}
function hideTitle(now){
  if(!titleUp&&!now) return;
  const was=titleUp; titleUp=false; titleEl.setAttribute('aria-hidden','true');
  if(was||AU.jsrc){ AU.stopJingle(now?.05:.25); talkAfter=Math.max(talkAfter,clock+.35); }
  if(now){ AU.stopJingle(.05); titleEl.classList.remove('show','out'); titleEl.innerHTML=''; return; }
  titleEl.classList.add('out');
  setTimeout(()=>{ if(!titleUp){ titleEl.classList.remove('show','out'); titleEl.innerHTML=''; } },380);
  if(was&&hintDue) setTimeout(showDueHint,450);                // 카드가 걷히면 도구 안내
}
function updateTitle(dt){
  if(!titleUp) return; titleT+=dt;
  if(!titleStamped&&titleT>=1.15){ titleStamped=true; SND.stamp(); }      // 우표가 탁 붙는 소리
  if(titleT>=3.4) hideTitle();
}
titleEl.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); if(titleUp&&titleT>.5) hideTitle(); });   // 뜨자마자 누른 건 무시

// ───────── 들어올 때: 핀셋이 시체를 휴지 위에 내려놓는다 ─────────
let entering=null;
function startEntry(){ entering={t:0,landed:false,opened:false}; const T=TOOLS.tweezer; T.root.visible=true; T.grip=1; T.setGrip(1); AU.place(0); }
function updateEntry(dt){
  const e=entering; if(!e) return; e.t+=dt; const T=TOOLS.tweezer, g=corpse?.group;
  const DOWN=.5, OPEN=.62, AWAY=1.0;
  const k=sstep(0,DOWN,e.t);
  const hY=lerp(.85,0,k);
  if(g){ g.position.y=corpse.baseY+hY; const sw=(1-k); g.rotation.x=Math.sin(e.t*8)*.08*sw; g.rotation.z=Math.sin(e.t*6.3+1)*.1*sw; g.updateMatrixWorld(true); }
  if(!e.landed&&e.t>=DOWN){ e.landed=true; SND.place(); if(g){ g.rotation.x=g.rotation.z=0; g.position.y=corpse.baseY; } }
  if(!e.opened&&e.t>=OPEN){ e.opened=true; SND.release(); }
  const away=sstep(OPEN,AWAY,e.t);
  T.grip=e.t<OPEN?1:Math.max(0,1-(e.t-OPEN)*8); T.setGrip(T.grip);
  const yaw=Math.atan2(camera.position.x,camera.position.z)+.75;
  T.root.visible=true;                                     // 내려놓는 동안 도구를 바꿔도 핀셋은 끝까지 보인다
  T.root.position.set(away*.9,.035+hY+away*1.4,away*.4); T.root.rotation.set(-.62,yaw,0,'YXZ');
  if(e.t>=AWAY){ T.root.visible=tool==='tweezer'&&pen.shown; entering=null; hintDue=tool; if(!titleSeen) showTitle(); else showDueHint(); }   // 첫 입장만 제목 카드, 다음 시체부터는 내려놓고 바로 이어 간다
}

// ───────── 시점 ─────────
// 휴지 바깥을 한 손가락(마우스 왼쪽)으로 끌면 시체 둘레로 시점이 돌고, 두 손가락을 벌리거나 오므리면(PC는 휠) 다가가고 물러난다.
// 마우스 오른쪽 버튼으로 끌면 휴지 위에서도 돈다. 손을 떼면 바뿌볼 화면처럼 조금 미끄러지다 멈춘다.
const LOOK=new THREE.Vector3(0,.03,0);
const VIEW_EASE=5, VIEW_TURN=.9, PITCH_MIN=.42, PITCH_MAX=1.42, ZOOM_MAX=1.7;
const view={yaw:0,pitch:1.06,zoom:1,vy:0,vp:0,vz:0,homeR:5,homePitch:1.06,minZoom:.42,away:false};
const viewPtrs=new Map(); let pinchD=0, viewTouched=false;
const homeBtn=$('#viewHome');
function placeCamera(){
  const r=view.homeR*view.zoom, cp=Math.cos(view.pitch);
  camera.position.set(LOOK.x+Math.sin(view.yaw)*cp*r,LOOK.y+Math.sin(view.pitch)*r,LOOK.z+Math.cos(view.yaw)*cp*r);
  camera.lookAt(LOOK);
  const yw=Math.atan2(Math.sin(view.yaw),Math.cos(view.yaw));
  const away=Math.abs(yw)>.04||Math.abs(view.pitch-view.homePitch)>.04||Math.abs(Math.log(view.zoom))>.04;
  if(away!==view.away){ view.away=away; homeBtn.classList.toggle('show',away); }
}
function resetView(){ view.yaw=0; view.pitch=view.homePitch; view.zoom=1; view.vy=view.vp=view.vz=0; viewPtrs.clear(); pinchD=0; placeCamera(); }
function viewToHome(){ view.yaw=Math.atan2(Math.sin(view.yaw),Math.cos(view.yaw)); view.vy=-view.yaw; view.vp=view.homePitch-view.pitch; view.vz=-Math.log(view.zoom); }
function updateView(dt){
  if(Math.abs(view.vy)+Math.abs(view.vp)+Math.abs(view.vz)<1e-5) return;
  const k=1-Math.exp(-VIEW_EASE*dt);
  view.yaw+=view.vy*k; view.vy-=view.vy*k; view.pitch+=view.vp*k; view.vp-=view.vp*k; view.zoom*=Math.exp(view.vz*k); view.vz-=view.vz*k;
  if(view.pitch<PITCH_MIN||view.pitch>PITCH_MAX){ view.pitch=clamp(view.pitch,PITCH_MIN,PITCH_MAX); view.vp=0; }
  if(view.zoom<view.minZoom||view.zoom>ZOOM_MAX){ view.zoom=clamp(view.zoom,view.minZoom,ZOOM_MAX); view.vz=0; }
  placeCamera();
}
const ptrGap=()=>{ const [a,b]=[...viewPtrs.values()]; return Math.hypot(a.x-b.x,a.y-b.y); };
function viewDown(e){ viewPtrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); pinchD=viewPtrs.size===2?ptrGap():0; try{ canvas.setPointerCapture(e.pointerId); }catch(err){} viewTouched=true; hintEl.classList.remove('show'); }
function viewMove(e){
  const v=viewPtrs.get(e.pointerId); if(!v) return;
  const dx=e.clientX-v.x, dy=e.clientY-v.y; v.x=e.clientX; v.y=e.clientY;
  if(viewPtrs.size===1){ const H=Math.max(1,canvas.clientHeight); view.vy-=TAU*VIEW_TURN*dx/H; view.vp+=TAU*VIEW_TURN*dy/H; }
  else if(viewPtrs.size===2){ const d=ptrGap(); if(pinchD>1&&d>1) view.vz+=Math.log(pinchD/d); pinchD=d; }
}
function viewUp(id){ if(!viewPtrs.delete(id)) return false; pinchD=viewPtrs.size===2?ptrGap():0; return true; }
homeBtn.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); viewToHome(); });

// ───────── 입력 ─────────
function onDown(e){
  if(!started||paused||titleUp) return;
  e.preventDefault(); AU.ensure();
  viewUp(e.pointerId);
  if(e.button===2||e.button===1){ viewDown(e); return; }
  // 두 번째 손가락은 시점 (도구를 쥔 손가락과 같이 쓸 수 있다)
  if(pen.active||entering){ viewDown(e); return; }
  const p=pickSurface(e.clientX,e.clientY);
  if(!inWork(p)){ viewDown(e); return; }
  pen.active=true; pen.id=e.pointerId; pen.x=e.clientX; pen.y=e.clientY; pen.hover=false;
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  toolDown(p);
}
function onMove(e){
  if(viewPtrs.has(e.pointerId)){ e.preventDefault(); viewMove(e); return; }
  if(pen.active&&e.pointerId===pen.id){ e.preventDefault(); pen.x=e.clientX; pen.y=e.clientY; const p=pickSurface(e.clientX,e.clientY); if(p){ p.x=clamp(p.x,-GW/2+.1,GW/2-.1); p.z=clamp(p.z,-GW/2+.1,GW/2-.1); toolMove(p); } return; }
  // 마우스는 누르지 않아도 도구가 따라다닌다
  if(e.pointerType==='mouse'&&!pen.active&&started&&!paused&&!entering){ const p=pickSurface(e.clientX,e.clientY); if(inWork(p)){ if(!pen.shown){ cur.copy(p); cur.y+=.2; } pen.shown=true; pen.hover=true; target.copy(p); } }
}
function onUp(e){
  if(viewUp(e.pointerId)){ try{ if(canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId); }catch(err){} return; }
  if(pen.active&&e.pointerId===pen.id){ pen.active=false; pen.id=null; toolUp(); try{ if(canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId); }catch(err){} }
}
function onWheel(e){ if(!started||paused) return; e.preventDefault(); const d=e.deltaY*(e.deltaMode===1?33:e.deltaMode===2?400:1); view.vz+=clamp(d*.0012,-.35,.35); }
function cancelAll(){ if(pen.active){ pen.active=false; pen.id=null; toolUp(); } pen.down=false; pen.vel.set(0,0,0); TOOLS.swab.absorb=0; viewPtrs.clear(); pinchD=0; AU.silence(); }
canvas.addEventListener('pointerdown',onDown,{passive:false});
canvas.addEventListener('pointermove',onMove,{passive:false});
window.addEventListener('pointerup',onUp); window.addEventListener('pointercancel',onUp);
canvas.addEventListener('lostpointercapture',onUp);
canvas.addEventListener('wheel',onWheel,{passive:false});
canvas.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse'&&!pen.active){ pen.hover=false; } });
canvas.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('blur',()=>{ cancelAll(); resetTalk(); });
window.addEventListener('keydown',e=>{
  if(e.code==='Escape'){ e.preventDefault(); if(EMBEDDED) parent.postMessage({type:'care-room-close'},location.origin); return; }
  const map={Digit1:'swab',Digit2:'ointment',Digit3:'brush',Digit4:'tweezer'}; if(map[e.code]){ e.preventDefault(); setTool(map[e.code]); }
});

// ───────── 번째 ─────────
// 간병한 횟수는 이 화면이 직접 센다. 저장 이름은 tally.js 방식(roach_tally_…)에 맞춰 두어, 나중에 처치 수 밑에 「간병 N마리」를 붙일 때 그대로 이어진다
const CARE_KEY='roach_tally_care';
function addCareCount(){ try{ const v=Math.max(0,parseInt(localStorage.getItem(CARE_KEY)||'0',10)||0)+1; localStorage.setItem(CARE_KEY,String(v)); return v; }catch(e){ return 0; } }
const ordEl=$('#ordinal');
function showOrdinal(n){ ordEl.textContent=n>0?`${n}번째 간병`:''; ordEl.classList.toggle('show',n>0); }

// ───────── 프레임 ─────────
let started=false, paused=true, pageHidden=document.hidden, rafId=0, last=performance.now()/1000, viewHintT=0;
function frame(){
  rafId=requestAnimationFrame(frame);
  const t=performance.now()/1000, dt=Math.min(.05,Math.max(.001,t-last)); last=t;
  if(pageHidden||paused) return;
  step(dt);
  renderer.render(scene,camera);
  drawSay();
}
function step(dt){
  updateView(dt);
  updateTalk(dt);
  updateTitle(dt);
  tickSay(dt);
  if(entering) updateEntry(dt);
  placeTools(dt);
  const speed=pen.vel.length();
  if(tool==='swab') updateSwab(dt,speed); else { AU.level('swab',0); AU.level('wick',0); }
  if(tool==='brush'&&pen.shown) updateBrush(dt,speed); else AU.level('brush',0);
  if(tool!=='swab'&&!(tool==='brush'&&pen.shown)) AU.level('smear',0);
  if(pen.shown&&!entering){ _v.copy(cur).project(camera); AU.place(clamp(_v.x*.95,-.92,.92)); }      // 도구 소리는 도구가 있는 쪽 귀에서
  if(tool==='ointment') updateSqueeze(dt);
  if(tool==='tweezer') updateHeld(dt);
  updateFalling(dt);
  if(settle>0&&!squeezeLine&&settleRect){ settle-=dt; slump(...settleRect,1); }
  flushBase(); flushOint(); resettleLegs();
  tFlushT-=dt; if(tDirty&&tFlushT<=0){ tTex.needsUpdate=true; tDirty=false; tFlushT=.08; }
  if(started&&!viewTouched&&!hintSeen.view){ viewHintT+=dt; if(viewHintT>14&&!hintEl.classList.contains('show')) showHint('view',4.5); }
}
function resize(){
  const w=Math.max(1,innerWidth), h=Math.max(1,innerHeight), dpr=Math.min(devicePixelRatio||1,1.5);
  renderer.setPixelRatio(dpr); renderer.setSize(w,h,false);
  camera.aspect=w/h; const portrait=h>=w; camera.fov=portrait?40:32;
  const half=camera.fov*Math.PI/360, tH=Math.tan(half);
  // 처음 구도: 세로 화면은 휴지 폭이 거의 꽉 차게(시체가 크게), 가로 화면은 휴지 높이가 들어오게. 위에서 비스듬히 내려다본다
  const dW=(TISSUE+.3)/(2*tH*camera.aspect), dH=(TISSUE+.75)/(2*tH);
  view.homeR=Math.max(dW,dH);
  view.minZoom=.42;
  camera.updateProjectionMatrix(); placeCamera(); sizeSay();
}
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{ pageHidden=document.hidden; last=performance.now()/1000; if(pageHidden){ cancelAll(); hideTitle(true); resetTalk(); } });

// ───────── 바깥(index.html)에서 쓰는 API ─────────
function clearScene(){
  cancelAll(); held=null; squeezeLine=null; settle=0; settleRect=null;
  th.fill(0); clearCorpse(); paintTissue();
  const sw=TOOLS.swab; sw.soak=sw.cream=sw.absorb=0; sw._s=-1; const br=TOOLS.brush; br.stain=br.cream=0; br._k=-1; br.bend.set(0,0,0); br.bendV.set(0,0,0); TOOLS.ointment.used=0; TOOLS.ointment.nextFlex=rand(.10,.18); TOOLS.ointment._k=-1; shapeTube(TOOLS.ointment);
  resetTalk();
}
/** 시체 하나를 받아 휴지 위에 눕힌다. payload: {corpse, sfx} */
function enter(payload={}){
  hideTitle(true);
  if(payload.sfx) AU.use(payload.sfx);
  clearScene();
  if(payload.corpse){ try{ buildCorpse(payload.corpse); }catch(err){ console.error(err); showErr('시체 모양을 불러오지 못했습니다.'); } }
  // 진물이 닿아 있던 자리는 휴지에 젖어 배어 있다
  if(corpse?.gooS){ const S=corpse.gooS; for(let i=0;i<S.wx.length;i+=6){ if(S.wy[i]<TISSUE_Y+.014) stain(S.wx[i],S.wz[i],rand(.04,.08),'210,191,146',.05); } }
  rasterBase(); rebuildOintAll();
  showOrdinal(addCareCount());
  newSessionLines();
  if(!started) setTool(tool,true);
  started=true; paused=false;
  resetView(); pen.shown=false; for(const n in TOOLS) TOOLS[n].root.visible=false;
  loadVoice();
  startEntry();
  wake();
  return api;
}
function sleep(){ paused=true; hideTitle(true); cancelAll(); resetTalk(); if(rafId){ cancelAnimationFrame(rafId); rafId=0; } return api; }
function wake(){ resetTalk(); paused=false; pageHidden=document.hidden; last=performance.now()/1000; resize(); if(!rafId) rafId=requestAnimationFrame(frame); if(hintDue) setTimeout(showDueHint,500); return api; }
function reset(){ clearScene(); started=false; paused=true; return api; }
const api={enter,sleep,wake,reset,

  _debug:{step(n=1,dt=1/60){ for(let i=0;i<n;i++) step(dt); },render(){ renderer.render(scene,camera); drawSay(); },stopLoop(){ if(rafId){ cancelAnimationFrame(rafId); rafId=0; } },
    get corpse(){ return corpse; },get pen(){ return pen; },get view(){ return view; },get state(){ return {started,paused,entering:!!entering,talkLeft:+talkLeft.toFixed(2),lastAct:+(clock-lastAct).toFixed(2),raf:!!rafId,tool,hintDue,titleUp}; },tools:TOOLS,SND,lines:LINES,sfxData:()=>SFXDATA,sfxBuildMs(){ const t=performance.now(); sfxBuilder(); return performance.now()-t; },setTool,toolDown,toolMove,toolUp,pickSurface,say,bubble,th,base,paperY,surfY,camera,scene,AU,VO,loadVoice,
    press(x,y){ onDown({pointerId:91,clientX:x,clientY:y,button:0,pointerType:'touch',preventDefault(){}}); },move(x,y){ onMove({pointerId:91,clientX:x,clientY:y,pointerType:'touch',preventDefault(){}}); },release(){ onUp({pointerId:91,type:'pointerup'}); }}};
window.CareRoom=api;

loadVoice();
if(document.fonts?.load) document.fonts.load('700 20px Gaegu').catch(()=>{});
rafId=requestAnimationFrame(frame);
if(EMBEDDED&&window.parent!==window) parent.postMessage({type:'care-room-ready'},location.origin);
else setTimeout(()=>{ if(!started) showErr('게임에서 구급상자로 바퀴벌레 시체를 집어 와야 열리는 화면입니다.'); },1500);
