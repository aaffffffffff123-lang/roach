<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>바멍</title>
<meta property="og:type" content="website">
<meta property="og:title" content="바퀴벌레와 친해지기">
<meta property="og:image" content="https://aaffffffffff123-lang.github.io/roach/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Noto+Sans+KR:wght@500;700;800&display=swap">
<style>
*{box-sizing:border-box}
:root{--iv:rgba(248,240,220,.95);--ink:#302017;--brown:#8a6a4a;--edge:rgba(114,76,43,.7);--sh:0 2px 0 var(--edge),0 7px 20px rgba(0,0,0,.26);--ui:900 13px/1 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--kr:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9dcc5;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:var(--ui);color:var(--ink);border:0;margin:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer}
button:disabled{opacity:.42;cursor:default}
#err{position:fixed;z-index:30;inset:auto 16px calc(18px + var(--sb));display:none;padding:12px 15px;border-radius:14px;background:rgba(83,25,18,.94);color:#f8f0dc;font:700 13px/1.5 var(--kr);text-align:center}
#err.show{display:block}

/* 위쪽 */
#hud{position:fixed;z-index:4;left:72px;right:72px;top:calc(16px + var(--st));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;transition:opacity .4s}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:999px;background:var(--iv);box-shadow:var(--sh);font:900 12px/1 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);white-space:nowrap}
#hud button.pill{pointer-events:auto;display:none}
#hud button.pill.show{display:inline-flex}
#hud button.pill:active{transform:translateY(2px)}
#follow i{font-style:normal;opacity:.55;margin-left:2px}
#homeLink{position:fixed;z-index:6;left:calc(12px + var(--sl));top:calc(12px + var(--st));height:44px;padding:0 15px;border-radius:999px;background:var(--iv);box-shadow:var(--sh);font:var(--ui);color:var(--ink);text-decoration:none;display:none;align-items:center}
body.solo #homeLink{display:inline-flex}

/* 아래 버튼 */
.dock{position:fixed;z-index:5;left:50%;bottom:calc(14px + var(--sb));transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:24px;background:rgba(255,250,238,.86);box-shadow:0 2px 0 rgba(114,76,43,.42),0 10px 26px rgba(60,35,10,.2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .4s,transform .4s}
.dock button{width:66px;height:54px;border-radius:18px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:800 12px/1 var(--kr);letter-spacing:-.02em}
.dock button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dock button:active{background:rgba(48,32,23,.08)}
.dock button.on{background:var(--ink);color:#f8f0dc}
.dock button.main{background:#f7a93b;color:#fff;box-shadow:0 3px 0 #cf7f16}
.dock button.main:active{transform:translateY(2px);box-shadow:0 1px 0 #cf7f16}
.dock button.warn{color:#c2412d}
#editBar{display:none}
body.edit #bar{display:none}
body.edit #editBar{display:flex}
body.calm #hud,body.calm #bar{opacity:0;pointer-events:none}
body.calm #bar{transform:translate(-50%,18px)}
body.deco #bar,body.deco #hud,body.deco #editBar{display:none}
body.shot #bar,body.shot #hud,body.shot #labels,body.deco #labels,body.deco #talk{visibility:hidden}

/* 이름표 */
#vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 75% 62% at 50% 46%,rgba(0,0,0,0) 55%,rgba(70,40,15,.16) 100%)}
#labels{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
#talk{position:fixed;inset:0;z-index:2;display:block;width:100%;height:100%;pointer-events:none}
.lb{position:absolute;left:0;top:0;padding:6px 8px;white-space:nowrap;font:800 13px/1.15 var(--kr);color:#fff;letter-spacing:-.01em;text-shadow:0 0 2px #24160c,0 0 3px #24160c,1px 1px 0 #24160c,-1px -1px 0 #24160c,1px -1px 0 #24160c,-1px 1px 0 #24160c,0 1px 0 #24160c,0 -1px 0 #24160c;opacity:0;transition:opacity .25s;pointer-events:none;will-change:transform}
.lb.show{opacity:1;pointer-events:auto;cursor:pointer}
.lb.dead{color:#e6ddd0}
.lb.soft{color:#fff3d6;font-weight:700}
.lb.me{color:#ffe08a}

/* 아래에서 올라오는 판 */
.sheet{position:fixed;z-index:8;left:50%;bottom:0;width:min(560px,100%);transform:translate(-50%,108%);transition:transform .32s cubic-bezier(.2,.9,.3,1),visibility 0s linear .32s;visibility:hidden;background:#fffaf0;border-radius:24px 24px 0 0;box-shadow:0 -6px 30px rgba(70,40,10,.22);padding:16px 16px calc(16px + var(--sb));max-height:72vh;overflow:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.sheet.open{transform:translate(-50%,0);visibility:visible;transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.sheet .head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sheet h3{margin:4px 0 0;font:800 17px/1.2 var(--kr);color:var(--ink)}
.x{flex:none;height:34px;padding:0 13px;border-radius:999px;background:rgba(48,32,23,.07);font:800 12px/1 var(--kr)}
.cat{margin:16px 2px 8px;font:800 12px/1 var(--kr);color:var(--brown)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{position:relative;display:inline-flex;align-items:center;height:40px;padding:0 13px;border-radius:14px;background:#f4e9d3;box-shadow:0 2px 0 rgba(150,110,60,.32);font:800 13px/1 var(--kr);color:var(--ink)}
.chip:active{transform:translateY(2px);box-shadow:0 0 0 rgba(150,110,60,.32)}
.chip .n{margin-left:7px;font-size:11px;font-weight:700;color:var(--brown)}
.chip.has{background:#e3f1e9;box-shadow:0 2px 0 rgba(70,130,100,.32)}
.tip{margin:16px 2px 2px;font:700 12px/1.55 var(--kr);color:#9a8064;word-break:keep-all}
#card .nm{font:700 32px/1.05 "Gaegu","Noto Sans KR",cursive;color:#3a2516;word-break:break-all}
#card .sub{margin-top:7px;font:700 13px/1.45 var(--kr);color:var(--brown);word-break:keep-all}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.act{flex:1 1 0;min-width:86px;height:48px;border-radius:16px;background:#f4e9d3;box-shadow:0 2px 0 rgba(150,110,60,.32);font:800 13px/1 var(--kr);color:var(--ink)}
.act:active{transform:translateY(2px);box-shadow:0 0 0 rgba(150,110,60,.32)}
.act.main{background:#f7a93b;color:#fff;box-shadow:0 3px 0 #cf7f16}
.act.calm{background:#ece4f4;box-shadow:0 2px 0 rgba(110,90,140,.32)}
.field{width:100%;height:50px;margin-top:14px;padding:0 15px;border:2px solid #ead9bb;border-radius:15px;background:#fff;font:700 18px/1 var(--kr);color:var(--ink);outline:none;-webkit-user-select:text;user-select:text}
.field:focus{border-color:#f7a93b}
.names{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}

/* 꾸미기 판 */
#deco{position:fixed;z-index:7;left:50%;bottom:0;width:min(560px,100%);transform:translate(-50%,110%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.9,.3,1),visibility 0s linear .32s;background:#fffaf0;border-radius:24px 24px 0 0;box-shadow:0 -6px 30px rgba(70,40,10,.22);padding:12px 12px calc(12px + var(--sb))}
body.deco #deco{transform:translate(-50%,0);visibility:visible;transition:transform .32s cubic-bezier(.2,.9,.3,1)}
#deco .top{display:flex;align-items:center;gap:7px}
#deco .who{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:800 14px/1 var(--kr);color:var(--ink);padding-left:4px}
#deco .top button{height:38px;padding:0 13px;border-radius:13px;background:#f4e9d3;box-shadow:0 2px 0 rgba(150,110,60,.32);font:800 12.5px/1 var(--kr)}
#deco .top button.main{background:#f7a93b;color:#fff;box-shadow:0 3px 0 #cf7f16}
.tabs{display:flex;gap:4px;margin:11px 0 9px;padding:4px;border-radius:15px;background:#f1e5cd}
.tabs button{flex:1 1 0;height:36px;border-radius:12px;background:transparent;font:800 12.5px/1 var(--kr);color:#6d5236}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 0 rgba(150,110,60,.35)}
#decoBody{min-height:132px}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw button{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.75),0 1px 3px rgba(60,35,10,.35)}
.sw button.on{box-shadow:inset 0 0 0 2px #fff,0 0 0 3px var(--ink)}
.opt{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.opt button{height:34px;padding:0 12px;border-radius:12px;background:#f4e9d3;font:800 12px/1 var(--kr);color:var(--ink)}
.opt button.on{background:var(--ink);color:#f8f0dc}
.thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.thumbs button{aspect-ratio:1;border-radius:14px;background:#f4e9d3;padding:5px}
.thumbs button img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.thumbs button.on{background:#fff;box-shadow:0 0 0 3px var(--ink)}
.lbl{margin:2px 2px 7px;font:800 11.5px/1 var(--kr);color:var(--brown)}
.hint{margin:10px 2px 0;font:700 12px/1.4 var(--kr);color:#9a8064;word-break:keep-all}
.line{display:flex;gap:8px;align-items:center}
.line .field{margin-top:0;flex:1 1 auto;height:42px;font-size:16px}
.line button{flex:none;height:42px;padding:0 15px;border-radius:13px;background:#f7a93b;color:#fff;font:800 13px/1 var(--kr);box-shadow:0 3px 0 #cf7f16}

/* 알림 · 빈 테라리움 · 사진 */
#toast{position:fixed;z-index:12;left:50%;top:calc(62px + var(--st));transform:translate(-50%,-6px);max-width:min(86vw,520px);padding:10px 15px;border-radius:999px;background:rgba(32,22,15,.86);color:#f8f0dc;font:800 13px/1.35 var(--kr);text-align:center;word-break:keep-all;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#empty{position:fixed;z-index:2;left:50%;top:30%;transform:translate(-50%,-50%);width:min(300px,82vw);padding:16px 18px 15px;border-radius:20px;background:rgba(255,250,238,.92);box-shadow:var(--sh);text-align:center;font:800 15px/1.45 var(--kr);color:var(--ink);word-break:keep-all;display:none;pointer-events:none}
#empty small{display:block;margin-top:5px;font-weight:700;font-size:12.5px;color:var(--brown)}
#empty.show{display:block}
body.deco #empty,body.edit #empty{display:none}
#photo{position:fixed;z-index:20;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px 16px calc(20px + var(--sb));background:rgba(40,26,14,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#photo.show{display:flex}
#photo img{display:block;max-width:min(420px,100%);max-height:calc(100% - 90px);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.4);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;pointer-events:auto}
#photo .row{margin:0;width:min(420px,100%)}
#flash{position:fixed;inset:0;z-index:19;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
@media (min-width:700px){ .dock button{width:74px} }
@media (orientation:landscape) and (max-height:520px){
  .dock{left:auto;right:calc(10px + var(--sr));top:50%;bottom:auto;transform:translateY(-50%);flex-direction:column}
  .dock button{width:62px;height:50px}
  body.calm #bar{transform:translate(18px,-50%)}
  #hud{left:90px;right:150px}
  #deco{left:auto;right:0;top:0;bottom:0;width:min(400px,50vw);transform:translateX(110%);border-radius:24px 0 0 24px;padding:calc(12px + var(--st)) calc(12px + var(--sr)) 12px 12px;overflow:auto}
  body.deco #deco{transform:translateX(0)}
  .thumbs{grid-template-columns:repeat(6,1fr)}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="labels" aria-hidden="true"></div>
<canvas id="talk" aria-hidden="true"></canvas>
<div id="hud">
  <div id="count" class="pill">바퀴 0마리</div>
  <button id="follow" class="pill" type="button"></button>
  <button id="viewHome" class="pill" type="button">시점 원위치</button>
</div>
<div id="empty"></div>
<a id="homeLink" href="./">게임으로</a>

<div id="bar" class="dock">
  <button type="button" data-a="props"><svg viewBox="0 0 24 24"><path d="M3.5 8 12 4l8.5 4v8.5L12 20.5 3.5 16.5z"/><path d="m3.5 8 8.5 4 8.5-4M12 12v8.5"/></svg>소품</button>
  <button type="button" data-a="deco"><svg viewBox="0 0 24 24"><path d="M12 3.5l1.9 4.7 4.8 1.7-4.8 1.6L12 16.3l-1.9-4.8-4.8-1.6 4.8-1.7z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>꾸미기</button>
  <button type="button" data-a="names"><svg viewBox="0 0 24 24"><path d="M3.5 12.2V5.5a2 2 0 0 1 2-2h6.7l8.3 8.3-8.7 8.7z"/><circle cx="8.3" cy="8.3" r="1.5"/></svg>이름</button>
  <button type="button" data-a="photo"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M8.5 7l1.4-2.6h4.2L15.5 7"/><circle cx="12" cy="13.5" r="3.4"/></svg>사진</button>
</div>
<div id="editBar" class="dock">
  <button type="button" data-a="rotate"><svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.6 4.2v4.6H15"/></svg>돌리기</button>
  <button type="button" data-a="remove" class="warn"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4.8h4V7M7 7l.8 12.5h8.4L17 7"/></svg>치우기</button>
  <button type="button" data-a="done" class="main"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>다 됐어요</button>
</div>

<div id="sheet" class="sheet" aria-hidden="true">
  <div class="head"><h3>소품</h3><button class="x" type="button" data-a="close">닫기</button></div>
  <div id="propList"></div>
  <p class="tip">놓아 둔 소품을 길게 누르면 옮기거나 치울 수 있어요.</p>
</div>
<div id="card" class="sheet" aria-hidden="true"></div>

<div id="deco" aria-hidden="true">
  <div class="top"><div class="who" id="decoWho"></div><button type="button" data-a="undo">되돌리기</button><button type="button" data-a="decoDone" class="main">다 됐어요</button></div>
  <div class="tabs" id="decoTabs">
    <button type="button" data-t="polish" class="on">매니큐어</button><button type="button" data-t="sticker">스티커</button><button type="button" data-t="gem">보석</button><button type="button" data-t="hat">모자</button><button type="button" data-t="text">글씨</button>
  </div>
  <div id="decoBody"></div>
</div>

<div id="toast" role="status"></div>
<div id="flash"></div>
<div id="photo" aria-hidden="true">
  <img id="photoImg" alt="테라리움 사진">
  <div class="row"><button type="button" class="act main" data-a="photoSave">저장하기</button><button type="button" class="act" data-a="photoClose">닫기</button></div>
</div>
<div id="err" role="alert"></div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { applyDeco, worldHitToBody, ROACH_L, POLISH_COLORS, POLISH_STYLES, STICKERS, stickerCanvas, GEMS, HAT_COLORS, hatMesh, bowMesh } from './bamung-roach.js';
import { PROPS, PROP_CATS, makePoke, animatePoke } from './bamung-props.js';
import { World, Pet, TANK } from './bamung-life.js';
import { BubbleView, layoutBubbles, drawBubbles } from './talk-bubble.js';
import { TALKS } from './bamung-talk.js';

// ══════════════════════════════════════════════════════════════════
// 바멍 — 1라운드에서 「컵」으로 데려온 바퀴들이 사는 테라리움
// 구경하고(바멍), 꾸며 주고, 소품을 놓아 준다. 한 달쯤 살다 늙어 죽으면 묻어 준다.
// 기록은 이 기기(localStorage)에 남는다.
// ══════════════════════════════════════════════════════════════════
const QS=new URLSearchParams(location.search);
const EMBED=QS.has('embed')&&window.parent!==window;
const KEY='roach_pets_v1', CAP=30, DAY=86400000, NAME_MAX=8, PROP_TOTAL=14;
const PI=Math.PI, TAU=PI*2;
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const damp=(a,b,r,dt)=>lerp(a,b,1-Math.exp(-r*dt));
const wrapA=a=>((a+PI)%TAU+TAU)%TAU-PI;
const $=id=>document.getElementById(id);
const r4=v=>Math.round(v*1e4)/1e4;
const UP=new THREE.Vector3(0,1,0);
const DESK_Y=-0.042;
if(!EMBED) document.body.classList.add('solo');

/** 받침: 이름 끝 글자에 받침이 있으면 앞, 없으면 뒤 ('을/를', '이/가', '와/과', '은/는') */
function jo(word,pair){ const [a,b]=pair.split('/'); const ch=String(word).trim().slice(-1); const c=ch.charCodeAt(0); if(c>=0xAC00&&c<=0xD7A3) return ((c-0xAC00)%28)?a:b; if(/[0-9]/.test(ch)) return '013678'.includes(ch)?a:b; return b; }
function cleanName(s){ const t=Array.from(String(s||'').replace(/\s+/g,' ').trim()); return t.slice(0,NAME_MAX).join(''); }
const showError=t=>{ const e=$('err'); e.textContent=t; e.classList.add('show'); };

// ══════════════════════════════════════════════════════════════════
// 저장
// ══════════════════════════════════════════════════════════════════
function loadStore(){
  let d=null; try{ d=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  if(!d||typeof d!=='object') d={};
  const S={v:1,nextNo:Math.max(1,d.nextNo|0),pets:[],graves:[],props:null,fallen:[]};
  for(const p of Array.isArray(d.pets)?d.pets:[]){ if(!p||!p.id||!(p.born>0)) continue; if(!p.deco||typeof p.deco!=='object') p.deco={}; p.life=+p.life||30; if(!(p.no>0)) p.no=S.nextNo++; S.pets.push(p); }
  for(const g of Array.isArray(d.graves)?d.graves:[]) if(g&&g.name) S.graves.push(g);
  if(Array.isArray(d.props)) S.props=d.props.filter(p=>p&&PROPS[p.k]&&isFinite(p.x)&&isFinite(p.z));
  for(const f of Array.isArray(d.fallen)?d.fallen:[]) if(f&&f.petId) S.fallen.push(f);
  for(const p of S.pets) S.nextNo=Math.max(S.nextNo,(p.no|0)+1);
  for(const g of S.graves) S.nextNo=Math.max(S.nextNo,(g.no|0)+1);
  return S;
}
let store=loadStore();
let saveIn=0;
function save(){ saveIn=0; try{ syncStore(); localStorage.setItem(KEY,JSON.stringify(store)); }catch(e){} }

function sandTex(){ const W=600,H=875; return ctex(W,H,(g)=>{
  g.fillStyle='#e8d5ae'; g.fillRect(0,0,W,H);
  for(let i=0;i<70;i++){ const x=Math.random()*W,y=Math.random()*H,r=30+Math.random()*110; const gr=g.createRadialGradient(x,y,0,x,y,r); const light=Math.random()<0.7; gr.addColorStop(0,light?'rgba(255,248,230,.2)':'rgba(176,138,90,.05)'); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(x-r,y-r,2*r,2*r); }
  for(let i=0;i<11000;i++){ const v=Math.random(); g.fillStyle=v<0.5?`rgba(150,115,70,${0.12+Math.random()*0.22})`:v<0.86?`rgba(255,250,236,${0.18+Math.random()*0.3})`:`rgba(110,85,55,${0.18+Math.random()*0.28})`; const s=0.8+Math.random()*1.7; g.fillRect(Math.random()*W,Math.random()*H,s,s); }
  // 벽을 따라 자갈
  for(let i=0;i<44;i++){ const side=i%4, t=Math.random(), m=7+Math.random()*24; let x,y; if(side===0){x=m;y=t*H;} else if(side===1){x=W-m;y=t*H;} else if(side===2){x=t*W;y=m;} else {x=t*W;y=H-m;}
    const rx=4+Math.random()*9, ry=rx*(0.6+Math.random()*0.3), a=Math.random()*PI; g.save(); g.translate(x,y); g.rotate(a);
    g.fillStyle='rgba(80,60,40,.22)'; g.beginPath(); g.ellipse(1.5,2,rx,ry,0,0,TAU); g.fill();
    const c=[[198,186,170],[170,160,150],[214,200,178],[150,135,120],[226,214,196],[190,168,140]][Math.floor(Math.random()*6)];
    const gr=g.createRadialGradient(-rx*0.3,-ry*0.4,0,0,0,rx); gr.addColorStop(0,`rgb(${c[0]+28},${c[1]+28},${c[2]+28})`); gr.addColorStop(1,`rgb(${c[0]-22},${c[1]-22},${c[2]-22})`); g.fillStyle=gr; g.beginPath(); g.ellipse(0,0,rx,ry,0,0,TAU); g.fill(); g.restore(); }
  // 구석 이끼
  for(const [cx,cy] of [[W*0.1,H*0.07],[W*0.9,H*0.94]]){ for(let i=0;i<80;i++){ const a=Math.random()*TAU, r=Math.random()*62; const x=cx+Math.cos(a)*r*1.3, y=cy+Math.sin(a)*r; const s=5+Math.random()*10; const gr=g.createRadialGradient(x-2,y-2,0,x,y,s); gr.addColorStop(0,`rgba(${120+Math.random()*40|0},${160+Math.random()*30|0},${70+Math.random()*30|0},.95)`); gr.addColorStop(1,'rgba(70,100,40,0)'); g.fillStyle=gr; g.beginPath(); g.arc(x,y,s,0,TAU); g.fill(); } }
  grain(g,W,H,12);
}); }

function buildTank(){

  const floor=mesh(new THREE.PlaneGeometry(W,D),std('#ffffff',{map:sandTex(),roughness:0.93}),0,0,0,tankRoot,false); floor.rotation.x=-PI/2;
  const frameM=phys('#1d1c20',{roughness:0.38,clearcoat:0.7,clearcoatRoughness:0.3});
  const ring=(ow,od,iw,id,h,y)=>{ const s=new THREE.Shape(); roundRect(s,ow,od,0.014); const hole=new THREE.Path(); roundRect(hole,iw,id,0.004); s.holes.push(hole); const g=new THREE.ExtrudeGeometry(s,{depth:h,bevelEnabled:true,bevelThickness:0.002,bevelSize:0.002,bevelSegments:2,curveSegments:4}); g.rotateX(-PI/2); return mesh(g,frameM,0,y,0,tankRoot); };
  ring(W+0.052,D+0.052,W-0.002,D-0.002,0.012-DESK_Y,DESK_Y+0.001);
  ring(W+0.04,D+0.04,W+0.003,D+0.003,0.026,H-0.02).castShadow=false;
  mesh(new THREE.BoxGeometry(W+0.01,0.03,D+0.01),frameM,0,DESK_Y+0.016,0,tankRoot,false);
  const glassM=new THREE.MeshPhysicalMaterial({color:'#f3fbf8',metalness:0,roughness:0.035,transparent:true,opacity:0.1,envMapIntensity:1.25,side:THREE.DoubleSide,depthWrite:false});
  for(const [pw,x,z,ry] of [[W,0,D/2+T/2,0],[W,0,-D/2-T/2,PI],[D,W/2+T/2,0,PI/2],[D,-W/2-T/2,0,-PI/2]]){ const m=mesh(new THREE.PlaneGeometry(pw,H-0.01),glassM,x,H/2,z,tankRoot,false); m.rotation.y=ry; m.receiveShadow=false; m.renderOrder=2; }
  const edgeM=new THREE.MeshPhysicalMaterial({color:'#bfe3d6',transparent:true,opacity:0.5,roughness:0.12,depthWrite:false});
  for(const sx of [-1,1]) for(const sz of [-1,1]){ const m=mesh(new THREE.BoxGeometry(0.008,H-0.02,0.008),edgeM,sx*(W/2+T/2),H/2,sz*(D/2+T/2),tankRoot,false); m.renderOrder=2; }
  const smear=new THREE.MeshPhysicalMaterial({map:smearTex(),color:'#fffaf0',transparent:true,opacity:0.6,roughness:0.22,clearcoat:0.6,depthWrite:false,side:THREE.DoubleSide});
  const bh=0.075, by=TANK.band+bh/2-0.004;
  for(const [pw,x,z,ry] of [[W,0,D/2-0.0015,0],[W,0,-D/2+0.0015,PI],[D,W/2-0.0015,0,PI/2],[D,-W/2+0.0015,0,-PI/2]]){ const m=mesh(new THREE.PlaneGeometry(pw,bh),smear,x,by,z,tankRoot,false); m.rotation.y=ry; m.renderOrder=3; }
}

  for(const f of inst.foot){ const cx=x+f.x*c+f.z*s, cz=z-f.x*s+f.z*c; out.push(f.r!==undefined?{c:1,x:cx,z:cz,r:f.r}:{c:0,x:cx,z:cz,hw:f.hw,hd:f.hd,cs:c,sn:s}); }
  return out;
}
function rectCorners(a,inf=0){ const ux=a.cs, uz=-a.sn, vx=a.sn, vz=a.cs, w=a.hw+inf, d=a.hd+inf; return [[a.x+ux*w+vx*d,a.z+uz*w+vz*d],[a.x-ux*w+vx*d,a.z-uz*w+vz*d],[a.x-ux*w-vx*d,a.z-uz*w-vz*d],[a.x+ux*w-vx*d,a.z+uz*w-vz*d]]; }
function shapeInTank(a,m){ if(a.c) return Math.abs(a.x)+a.r<=TANK.hw-m&&Math.abs(a.z)+a.r<=TANK.hd-m; for(const [x,z] of rectCorners(a)) if(Math.abs(x)>TANK.hw-m||Math.abs(z)>TANK.hd-m) return false; return true; }
function rectPoint(a,x,z){ const dx=x-a.x, dz=z-a.z; return [dx*a.cs-dz*a.sn, dx*a.sn+dz*a.cs]; }
function shapesHit(a,b,gap){
  if(a.c&&b.c) return Math.hypot(a.x-b.x,a.z-b.z)<a.r+b.r+gap;
  if(a.c!==b.c){ const C=a.c?a:b, R=a.c?b:a; const [lx,lz]=rectPoint(R,C.x,C.z); const qx=clamp(lx,-R.hw,R.hw), qz=clamp(lz,-R.hd,R.hd); return Math.hypot(lx-qx,lz-qz)<C.r+gap; }
  const A=rectCorners(a,gap/2), B=rectCorners(b,gap/2);
  for(const P of [A,B]) for(let i=0;i<4;i++){ const p0=P[i], p1=P[(i+1)%4]; const nx=-(p1[1]-p0[1]), nz=p1[0]-p0[0]; let amin=1e9,amax=-1e9,bmin=1e9,bmax=-1e9; for(const q of A){ const v=q[0]*nx+q[1]*nz; amin=Math.min(amin,v); amax=Math.max(amax,v); } for(const q of B){ const v=q[0]*nx+q[1]*nz; bmin=Math.min(bmin,v); bmax=Math.max(bmax,v); } if(amax<bmin||bmax<amin) return false; }
  return true;
}
function shapePoint(a,x,z,inf){ if(a.c) return Math.hypot(x-a.x,z-a.z)<a.r+inf; const [lx,lz]=rectPoint(a,x,z); return Math.abs(lx)<a.hw+inf&&Math.abs(lz)<a.hd+inf; }
/** 바퀴가 소품을 쓰려고 서는 자리들 (입구·승강장·먹는 자리) */
function useLocal(inst){ const pts=[]; for(const s of inst.slots){ if(s.second) continue;
  if(s.type==='hide') pts.push([s.entry.x,s.entry.z]);
  else if(s.type==='path'){ pts.push([s.pts[0][0],s.pts[0][2]]); if(s.mode==='oneway'){ const L=s.pts[s.pts.length-1]; pts.push([L[0],L[2]]); } }
  else if(s.type==='cabin') pts.push([s.board.x,s.board.z]);
  else if(s.approach) pts.push([s.approach.x,s.approach.z]);
  else if(s.x!==undefined) pts.push([s.x,s.z]); }
  return pts; }
function usePoints(inst,x,z,rot){ const c=Math.cos(rot), s=Math.sin(rot); return inst.use.map(([lx,lz])=>[x+lx*c+lz*s,z-lx*s+lz*c]); }
/** 이 자리에 놓을 수 있나: 테라리움 안, 다른 소품과 안 겹치고, 바퀴가 다가갈 자리가 남아 있어야 한다 */
function placeOK(inst,x,z,rot){
  const A=footShapes(inst,x,z,rot);
  for(const a of A) if(!shapeInTank(a,0.012)) return false;
  const others=world.props.filter(o=>o!==inst);
  const OB=others.map(o=>footShapes(o));
  for(const B of OB) for(const a of A) for(const b of B) if(shapesHit(a,b,0.034)) return false;
  const mine=usePoints(inst,x,z,rot); let ok=0;
  for(const [px,pz] of mine){ if(Math.abs(px)>TANK.hw-0.056||Math.abs(pz)>TANK.hd-0.056) continue; if(OB.some(B=>B.some(b=>shapePoint(b,px,pz,0.03)))) continue; ok++; }
  if(mine.length&&ok/mine.length<0.6) return false;
  for(const o of others){ const P=usePoints(o,o.x,o.z,o.rot); if(!P.length) continue; let bad=0; for(const [px,pz] of P) if(A.some(a=>shapePoint(a,px,pz,0.03))) bad++; if(bad/P.length>0.4) return false; }
  return true;
}
/** 빈자리 찾기: 다른 소품과 떨어지고, 앞면이 카메라 쪽을 보는 자리를 좋아한다 */
function findSpot(inst,{nearX=null,nearZ=null,rots=null}={}){
  const yaw=cam.yaw; let best=null, bs=-1e9;
  const R=rots||[0,PI/2,PI,-PI/2,PI/4,-PI/4,3*PI/4,-3*PI/4];
  const others=world.props.filter(o=>o!==inst);
  for(let x=-TANK.hw+0.05;x<=TANK.hw-0.05;x+=0.035) for(let z=-TANK.hd+0.05;z<=TANK.hd-0.05;z+=0.035){
    for(const r of R){
      if(!placeOK(inst,x,z,r)) continue;
      let dmin=0.6; for(const o of others) dmin=Math.min(dmin,Math.hypot(o.x-x,o.z-z));
      const face=Math.cos(wrapA(r-yaw)), diag=Math.abs(Math.sin(2*r))>0.5?-0.1:0;
      let sc=dmin+face*0.2+diag-0.1*Math.hypot(x/TANK.hw,z/TANK.hd)+rand(0.03);
      if(nearX!==null) sc-=Math.hypot(x-nearX,z-nearZ)*1.6;
      if(sc>bs){ bs=sc; best={x,z,r}; }
    }
  }

}
function nudgeSpot(inst){ const r=inst.rot; for(let d=0.02;d<=0.3;d+=0.02){ for(let k=0;k<16;k++){ const a=k/16*TAU, x=inst.x+Math.cos(a)*d, z=inst.z+Math.sin(a)*d; if(placeOK(inst,x,z,r)) return {x,z}; } } return null; }

function makeProp(k){
  const def=PROPS[k]; if(!def) return null;
  let inst; try{ inst=def.make(); }catch(e){ console.error(e); return null; }
  inst.k=k; inst.def=def; inst.x=0; inst.z=0; inst.rot=0; inst.id=k+'_'+Math.random().toString(36).slice(2,7);
  for(const s of inst.slots) s.prop=inst;
  try{ mergeStatic(inst); }catch(e){ console.warn(e); }
  inst.group.traverse(o=>{ o.userData.prop=inst; });
  inst.use=useLocal(inst);
  return inst;
}
function setPropPos(inst,x,z,rot=inst.rot){ inst.x=x; inst.z=z; inst.rot=rot; inst.group.position.set(x,inst.group.position.y,z); inst.group.rotation.y=rot; }
function addProp(inst){ propRoot.add(inst.group); world.props.push(inst); setPropPos(inst,inst.x,inst.z,inst.rot); }
function propCount(k){ return world.props.filter(p=>p.k===k).length; }
function evictUsers(inst){ for(const p of world.pets) if(p.usesProp(inst)) p.evict(); }
function removeProp(inst){
  evictUsers(inst);
  const i=world.props.indexOf(inst); if(i>=0) world.props.splice(i,1);
  propRoot.remove(inst.group);
  inst.group.traverse(o=>{ if(o.isMesh){ o.geometry?.dispose?.(); } });
}
function loadProps(){
  if(store.props===null){ // 처음: 바퀴박스 · 먹이 접시 · 분수 · 쳇바퀴. 가운데는 큰 놀이기구 자리로 비워 둔다
    for(const [k,x,z,r] of [['box',-0.24,-0.56,0],['fountain',0.27,-0.58,0],['dish',0.25,0.6,0],['wheel',-0.22,0.36,0]]){ const inst=makeProp(k); if(!inst) continue; let s=placeOK(inst,x,z,r)?{x,z,r}:findSpot(inst); if(s){ inst.x=s.x; inst.z=s.z; inst.rot=s.r; addProp(inst); } }
    store.props=[]; syncStore();
    return;
  }
  for(const r of store.props){ const inst=makeProp(r.k); if(!inst) continue; inst.x=r.x; inst.z=r.z; inst.rot=r.rot||0; if(inst.toggle) inst.on=!!r.on;
    if(!placeOK(inst,inst.x,inst.z,inst.rot)){ const n=nudgeSpot(inst); if(n){ inst.x=n.x; inst.z=n.z; } else { const f=findSpot(inst); if(!f) continue; inst.x=f.x; inst.z=f.z; inst.rot=f.r; } }
    addProp(inst); }
}
function propTop(inst,out=new THREE.Vector3()){ return out.set(inst.x,Math.min(inst.height||0.1,0.42)+0.03,inst.z); }

const edit={inst:null,orig:null,outline:null,ok:true,lift:0};
const _okM=new THREE.MeshBasicMaterial({color:'#5fd39a',transparent:true,opacity:0.32,depthWrite:false});
const _noM=new THREE.MeshBasicMaterial({color:'#ff6b5e',transparent:true,opacity:0.36,depthWrite:false});
function outlineGeo(inst){
  const geos=[];
  for(const f of inst.foot){ let g; if(f.r!==undefined){ g=new THREE.CircleGeometry(f.r+0.012,40); g.translate(f.x,-f.z,0); } else { const s=new THREE.Shape(); roundRect(s,(f.hw+0.012)*2,(f.hd+0.012)*2,0.014); g=new THREE.ShapeGeometry(s); g.translate(f.x,-f.z,0); }
    g.rotateX(-PI/2); geos.push(stripGeo(g.index?g.toNonIndexed():g)); }
  return mergeGeometries(geos,false);
}
function startEdit(inst){
  if(edit.inst&&edit.inst!==inst) finishEdit(true);
  if(edit.inst===inst) return;
  closeSheets(); stopFollow();
  edit.inst=inst; edit.orig={x:inst.x,z:inst.z,rot:inst.rot}; edit.lift=0;
  inst.editing=true; evictUsers(inst);
  edit.outline=new THREE.Mesh(outlineGeo(inst),_okM); edit.outline.renderOrder=1; fxRoot.add(edit.outline);
  setMode('edit'); S.lift();
}
function finishEdit(force=false){
  const inst=edit.inst; if(!inst) return true;
  if(!placeOK(inst,inst.x,inst.z,inst.rot)){
    const n=nudgeSpot(inst);
    if(n) setPropPos(inst,n.x,n.z);
    else if(!force){ toast('여기에는 놓을 수 없어요. 조금 옮겨 주세요.'); return false; }
    else setPropPos(inst,edit.orig.x,edit.orig.z,edit.orig.rot);
  }
  inst.editing=false; inst.group.position.y=0;
  if(edit.outline){ fxRoot.remove(edit.outline); edit.outline.geometry.dispose(); edit.outline=null; }
  edit.inst=null; setMode('watch'); S.place(inst.def.sound); saveSoon();
  return true;
}
function updateEdit(dt){
  const inst=edit.inst; if(!inst) return;
  edit.lift=damp(edit.lift,1,10,dt);
  inst.group.position.y=0.016*edit.lift+Math.sin(world.time*5)*0.002;
  edit.ok=placeOK(inst,inst.x,inst.z,inst.rot);
  const o=edit.outline; o.material=edit.ok?_okM:_noM; o.position.set(inst.x,0.0025,inst.z); o.rotation.y=inst.rot;
}

const alive=()=>world.pets.filter(p=>!p.dead);
const petName=p=>p.name;
function daysWith(r){ const end=r.dead?(r.diedAt||Date.now()):Date.now(); return Math.max(1,Math.floor((end-r.born)/DAY)+1); }
let limbShadows=true;
function updateShadowBudget(){ const on=world.pets.length<=12; if(on===limbShadows) return; limbShadows=on; for(const p of world.pets) for(const lg of p.m.legs){ lg.fem.children[0].castShadow=on; lg.knee.children[0].castShadow=on; } }
function spawnPet(rec){
  const p=new Pet(rec,world);
  const r=world.resolve(p.x,p.z,null); p.x=r.x; p.z=r.z;
  if(!p.dead) p.floorPose();
  p.snap=true; p.labelT=0; p.away=false;
  petRoot.add(p.m.g); world.pets.push(p);
  if(!limbShadows) for(const lg of p.m.legs){ lg.fem.children[0].castShadow=false; lg.knee.children[0].castShadow=false; }
  updateShadowBudget();
  return p;
}
function loadPets(){
  const now=Date.now(); const goneNow=[];
  for(const r of store.pets){ if(!r.dead&&now>r.born+r.life*DAY){ r.dead=true; r.diedAt=Math.round(r.born+r.life*DAY); } if(r.dead&&!r.toldDead){ goneNow.push(r); } }
  for(const r of store.pets) spawnPet(r);
  return goneNow;
}
/** 새 식구: 위에서 떨어뜨려 넣는다 */
function arrive(opts={}){
  if(store.pets.length>=CAP){ toast('테라리움이 꽉 찼어요.'); return null; }
  const rec={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),no:store.nextNo++,name:cleanName(opts.name),born:Date.now(),arrived:Date.now(),life:r4(rand(27,33)),size:r4(rand(0.95,1.06)),deco:{}};
  const spot=world.randomFree(40,false); rec.x=spot.x; rec.z=spot.z; rec.h=rand(TAU);
  store.pets.push(rec);
  const p=spawnPet(rec);
  p.setAct({type:'drop',y0:0.95}); p.tPos.set(p.x,0.95,p.z); p.snap=true; p.labelT=7;
  save(); postCount(); refreshHud();
  return p;
}
function checkAges(){
  const now=Date.now();
  for(const p of world.pets){
    if(p.dead||p.away) continue;
    p.updateAge(now);
    if(p.age01>=1&&p.act?.type!=='dying'){
      const t=p.act?.type;
      if(p.mode==='floor'&&!p.hidden&&['rest','walk','groom','meet','investigate','flee','feed'].includes(t)) p.startDying();
      else if(p.age01>1.004&&(p.hidden||p.mode!=='floor')){ p.evict(); }
    }
  }
}
EV.died=(p)=>{ p.rec.toldDead=1; toast(`${p.name}${jo(p.name,'이/가')} 천수를 누렸어요.`,3.2); if(cam.follow===p) stopFollow(); save(); refreshHud(); if(card.pet===p) openCard(p); };
function bury(p){
  const r=p.rec;
  store.graves.push({no:r.no,name:p.name,born:r.born,diedAt:r.diedAt||Date.now(),days:daysWith(r),flower:Math.floor(rand(FLOWERS.length))});
  removeFallenOf(p.id);
  store.pets=store.pets.filter(x=>x!==r);
  const i=world.pets.indexOf(p); if(i>=0) world.pets.splice(i,1);
  p.buried=true; petRoot.remove(p.m.g); updateShadowBudget();
  rebuildGraves(); S.bury();
  toast(`${p.name}${jo(p.name,'을/를')} 묻어 주었어요.`,3);
  save(); postCount(); refreshHud();
}

// ───────── 떨어진 모자·리본 (눌러서 다시 씌워 준다) ─────────
const fallen=[];
function makeFallenObj(f){
  const p=world.pets.find(q=>q.id===f.petId); const sc=ROACH_L*(p?.rec.size||1);
  let o;
  if(f.type==='hat'){ o=hatMesh(f.c||'#ff6f6f'); o.scale.setScalar(sc*0.52); }
  else { o=bowMesh(f.c||'#ff6fa8'); o.scale.setScalar(sc*0.2); }
  const w=new THREE.Group(); w.add(o); o.rotation.set(f.type==='hat'?1.25:0.3,0,f.type==='hat'?0.2:0);
  w.position.set(f.x,f.type==='hat'?0.011:0.004,f.z); w.rotation.y=f.r||0; scene.add(w);
  return w;
}
function spawnFallen(f,fromY){ const obj=makeFallenObj(f); const e={f,obj,y0:fromY,t:0}; obj.userData.baseY=obj.position.y; fallen.push(e); store.fallen.push(f); saveSoon(); return e; }
function loadFallen(){ for(const f of store.fallen){ if(!world.pets.some(p=>p.id===f.petId)) continue; const obj=makeFallenObj(f); obj.userData.baseY=obj.position.y; fallen.push({f,obj,t:9}); } store.fallen=fallen.map(e=>e.f); }
function disposeTree(o){ o.traverse(m=>{ if(!m.isMesh) return; m.geometry?.dispose?.(); for(const mt of Array.isArray(m.material)?m.material:[m.material]){ if(mt?.userData?.disposeMap) mt.map?.dispose(); mt?.dispose?.(); } }); }
function removeFallen(e){ scene.remove(e.obj); disposeTree(e.obj); const i=fallen.indexOf(e); if(i>=0) fallen.splice(i,1); store.fallen=fallen.map(x=>x.f); }
function removeFallenOf(id){ for(const e of fallen.filter(x=>x.f.petId===id)) removeFallen(e); }
function updateFallen(dt){ for(const e of fallen){ if(e.t>=0.6) continue; e.t+=dt; const k=Math.min(1,e.t/0.6); const b=e.obj.userData.baseY; e.obj.position.y=b+Math.max(0,(e.y0??b)-b)*(1-k*k)+Math.sin(k*PI)*0.012*(1-k); } }
EV.hatFall=(p)=>{ const D=p.rec.deco; if(!D?.hat||D.hat.on===false||p.away) return; D.hat.on=false; applyDeco(p.m,D);
  const a=p.h+PI+rand(-0.6,0.6); spawnFallen({type:'hat',petId:p.id,c:D.hat.c,x:clamp(p.x+Math.sin(a)*0.05,-TANK.hw+0.02,TANK.hw-0.02),z:clamp(p.z+Math.cos(a)*0.05,-TANK.hd+0.02,TANK.hd-0.02),r:rand(TAU)},p.pos.y+0.03); S.pop(); };
EV.bowFall=(p)=>{ const D=p.rec.deco; if(!D?.abow||D.abow.on===false||p.away) return; D.abow.on=false; applyDeco(p.m,D);
  const a=p.h+rand(-0.8,0.8); spawnFallen({type:'bow',petId:p.id,c:D.abow.c,x:clamp(p.x+Math.sin(a)*0.07,-TANK.hw+0.02,TANK.hw-0.02),z:clamp(p.z+Math.cos(a)*0.07,-TANK.hd+0.02,TANK.hd-0.02),r:rand(TAU)},p.pos.y+0.02); S.pop(); };
function restoreFallen(e){
  const p=world.pets.find(q=>q.id===e.f.petId); removeFallen(e);
  if(p&&!p.dead){ const D=p.rec.deco||(p.rec.deco={}); if(e.f.type==='hat'&&D.hat) D.hat.on=true; if(e.f.type==='bow'&&D.abow) D.abow.on=true; applyDeco(p.m,D); p.inspectT=Math.max(p.inspectT,5); p.labelT=Math.max(p.labelT,2.5);
    toast(e.f.type==='hat'?`${p.name}에게 모자를 다시 씌워 줬어요.`:`${p.name}에게 리본을 다시 달아 줬어요.`); }
  S.restore(); saveSoon();
}

const cam={yaw:0,pitch:0.95,dist:3,tgt:new THREE.Vector3(0,0.16,0),
  g:{yaw:0,pitch:0.95,dist:3,tgt:new THREE.Vector3(0,0.16,0)},
  home:{yaw:0,pitch:0.95,dist:3,tgt:new THREE.Vector3(0,0.16,0)},
  fit:3,sfit:1,follow:null,idle:0,mode:'tank',saved:null,offY:0,offGoal:0,offX:0,offXGoal:0,sway:0};
const MARGIN={top:66,bottom:96,left:10,right:10};
const VIEW={pYaw:0.12,pPitch:1.04,pFov:30,lYaw:1.05,lPitch:0.9,lFov:30};
function placeCam(yaw,pitch,dist,tgt,c=camera){ c.position.set(tgt.x+Math.sin(yaw)*Math.cos(pitch)*dist,tgt.y+Math.sin(pitch)*dist,tgt.z+Math.cos(yaw)*Math.cos(pitch)*dist); c.lookAt(tgt); c.updateMatrixWorld(true); }
function applyOffset(){ const w=innerWidth,h=innerHeight; if(Math.abs(cam.offY)<0.5&&Math.abs(cam.offX)<0.5) camera.clearViewOffset(); else camera.setViewOffset(w,h,cam.offX,cam.offY,w,h); camera.updateProjectionMatrix(); }
const _corners=[]; for(const sx of [-1,1]) for(const sz of [-1,1]) for(const y of [DESK_Y,TANK.h+0.01]) _corners.push(new THREE.Vector3(sx*(TANK.hw+0.028),y,sz*(TANK.hd+0.028)));
const _tc=new THREE.PerspectiveCamera();
/** 테라리움이 위아래 버튼에 안 가리고 화면에 꽉 차는 거리 */
function fitDist(yaw,pitch,tgt,{w=innerWidth,h=innerHeight,m=MARGIN}={}){
  _tc.copy(camera); _tc.aspect=w/h; const oy=(m.bottom-m.top)/2, ox=(m.right-m.left)/2; if(Math.abs(oy)>0.5||Math.abs(ox)>0.5) _tc.setViewOffset(w,h,ox,oy,w,h); else _tc.clearViewOffset(); _tc.updateProjectionMatrix();
  const xr=1-2*m.right/w, xl=-1+2*m.left/w, yt=1-2*m.top/h, yb=-1+2*m.bottom/h, v=new THREE.Vector3();
  let lo=0.6, hi=14;
  for(let it=0;it<26;it++){ const d=(lo+hi)/2; placeCam(yaw,pitch,d,tgt,_tc); let ok=true; for(const c of _corners){ v.copy(c).project(_tc); if(v.z>1||v.x>xr||v.x<xl||v.y>yt||v.y<yb){ ok=false; break; } } if(ok) hi=d; else lo=d; }
  return hi;
}
function computeHome(){
  const portrait=innerHeight>=innerWidth*1.05;

async function savePhoto(){
  if(!photoBlob) return;
  const name=`테라리움-${new Date().toISOString().slice(0,10)}.jpg`;
  try{ const f=new File([photoBlob],name,{type:'image/jpeg'}); if(navigator.canShare?.({files:[f]})){ await navigator.share({files:[f]}); return; } }catch(e){ if(e?.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=photoUrl; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  toast('사진을 저장했어요.');
}
$('photo').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; e.stopPropagation(); S.ui(); if(b.dataset.a==='photoSave') savePhoto(); else { $('photo').classList.remove('show'); $('photo').setAttribute('aria-hidden','true'); } });

// ══════════════════════════════════════════════════════════════════
// 누르기
// ══════════════════════════════════════════════════════════════════
function wakeUi(){ uiIdle=0; cam.idle=0; setCalm(false); }
const ptrs=new Map(); let gest=null;
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  SFX.ensure(); wakeUi();
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY});
  if(ptrs.size===1){
    gest={kind:'one',id:e.pointerId,x0:e.clientX,y0:e.clientY,t0:performance.now(),moved:false,long:false,drag:false,pan:e.button===2||e.button===1,mouse:e.pointerType==='mouse',lt:0};
    if(mode==='deco') return;
    const pr=pickProp(e.clientX,e.clientY);
    if(mode==='edit'&&pr&&pr===edit.inst){ gest.drag=true; const f=floorHit(e.clientX,e.clientY); gest.off=f?{x:pr.x-f.x,z:pr.z-f.z}:{x:0,z:0}; }
    else if(pr&&(mode==='watch'||mode==='edit')&&!gest.pan){
      gest.lt=setTimeout(()=>{ if(!gest||gest.moved||gest.kind!=='one') return; gest.long=true; startEdit(pr); const f=floorHit(gest.x0,gest.y0); gest.off=f?{x:pr.x-f.x,z:pr.z-f.z}:{x:0,z:0}; gest.drag=true; try{ navigator.vibrate?.(12); }catch(err){} },430);
    }
  } else if(ptrs.size===2){
    if(gest?.lt) clearTimeout(gest.lt);
    const [a,b]=[...ptrs.values()]; gest={kind:'two',d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};
  }
});
canvas.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId); if(!p) return;
  p.px=p.x; p.py=p.y; p.x=e.clientX; p.y=e.clientY;
  if(!gest) return;
  if(gest.kind==='one'&&gest.id===e.pointerId){
    if(!gest.moved&&Math.hypot(p.x-gest.x0,p.y-gest.y0)>(gest.mouse?5:9)){ gest.moved=true; if(gest.lt) clearTimeout(gest.lt); }
    if(!gest.moved) return;
    wakeUi();
    if(gest.drag&&edit.inst){ const f=floorHit(p.x,p.y); if(f){ const inst=edit.inst; setPropPos(inst,clamp(f.x+gest.off.x,-TANK.hw,TANK.hw),clamp(f.z+gest.off.z,-TANK.hd,TANK.hd)); } return; }
    if(gest.pan) panBy(p.x-p.px,p.y-p.py); else orbit(p.x-p.px,p.y-p.py);
  } else if(gest.kind==='two'&&ptrs.size>=2){
    const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    if(gest.d>10&&d>10) zoomBy(gest.d/d);
    panBy(mx-gest.mx,my-gest.my);
    gest.d=d; gest.mx=mx; gest.my=my; wakeUi();
  }
});
function endPtr(e,cancel){
  const p=ptrs.get(e.pointerId); ptrs.delete(e.pointerId);
  if(!gest) return;
  if(gest.kind==='one'&&gest.id===e.pointerId){
    if(gest.lt) clearTimeout(gest.lt);
    if(!cancel&&!gest.moved&&!gest.long&&performance.now()-gest.t0<650) tap(gest.x0,gest.y0,gest.mouse);
    gest=null;
  } else if(gest.kind==='two'){ if(ptrs.size<2) gest=ptrs.size===1?{kind:'one',id:[...ptrs.keys()][0],x0:0,y0:0,t0:0,moved:true,long:false,drag:false,pan:false}:null; }
}
canvas.addEventListener('pointerup',e=>endPtr(e,false));
canvas.addEventListener('pointercancel',e=>endPtr(e,true));
canvas.addEventListener('wheel',e=>{ e.preventDefault(); wakeUi(); zoomBy(Math.exp(clamp(e.deltaY,-120,120)*0.0016)); },{passive:false});
window.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(e.target?.tagName==='INPUT'){ e.target.blur(); return; } if($('photo').classList.contains('show')) $('photo').classList.remove('show'); else if(anySheet()) closeSheets(); else if(mode==='edit') finishEdit(true); else if(mode==='pick') setMode('watch'); else if(mode==='deco') finishDeco(); else if(EMBED) try{ parent.postMessage({type:'bamung-close'},location.origin); }catch(err){} } });

function startPick(){ closeSheets(); const L=alive(); if(!L.length){ toast(world.pets.length?'꾸밀 수 있는 바퀴가 없어요.':'아직 꾸밀 바퀴가 없어요.'); return; } if(L.length===1){ startDeco(L[0]); return; } setMode('pick'); toast('꾸밀 바퀴를 눌러 주세요.'); S.ui(); }
function tap(x,y,mouse){
  if(mode==='deco'){ decoTap(x,y); return; }
  if(anySheet()){ closeSheets(); return; }
  if(mode==='edit'){ const pr=pickProp(x,y); if(pr===edit.inst) return; if(pr){ if(finishEdit()) startEdit(pr); return; } finishEdit(); return; }
  const f=pickFallen(x,y); if(f){ restoreFallen(f); return; }
  const p=pickPet(x,y,mouse,mode==='pick'?(q=>!q.dead):null);
  if(p){
    if(mode==='pick'){ setMode('watch'); startDeco(p); return; }
    if(p.dead){ openCard(p); return; }
    if(p.labelT>0.4){ openCard(p); return; }
    p.labelT=4.5; p.lookT=1.8; camera.getWorldPosition(_v); _v.sub(p.pos).normalize(); _v.applyQuaternion(p.m.g.quaternion.clone().invert()); p.lookDir.copy(_v).setY(Math.max(0.35,_v.y)).normalize(); S.pip();
    return;
  }
  const gv=pickGrave(x,y); if(gv){ const i=store.graves.indexOf(gv); const pot=graveRoot.children.find(c=>c.userData.grave===gv); flash('g'+i,`${gv.name} · ${gv.days}일`,(pot?pot.position.clone():new THREE.Vector3()).add(new THREE.Vector3(0,0.13,0)),3,'soft'); S.ui(); return; }
  ray.setFromCamera(ndc(x,y),camera); if(ray.intersectObject(salon,true).length){ startPick(); return; }
  const pr=pickProp(x,y);
  if(pr){
    if(pr.toggle&&pr.tap){ pr.tap(PCTX); saveSoon(); return; }
    const inside=world.pets.filter(q=>q.hidden&&q.act?.slot?.prop===pr);
    if(inside.length){ for(const q of inside) q.labelT=4; S.ui(); return; }
    flash('p'+pr.id,pr.def.label,propTop(pr),1.8,'soft'); return;
  }
  if(mode==='pick'){ setMode('watch'); return; }
}

$('bar').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; e.stopPropagation(); S.ui(); wakeUi();
  const a=b.dataset.a;
  if(a==='props'){ if(sheet.classList.contains('open')) closeSheets(); else openProps(); }
  else if(a==='deco'){ if(mode==='pick'){ setMode('watch'); return; } startPick(); }
  else if(a==='names'){ namesAll=!namesAll; refreshHud(); }
  else if(a==='photo'){ takePhoto(); }
});
$('editBar').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b||!edit.inst) return; e.stopPropagation(); wakeUi();
  const a=b.dataset.a, inst=edit.inst;
  if(a==='rotate'){ setPropPos(inst,inst.x,inst.z,inst.rot+PI/4); S.ui(); }
  else if(a==='remove'){ const name=inst.def.label; inst.editing=false; if(edit.outline){ fxRoot.remove(edit.outline); edit.outline.geometry.dispose(); edit.outline=null; } edit.inst=null; removeProp(inst); setMode('watch'); S.remove(); saveSoon(); toast(`${name}${jo(name,'을/를')} 치웠어요.`); }
  else if(a==='done'){ finishEdit(); }
});

// ══════════════════════════════════════════════════════════════════
// 돌리기
// ══════════════════════════════════════════════════════════════════
let raf=0, last=0, awake=false, ageClock=0, saveClock=20, perfT=0, perfN=0, perfSum=0, homeShown=false;
let dprCap=Math.min(window.devicePixelRatio||1,1.75);
function measureMargins(){
  const bar=$('bar'), cs=getComputedStyle(bar), side=lowLand();
  const hud=$('hud'); const top=parseFloat(getComputedStyle(hud).top)||16;
  MARGIN.top=Math.max(56,top+40); MARGIN.left=10;
  if(side){ if(bar.offsetWidth){ MARGIN.right=bar.offsetWidth+(parseFloat(cs.right)||12)+10; } MARGIN.bottom=14; }
  else { MARGIN.right=10; const bot=parseFloat(cs.bottom)||14; if(bar.offsetHeight) MARGIN.bottom=Math.max(70,bar.offsetHeight+bot+10); }
}
/** 가로로 눕힌 폰처럼 낮은 화면: 아래 버튼 줄을 오른쪽에 세운다 */
function lowLand(){ return innerWidth>innerHeight&&innerHeight<=520; }
function resize(keep=false){
  const w=Math.max(1,innerWidth), h=Math.max(1,innerHeight);
  renderer.setPixelRatio(dprCap); renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.fov=h>=w*1.05?VIEW.pFov:VIEW.lFov;
  measureMargins(); applyOffset(); sizeTalk();
  const away=camAway(); computeHome();
  if(!keep&&!away&&cam.mode==='tank'&&!cam.follow) goHome();
}
window.addEventListener('resize',()=>resize());
const PUSH_ACTS=new Set(['rest','walk','groom','meet','talk','investigate','flee','feed','onback','dead','dying']);
/** 소품을 바퀴 위에 놓거나 끌고 지나가면 밑에 있던 놈은 밀려나며 놀라 도망간다 */
function pushOut(){
  for(const p of world.pets){
    if(p.away||p.mode!=='floor') continue; const a=p.act; if(!a||!PUSH_ACTS.has(a.type)) continue;
    for(const pr of world.props){ if(p.ignore===pr) continue; const o=world.inFoot(pr,p.x,p.z,0.018); if(!o) continue;
      p.x+=o.nx*(o.pen+0.004); p.z+=o.nz*(o.pen+0.004); const r=world.resolve(p.x,p.z,null); p.x=r.x; p.z=r.z;
      if(!p.dead&&a.type!=='dying'){ p.floorPose(); if(a.type!=='flee'&&a.type!=='onback') p.startFlee(pr.x,pr.z,rand(0.8,1.4)); } }
  }
}
function step(dt){
  world.time+=dt;
  for(const inst of world.props){ try{ inst.update?.(dt,world.time,PCTX); }catch(e){} updatePokes(inst,dt); }
  for(const p of world.pets){ if(p.away) continue; try{ p.update(dt); }catch(e){ console.error(e); p.snap=true; try{ p.setAct({type:'rest',dur:3}); p.floorPose(); }catch(_){} } }
  pushOut();
  world.updateTalk(dt,mode==='watch');
  for(const p of world.pets) if(p.labelT>0) p.labelT=Math.max(0,p.labelT-dt);
  for(const t of transient) t.t-=dt;
  updateEdit(dt); updateFallen(dt); updateFx(dt); animateSalon(dt);
  ageClock-=dt; if(ageClock<=0){ ageClock=2.5; checkAges(); }
  if(saveIn>0){ saveIn-=dt; if(saveIn<=0) save(); }
  saveClock-=dt; if(saveClock<=0){ saveClock=20; save(); }
  if(toastT>0){ toastT-=dt; if(toastT<=0) $('toast').classList.remove('show'); }
  uiIdle+=dt; if(!calm&&uiIdle>10&&mode==='watch'&&!anySheet()&&!$('photo').classList.contains('show')) setCalm(true);
  const away=camAway()&&mode==='watch'; if(away!==homeShown){ homeShown=away; $('viewHome').classList.toggle('show',away); }
  updateLoops(dt);
}
function draw(dt){ updateCamera(dt); updateLabels(dt); renderer.render(scene,camera); drawTalk(dt); }
function frame(ts){
  raf=requestAnimationFrame(frame);
  const t=ts/1000; let dt=last?t-last:1/60; last=t;
  const d=Math.min(Math.max(dt,0),0.05);
  step(d); draw(d);
  // 느린 기기: 해상도를 조금씩 낮춘다
  perfT+=dt; perfSum+=dt; perfN++;
  if(perfT>3){ const avg=perfSum/perfN; perfT=0; perfSum=0; perfN=0; if(avg>0.034&&dprCap>1.01){ dprCap=Math.max(1,dprCap-0.25); resize(true); } }
}
let wakeLock=null;
async function holdScreen(){ try{ if(awake&&!wakeLock&&navigator.wakeLock&&document.visibilityState==='visible'){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener?.('release',()=>{ wakeLock=null; }); } }catch(e){ wakeLock=null; } }
function releaseScreen(){ try{ wakeLock?.release?.(); }catch(e){} wakeLock=null; }
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ save(); SFX.suspend(); releaseScreen(); } else if(awake){ last=0; if(!paused) SFX.resume(); holdScreen(); checkAges(); } });
window.addEventListener('pagehide',()=>save());

// ══════════════════════════════════════════════════════════════════
// 바깥(게임 창)과 주고받기
// ══════════════════════════════════════════════════════════════════
function countInfo(){ const n=alive().length; return {alive:n,total:store.pets.length,cap:CAP,nextNo:store.nextNo}; }
function postCount(){ if(EMBED) try{ parent.postMessage({type:'bamung-count',...countInfo()},location.origin); }catch(e){} }
let toldGone=null;
function wake(){
  paused=false;
  if(awake){ if(!raf) raf=requestAnimationFrame(frame); return api; } awake=true; last=0; wakeUi();
  resize(true); if(!camAway()) goHome(true);
  checkAges(); refreshHud(); SFX.resume(); holdScreen();
  if(!raf) raf=requestAnimationFrame(frame);
  if(toldGone&&toldGone.length){ const L=toldGone; toldGone=null; const nm=L[0].name||`${L[0].no}호`; setTimeout(()=>toast(L.length>1?`${nm} 외 ${L.length-1}마리가 천수를 누렸어요.`:`${nm}${jo(nm,'이/가')} 천수를 누렸어요.`,3.4),700); for(const r of L) r.toldDead=1; save(); }
  return api;
}
function sleep(){
  if(deco.pet) finishDeco();
  if(edit.inst) finishEdit(true);
  closeSheets(); $('photo').classList.remove('show'); if(mode==='pick') setMode('watch');
  world.endTalk(); talkView.clear(); talkG.clearRect(0,0,innerWidth,innerHeight);
  paused=false;
  if(!awake) return api; awake=false;
  if(raf){ cancelAnimationFrame(raf); raf=0; }
  SFX.suspend(); releaseScreen(); save();
  return api;
}
let paused=false;
function pause(){ if(!awake||paused) return api; paused=true; if(raf){ cancelAnimationFrame(raf); raf=0; } SFX.suspend(); return api; }
function resume(){ if(!paused) return api; paused=false; if(awake){ last=0; SFX.resume(); if(!raf) raf=requestAnimationFrame(frame); } return api; }
/** o.arrive={name}: 새로 데려온 놈을 넣는다 */
function enter(o={}){
  wake(); let added=null;
  if(o.arrive){ const p=arrive(o.arrive); if(p){ added={id:p.id,no:p.rec.no,name:p.name}; stopFollow(); } }
  return added;
}
function reset(){ if(deco.pet) finishDeco(); if(edit.inst) finishEdit(true); closeSheets(); stopFollow(); goHome(true); return api; }
const api={enter,sleep,wake,reset,pause,resume,count:countInfo,
  _debug:{world,cam,VIEW,resize,get store(){return store;},step(sec=1,dt=1/30){ const n=Math.max(1,Math.round(sec/dt)); for(let i=0;i<n;i++){ step(dt); updateCamera(dt); } draw(dt); return n; },draw:()=>draw(1/60),arrive,startDeco,finishDeco,openCard,openProps,takePhoto,startEdit,finishEdit,
    addProp(k){ const inst=makeProp(k); if(!inst) return null; const s=findSpot(inst); if(!s) return null; inst.x=s.x; inst.z=s.z; inst.rot=s.r; addProp(inst); saveSoon(); return inst; },
    removeProp, info:()=>({calls:renderer.info.render.calls,tris:renderer.info.render.triangles,geos:renderer.info.memory.geometries,tex:renderer.info.memory.textures}),
    age(id,days){ const p=world.pets.find(q=>q.id===id)||world.pets[0]; if(!p) return; p.rec.born-=days*DAY; p.updateAge(Date.now()); return p.age01; },
    pets:()=>world.pets.map(p=>({id:p.id,name:p.name,act:p.act?.type,kind:p.act?.kind||p.act?.slot?.type,x:+p.x.toFixed(3),z:+p.z.toFixed(3),y:+p.pos.y.toFixed(3),hidden:p.hidden,dead:p.dead,mode:p.mode})),
    setMode, toast, setCam(yaw,pitch,dist,tx=0,ty=0.14,tz=0){ cam.g.yaw=cam.yaw=yaw; cam.g.pitch=cam.pitch=pitch; cam.g.dist=cam.dist=dist; cam.g.tgt.set(tx,ty,tz); cam.tgt.set(tx,ty,tz); },
    get mode(){return mode;}, get deco(){return deco;}, get edit(){return edit;},
    talk:()=>{ const T=world.talk; return T?{a:T.a.name,b:T.b.name,i:T.i,phase:T.phase,lines:T.lines,shown:talkView.list.length}:null; },
    startTalk(i=0,j=1,walk=false){ const L=alive(); if(!L[i]||!L[j]) return false; return world.startTalk(L[i],L[j],walk); },
    screenOf(id){ const p=world.pets.find(q=>q.id===id); if(!p) return null; const o=toScreen(p.pos,{}); return {x:o.x,y:o.y,ok:o.ok}; },
    screenOfProp(k){ const p=world.props.find(q=>q.k===k); if(!p) return null; const o=toScreen(new THREE.Vector3(p.x,0.03,p.z),{}); return {x:o.x,y:o.y,ok:o.ok}; }, labels:()=>[...labelBox.children].filter(e=>e.classList.contains('show')).map(e=>e.textContent)}};
window.Bamung=api;

// ══════════════════════════════════════════════════════════════════
// 시작
// ══════════════════════════════════════════════════════════════════
try{
  loadProps();
  toldGone=loadPets();
  loadFallen();
  rebuildGraves();
  resize(); goHome(true); refreshHud();
  document.fonts?.load?.('700 60px Gaegu').then(()=>{ for(const p of world.pets) if(p.rec.deco?.text) applyDeco(p.m,p.rec.deco); }).catch(()=>{});
  document.fonts?.load?.('700 16px Gaegu',TALKS.flat().join('')).catch(()=>{});   // 말풍선 글자 묶음을 미리 받아 둔다
  try{ renderer.compile(scene,camera); }catch(e){}
  draw(0.016);
  if(EMBED){ parent.postMessage({type:'bamung-ready',...countInfo()},location.origin); }
  else wake();
}catch(e){ console.error(e); showError('테라리움을 여는 중에 문제가 생겼어요. 새로고침해 주세요.'); }
</script>
